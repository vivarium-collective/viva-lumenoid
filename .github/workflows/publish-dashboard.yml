# REPO-SPECIFIC (intentionally de-stamped from viva-template): this workspace
# publishes its dashboard/reports with a plain `uv sync --extra dev`. The
# provenance stamp is removed so check-workflow-freshness.py skips it.

name: Publish read-only workbench

# Build the workspace into a self-contained static SPA snapshot and publish it
# to the gh-pages branch at workbench/ (served at
# <user>.github.io/<repo>/workbench/). The READ-ONLY mirror of every
# investigation + study on main — browsable with no server.
# (A legacy /dashboard/ path is kept as a redirect to /workbench/.)
#
# One-time setup: Settings → Pages → Source = "Deploy from a branch" → gh-pages.
#
# DEPLOY job (post-merge to main), NOT a PR gate — a failure here never blocks a
# merge. It writes workbench/ (+ a dashboard/ redirect) on gh-pages.

on:
  push:
    branches: [main]
    paths:
      - 'workspace/**'
      - 'viva_lumenoid/**'
      - 'pyproject.toml'
      - 'scripts/publish_dashboard.sh'
      - '.github/workflows/publish-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: publish-dashboard
  cancel-in-progress: true

permissions:
  contents: write   # push to the gh-pages branch

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.9

      - name: Install publish environment
        run: |
          uv venv .venv --python 3.12.9
          source .venv/bin/activate
          uv sync --extra dev

      - name: Build read-only workbench snapshot
        # base-path / interactive-url are derived from the GitHub repo.
        run: |
          source .venv/bin/activate
          PYTHONPATH="$PWD" bash scripts/publish_dashboard.sh \
            reports/published/workbench \
            "/${{ github.event.repository.name }}/workbench" \
            "${{ github.server_url }}/${{ github.repository }}"

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          if [ ! -f reports/published/workbench/index.html ]; then
            echo "::error::build produced no bundle (no index.html); nothing to publish"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Worktree on gh-pages, bootstrapping the branch on first publish.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add /tmp/ghp gh-pages
          else
            echo "gh-pages does not exist yet — bootstrapping it"
            git worktree add --detach /tmp/ghp
            ( cd /tmp/ghp && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true )
          fi
          rm -rf /tmp/ghp/workbench
          mkdir -p /tmp/ghp/workbench
          cp -R reports/published/workbench/. /tmp/ghp/workbench/
          # Legacy /dashboard/ path → redirect to /workbench/.
          rm -rf /tmp/ghp/dashboard
          mkdir -p /tmp/ghp/dashboard
          printf '<!doctype html><meta charset="utf-8"><title>%s</title><meta http-equiv="refresh" content="0; url=../workbench/"><link rel="canonical" href="../workbench/"><script>location.replace("../workbench/"+location.search+location.hash)</script><a href="../workbench/">read-only workbench →</a>\n' "${{ github.event.repository.name }}" > /tmp/ghp/dashboard/index.html
          touch /tmp/ghp/.nojekyll
          cd /tmp/ghp
          git add -A
          if git diff --cached --quiet; then
            echo "read-only workbench snapshot unchanged; skipping commit"
          else
            git commit -m "gh-pages: republish read-only workbench (automated, ${GITHUB_SHA::7})"
            git push origin gh-pages
            echo "published read-only workbench to gh-pages:workbench/ (+ dashboard/ redirect)"
          fi
