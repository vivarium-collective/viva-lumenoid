[project]
name = "lumenoid"
version = "0.0.0"
description = "Process-bigraph research workspace"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph",
    "bigraph-schema",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    # Simularium: turn emitted bead positions into .simularium trajectories the
    # workbench's Analysis tab → Simularium Viewer browses. `viva-simularium` is
    # the generic viva seam (write_simularium + SimulariumAnalysis); `simulariumio`
    # does the encoding.
    "simulariumio",
    "viva-simularium",
    # Web-based workspace dashboard (server + templates + assets + lib helpers).
    # Extracted from viva-template as of v0.4.16; provides the `vivarium-workbench
    # serve` CLI invoked by scripts/serve.sh.
    "vivarium-workbench",
    # The discovery engine (investigation/study framework + the AI-drivable cycle).
    # Pinned to the 0.3.x line: viva-superpowers @ main imports
    # `discovery_engine.reporting.*` (test_contract/test_diff/test_vocab), the
    # subpackage introduced in 0.3.x — so 0.2.x breaks `build_core` at publish time.
    "viva-discovery-engine>=0.3,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jsonschema[format-nongpl]>=4.21"]
# The two wrapped simulators this workspace builds on. `viva-lammps` is the
# distribution name of viva-lammps (LAMMPSProcess); `viva-smoldyn` is held for
# stage 3 (surface binders / flexible fibers). NOTE: both still declare a git
# dep on `pbg-superpowers`, which now publishes as `viva-superpowers` — the name
# mismatch makes a plain resolve fail, so for local dev install them editable
# with `--no-deps` from the sibling checkouts:
#     uv pip install --no-deps -e ../viva-lammps -e ../viva-smoldyn
# LAMMPS itself must be provided by the environment (the PyPI `lammps` wheel is
# MPICH-linked; on macOS point it at homebrew's MPI-free liblammps_serial).
engines = ["viva-lammps", "viva-smoldyn", "lammps"]
# Runtime libraries the vivarium-tyssue engine needs to actually RUN the Tyssue
# composites (R4/R5/E3): tyssue itself + its hdf5 (tables), image (scikit-image)
# and units (quantities) deps. The engine is installed editable --no-deps (see the
# note above + README), so these are declared here and locked so the SERVING venv
# is reproducible: `uv pip install .[tyssue-serve]`. The numpy-2.x 2D-cross shim
# that tyssue's 2D geometry needs lives in viva_lumenoid.tyssue_coupling (applied
# automatically when a Tyssue composite builds).
tyssue-serve = ["tyssue>=1.0", "scikit-image", "tables", "quantities"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (viva-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

# Declare the workspace Python package explicitly so this workspace is
# pip-installable (e.g. `pip install git+<repo>@<sha>`).  sms-api injects it
# as an extra_pip_dep so the container runner can import the workspace's
# processes from a committed + pushed git ref.
[tool.hatch.build.targets.wheel]
packages = ["viva_lumenoid"]

[tool.uv]
# Transitive consumers (e.g. viva-simularium) conservatively cap
# viva-discovery-engine low. Force the 0.3.x line across the whole graph so it
# matches viva-superpowers @ main (which requires >=0.3,<0.4 and imports the
# discovery_engine.reporting subpackage); without this the resolver drops back to
# 0.2.x and build_core fails to import at publish time. Localized to this resolve.
override-dependencies = ["viva-discovery-engine>=0.3,<0.4"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
# viva-discovery-engine resolves from PyPI (>=0.3,<0.4 -> 0.3.1), which ships the
# discovery_engine.reporting subpackage. viva-superpowers tracks main again: its
# __init__ imports `discovery_engine.reporting.test_contract`, now satisfied by the
# 0.3.x floor above. (It was temporarily pinned to rev 88faa72 / 0.25.0 while the
# floor sat at 0.2.x; moving both in lockstep is the documented upgrade path.)
viva-superpowers = { git = "https://github.com/vivarium-collective/viva-superpowers.git", branch = "main" }
viva-lammps = { git = "https://github.com/vivarium-collective/viva-lammps.git", branch = "main" }
viva-smoldyn = { git = "https://github.com/vivarium-collective/viva-smoldyn.git", branch = "main" }
viva-simularium = { git = "https://github.com/vivarium-collective/viva-simularium.git", branch = "main" }
