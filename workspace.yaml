schema_version: 2
name: lumenoid
created: "2026-09-30"
plugin_version: 0.4.16
package_path: viva_lumenoid

# Directory layout. New workspaces group their research directories under a
# tidy `workspace/` subtree (the dirs below); the hidden `.pbg/` machine state
# stays at the root like `.git/`. Tooling (dashboard, lint, skills) resolves
# these via the shared WorkspacePaths resolver. Any key you remove falls back
# to its flat top-level default — so you can move things back if you prefer.
layout:
  studies: workspace/studies
  investigations: workspace/investigations
  composites: workspace/composites
  references: workspace/references
  datasets: workspace/datasets
  reports: workspace/reports

# The four arrays below start empty; the dashboard populates them as you
# work. Hand-editing is fine for small adds, but the dashboard's writers
# also keep cross-references (studies, runs, viz wiring) consistent.

# Observable specs: name + store_path + index_by. Populated by the Studies
# tab when you declare a behavior_test or readout. See .pbg/schemas/study.schema.json
# (readouts section) for shape.
observables:
  - name: sigma_inplane
    store_path: network/sigma_inplane
    units: kT/a^3
    description: In-plane network stress (bond virial only, V0-normalised).
  - name: n_crosslinks
    store_path: network/n_crosslinks
    units: count
    description: NC1/7S crosslink bonds (total minus intra-rod).
  - name: strain
    store_path: network/strain
    units: dimensionless
    description: Equibiaxial in-plane engineering strain.

# Expert source documents (the AICS-Lumenoids v1 spec + diagram) that back the
# investigation's claims and parameters.
expert_docs:
  - name: basement-membrane-v1-spec
    path: workspace/references/basement-membrane-v1-spec.md
    description: >
      AICS-Lumenoids "Basement membrane — v1 model specification" (Roam export
      2026-09-30). The source of every v1 parameter and open decision.
  - name: lumenoid-basement-membrane-diagram
    path: workspace/references/lumenoid-basement-membrane-diagram.svg
    description: Diagrammatic version of the same v1 specification.
  - name: cross-check-vs-released-code
    path: workspace/references/cross-check-vs-released-code.md
    description: >
      Parameter-by-parameter comparison of the clean-room build against the
      authors' released LAMMPS code (Zenodo 10.5281/zenodo.20719515). Finds the
      released model is bending-stabilized, not central-force — overturning the
      floppy premise of bm-v3/bm-v4 — plus bond-stiffness, rod-length, cutoff,
      break-mechanism and GCE divergences.

# Visualization wiring (address + config). Populated by the Visualizations
# tab and /viva-viz.
visualizations: []

# Reproducible simulation specs (composite + steps + params). Populated by
# the Composites tab "Run" button and by `/viva-study run-baseline`.
simulations: []

# Workspace-scoped datasets (file path + format + provenance). Populated by
# the Inputs tab "Attach dataset" action.
datasets: []

references_bib: workspace/references/papers.bib
server:
  enabled: false
