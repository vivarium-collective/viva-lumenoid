schema_version: 4
name: bm-r5-explicit-3d-confinement
title: "Explicit 3D cell confinement"
created: "2026-09-30"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted
confidence: Investigating

claim: >
  The explicit 3D epithelial monolayer runs over the Tyssue engine and per-cell heights and
  volumes emerge directly from the apical/lateral/basal surface energies and volume targets --
  no thin-prism approximation: 206 cells with finite, positive volumes (0.58-1.16) and a
  monolayer z-extent of ~1.0. The no-BM / elastic-BM / relaxing-BM controls the morphology
  comparison needs are not yet in the composite.

experiment: >
  Build the tyssue_3d_monolayer composite (an explicit Monolayer geometry over the
  vivarium-tyssue engine with apical, basal and lateral faces and per-cell volume targets) and
  step the EulerSolver. Reconstruct the mesh counts (cells, faces, vertices), read every
  per-cell basal area and volume off cell_df, read the z-extent off the vertices (the emergent
  monolayer height), and confirm the geometry stays finite and positive across several Euler
  steps (dt 0.01). This is a qualitative spatial-engine check -- that explicit 3D cell heights
  and volumes emerge and stay well-posed -- not yet the quantitative BM-relaxation morphology
  comparison.

result: >
  The 3D monolayer resolves and relaxes deterministically. The mesh carries 206 cells, 1590
  faces and 820 vertices; per-cell basal area ranges 4.51-6.38 and per-cell volume 0.58-1.16,
  all finite and positive. The monolayer z-extent is ~1.0 (vertices span z in [-1.0, 0.0]), so
  per-cell height emerges from the explicit surface energies and volume targets rather than
  from a prism approximation. Stepping the EulerSolver five times (dt 0.01) keeps per-cell area
  and volume finite and positive -- no NaN or blow-up (the face-level volume column is NaN by
  construction, since faces carry no enclosed volume in a monolayer). The honest gap: the no-BM,
  elastic-BM and relaxing-BM controls that the Fig target morphology ordering needs are not in
  the composite yet, so the "taller under slow relaxation" ordering is not tested here.

pipeline_gate:
  prerequisites:
    - {study: bm-r4-coupled-2d-epithelium, condition: tests-passed}
  enables:
    - bm-e3-closed-3d-lumenoid
  proceed_condition: >
    The explicit 3D monolayer resolves over the tyssue engine and yields finite per-cell volumes
    and an emergent monolayer height, so it can serve as the explicit-geometry substrate the
    closed lumenoid (E3) builds on. Advancing to the quantitative "taller under slow BM
    relaxation" morphology claim additionally requires the no-BM / elastic-BM / relaxing-BM
    controls, which are flagged as a followup.

question: >
  Do growing 3D epithelial cells become taller when the basement membrane relaxes slowly?

purpose:
  question: >
    Do growing 3D epithelial cells become taller when the basement membrane relaxes slowly?
  mechanism: >
    A Tyssue 3D monolayer gives each cell apical, basal and lateral faces with their own surface
    energies and a per-cell volume target, so cell height and basal area emerge from the force
    balance rather than from an inferred volume/area prism relation. A basement membrane acting
    on the basal surface, with a tunable relaxation time, is intended to confine the cell (smaller
    basal area, larger height) when it relaxes slowly.
  expected_outcome: >
    Explicit per-cell heights and volumes emerge and stay well-posed, establishing the 3D
    substrate; cells should later be taller under a slowly-relaxing BM than under an elastic or
    absent BM once the three BM controls are wired.

key_assumptions:
  - "Each cell has explicit apical / basal / lateral faces with surface energies and a per-cell volume target, so height and basal area emerge from the 3D force balance (no thin-prism approximation)."
  - "The monolayer height is read as the vertex z-extent (~1.0 here); per-cell height is an emergent geometric quantity, not a stored scalar."
  - "The current composite is a single relaxation configuration: the no-BM / elastic-BM / relaxing-BM controls are NOT applied, so the BM-relaxation morphology ordering is not exercised."
  - "Face-level volume is undefined for monolayer faces (a face encloses no volume); only cell-level volume is a meaningful per-cell readout."
  - "Reduced units throughout; qualitative scope -- this study establishes that explicit 3D geometry emerges and is stable, not the morphology ordering."

parent_studies:
  - {study: bm-r4-coupled-2d-epithelium, condition: tests-passed}

cites: [barrientos2026cellshape]

baseline:
  - name: bm-r5-explicit-3d-confinement
    composite: viva_lumenoid.composites.tyssue_3d_monolayer
    params: {}
    note: >
      A 3D epithelial monolayer of 206 cells with apical, basal, and lateral
      surfaces and per-cell volume targets, so cell height and basal area emerge
      directly instead of from a thin-prism approximation. Cases with no membrane,
      an elastic membrane, and a relaxing membrane would isolate what the
      membrane's relaxation contributes to cell height -- those controls are the
      next addition.

conditions:
  baseline:
    composite: viva_lumenoid.composites.tyssue_3d_monolayer
    params: {}
  model_settings: []

robustness:
  parameter_sweep: false
  n_replicates: 1
  note: >
    Deterministic single configuration (one composite, no stochasticity, no parameter variation):
    the mesh geometry is fixed, so a single relaxation run is the whole evidence. Replication
    across the no-BM / elastic-BM / relaxing-BM controls is a gap -- that three-control morphology
    comparison is a documented followup.

falsifiability: >
  The claim would be overturned if the 3D monolayer failed to resolve over the tyssue engine, if
  the cell count were zero, if any per-cell volume or basal area were non-finite or non-positive
  after relaxation, or if stepping the EulerSolver produced a NaN or blow-up in the per-cell
  geometry. Any of these would show the explicit 3D cell geometry does not emerge well-posed. The
  contracts in tests/test_tyssue_composites.py (test_tyssue_3d_monolayer_runs) would fail in that
  case.

simulation_set:
  - name: r5-3d-monolayer-relaxation
    status: completed
    base_model: viva_lumenoid.composites.tyssue_3d_monolayer
    fixed: {dt: 0.01, steps: 5}
    metrics:
      n_cells: 206
      n_faces: 1590
      n_vertices: 820
      cell_area_min: 4.5128
      cell_area_max: 6.3806
      cell_vol_min: 0.5789
      cell_vol_max: 1.1578
      monolayer_z_extent: 1.0
      all_cell_vols_finite_positive: true
      geometry_finite_after_5_steps: true
    pass_fail_tests:
      - "monolayer-yields-per-cell-volumes: pass"
      - "monolayer-steps-stably: pass"

runs:
  - name: r5-3d-monolayer-relaxation
    base_model: viva_lumenoid.composites.tyssue_3d_monolayer
    status: completed
    outcomes:
      monolayer-yields-per-cell-volumes:
        result: PASS
        observed: "206 cells; per-cell volume 0.5789-1.1578 and basal area 4.5128-6.3806, all finite and > 0; monolayer z-extent ~1.0"
      monolayer-steps-stably:
        result: PASS
        observed: "5 Euler steps (dt 0.01) keep per-cell area and volume finite and positive -- no NaN, no blow-up"

readouts:
  - name: cell_volume
    description: Per-cell volume read off cell_df; the explicit 3D readout that emerges from surface energies + volume targets (not a prism approximation).
    store_path: "cell_df.vol"
    units: reduced volume
    status: primary
  - name: cell_area
    description: Per-cell basal area read off cell_df; the spatial confinement readout.
    store_path: "cell_df.area"
    units: reduced area
    status: measured
  - name: monolayer_height
    description: Emergent monolayer height, read as the vertex z-extent (~1.0); the explicit cell height the prism model only approximated.
    store_path: "vert_df.z"
    units: reduced length
    status: measured

behavior_tests:
  - name: monolayer-yields-per-cell-volumes
    classification: primary
    description: >
      The 3D monolayer has a positive cell count and every per-cell volume is finite and positive
      -- explicit per-cell volumes emerge across all cells.
    measure: {kind: reduce, field: cell_volume, reduce: all_finite_and_positive}
    pass_if: {op: all_finite_positive, note: "Nc > 0 and all 206 cell volumes finite and > 0 (0.58-1.16)"}
    units: reduced volume
    requires_simulation: r5-3d-monolayer-relaxation
    cites: [barrientos2026cellshape]
    calibration_anchor:
      observed_value: "0.5789-1.1578"
      literature_target: "finite well-posed per-cell volumes with an emergent height (qualitative; no micron calibration)"
      resolution: concept
      cites: [barrientos2026cellshape]
  - name: monolayer-steps-stably
    classification: primary
    description: >
      Stepping the EulerSolver several steps keeps per-cell areas and volumes finite (no NaN, no
      blow-up).
    measure: {kind: reduce, field: cell_volume, reduce: finite_over_steps}
    pass_if: {op: finite_no_blowup, note: "per-cell area and volume finite and positive after 5 Euler steps (dt 0.01)"}
    units: reduced volume
    requires_simulation: r5-3d-monolayer-relaxation

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "The explicit 3D monolayer resolves over the tyssue engine and yields finite per-cell volumes with an emergent monolayer height."
    biological_validation: "Qualitative only: per-cell heights/volumes emerge without a prism approximation; the 'taller under slow BM relaxation' ordering is not yet evaluated (BM controls not wired)."
    pipeline_unblocks:
      - "E3 closed 3D lumenoid -- this explicit monolayer is its geometric substrate."
  if_primary_tests_fail:
    diagnose:
      - "Monolayer fails to resolve -- check the MonolayerGeometry merge and the apical/basal/lateral face assignment."
      - "Per-cell volume non-finite -- check the volume-target energy term and the EulerSolver gradient."
    block_downstream: "Do not advance E3 until the explicit monolayer resolves and yields finite per-cell volumes."

limitations:
  - "Qualitative spatial-engine check only: the study confirms explicit 3D per-cell volumes and an emergent height exist and stay well-posed, not that cells are taller under slow BM relaxation."
  - "HONEST GAP: the no-BM / elastic-BM / relaxing-BM controls the morphology ordering needs are NOT in the composite -- the central question (taller under slow relaxation) is not tested here."
  - "Single deterministic configuration (no parameter sweep, n_replicates = 1); replication across the three BM controls is a gap."
  - "Monolayer height is read as the vertex z-extent, not a per-cell stored scalar; face-level volume is NaN by construction (faces enclose no volume) and is excluded from the per-cell finiteness check."
  - "Reduced units; no calibration to microns."

visualizations:
  - name: explicit_3d_confinement_movie
    address: "gif:bm-r5-explicit-3d-confinement.gif"
    config:
      title: "R5 — 3D monolayer (movie)"
      evidence_status: observed
      tier: supplement
      caption: >
        Animated movie of the 206-cell closed 3D Tyssue monolayer (xy projection of the mesh edges). Geometry verification with conserved per-cell volumes; BM-shell coupling is not wired (see the hypothesis panel).
  - name: r5_monolayer
    address: "html:r5_monolayer.html"
    config:
      title: "Closed 3D monolayer render + per-cell area distribution"
      evidence_status: engineered-diagnostic
      tier: main
      caption: >
        MAIN (evidence: engineered-diagnostic) — a model illustration, not a biological
        result. The closed 3D Tyssue monolayer (MonolayerGeometry, 206 cells) over the
        vivarium-tyssue EulerSolver (dt 0.01): the vertex wireframe is coloured by z
        (apical vs basal surface) and the cell centroids by per-cell area (common colour
        limits), with the real per-cell area distribution alongside (cell_df.area
        4.51-6.38 reduced, median 6.34). A closed 3D monolayer has finite cell volumes and
        identifiable basal surfaces, but no BM-dependent height response is established by
        this geometric verification alone: per-cell HEIGHT (vertex z-extent) is uniform
        (= 1.00) in this single run, and total cell volume is conserved to <0.01% over 5
        Euler steps. Single deterministic run; reduced units. GAP (named): the free-BM /
        stiff-frozen-BM / stiff-fast-relaxing-BM matched controls the morphology ordering
        needs are NOT in tyssue_3d_monolayer (params: contractility + vol_elasticity, no
        BM shell coupling).
  - name: r5_volume_hist
    address: "html:r5_volume_hist.html"
    config:
      title: "Cell-volume distribution appendix"
      evidence_status: engineered-diagnostic
      tier: supplement
      caption: >
        SUPPLEMENT (evidence: engineered-diagnostic) — geometry-validation appendix. The
        standalone per-cell volume distribution (cell_df.vol 0.58-1.16 reduced, median
        1.16, target 1.0) with the volume-conservation residual stated (total cell volume
        conserved to <0.01% over 5 Euler steps at dt 0.01). Finite volumes do NOT by
        themselves establish BM-dependent confinement; reduced units, single run.
  - name: r5_bm_hypothesis
    address: "html:r5_bm_hypothesis.html"
    config:
      title: "Matched BM controls (hypothesis)"
      evidence_status: hypothesis
      tier: supplement
      caption: >
        SUPPLEMENT (evidence: hypothesis) — the matched free-BM / stiff-frozen-BM /
        stiff-fast-relaxing-BM conditions the morphology ordering needs (before/after 3D
        cell images coloured by cell height, a height distribution by condition,
        height-vs-doubling-time traces, basal/apical area, and a volume-conservation
        residual + explicit energy/traction terms). NOT producible from
        tyssue_3d_monolayer: its parameters are contractility + vol_elasticity and there is
        no BM-shell coupling. Marked hypothesis until that coupling exists.

report:
  title: "R5 -- explicit 3D monolayer (per-cell volumes emerge)"
  verdict: >
    The explicit 3D epithelial monolayer resolves over the vivarium-tyssue engine and relaxes
    deterministically to finite, positive per-cell geometry: 206 cells with volumes 0.58-1.16
    and basal areas 4.51-6.38, and a monolayer z-extent of ~1.0 -- per-cell height emerges from
    the apical/lateral/basal surface energies and volume targets, no prism approximation. This
    establishes the explicit 3D substrate the closed lumenoid builds on. It is a qualitative
    engine check only: the no-BM / elastic-BM / relaxing-BM controls the morphology ordering
    needs are not yet in the composite.
  confidence: medium
  evidence_quality: regression-only
  main_insight: >
    Real per-cell heights and volumes emerge directly from a 3D surface-energy + volume-target
    monolayer over the tyssue engine (206 cells, volumes 0.58-1.16), replacing the homogeneous
    prism approximation with explicit geometry that is numerically stable.
  caveat: >
    The three BM-relaxation controls are not wired, so the central "taller under slow relaxation"
    morphology ordering is not tested -- this is a substrate-runs result, not a reproduction.

findings:
  - id: F1-per-cell-volumes-emerge
    kind: computational
    status: confirms
    tier: observation
    mechanism_origin: engineered
    statement: >
      The explicit 3D monolayer resolves over the tyssue engine with 206 cells whose per-cell
      volumes (0.5789-1.1578) and basal areas (4.5128-6.3806) emerge finite and positive from the
      apical/lateral/basal surface energies and volume targets, with a monolayer z-extent of ~1.0
      -- no thin-prism approximation.
    evidence:
      from_run: r5-3d-monolayer-relaxation
      from_test: monolayer-yields-per-cell-volumes
      observed: "Nc=206, Nf=1590, Nv=820; cell vol 0.58-1.16, cell area 4.51-6.38; z-extent ~1.0; all finite > 0"
    explanation: >
      Each cell carries explicit apical/basal/lateral faces and a volume target, so the vertex
      model relaxes to a per-cell height and volume directly instead of inferring height from a
      volume/area prism relation.
    next_action: "use as the explicit 3D geometric substrate for the E3 closed lumenoid"
    next_action_type: escalate_model
    provenance:
      run_ids: [r5-3d-monolayer-relaxation]
  - id: F2-steps-stably
    kind: computational
    status: confirms
    tier: observation
    mechanism_origin: engineered
    statement: >
      Stepping the EulerSolver five times (dt 0.01) keeps per-cell area and volume finite and
      positive, with no NaN or blow-up -- the explicit 3D monolayer is numerically stable over
      short integration.
    evidence:
      from_run: r5-3d-monolayer-relaxation
      from_test: monolayer-steps-stably
      observed: "per-cell area and volume finite and > 0 after 5 Euler steps (face-level volume is NaN by construction and excluded)"
    provenance:
      run_ids: [r5-3d-monolayer-relaxation]
  - id: F3-bm-controls-not-yet-wired
    kind: methodological
    status: partial
    tier: observation
    statement: >
      The no-BM / elastic-BM / relaxing-BM controls the Fig target morphology ordering needs are
      NOT in the composite, so the central claim -- cells taller under a slowly-relaxing BM -- is
      not tested. Only well-posed explicit geometry is established.
    evidence:
      from_run: r5-3d-monolayer-relaxation
      from_test: monolayer-yields-per-cell-volumes
      observed: "single relaxation configuration; no BM-relaxation axis to order height against"
    next_action: "add the no-BM / elastic-BM / relaxing-BM shell controls and measure height vs BM relaxation"
    next_action_type: refine_representation
    provenance:
      run_ids: [r5-3d-monolayer-relaxation]

followup_proposals:
  - id: fp-r5-bm-shell-controls
    title: "Add the BM-shell controls (no-BM / elastic-BM / relaxing-BM) to the 3D monolayer"
    motivation: >
      The monolayer yields explicit per-cell heights and volumes but carries no basement-membrane
      relaxation axis, so it cannot yet test whether cells are taller under a slowly-relaxing BM.
      Add the three BM controls on the basal surface and measure the height / basal-area
      distribution against the paper's morphology ordering.
    hypothesized_mechanism: "A slowly-relaxing BM should confine cells (smaller basal area, larger height) relative to an elastic or absent BM, reproducing the paper's morphology ordering in the explicit 3D model."
    status: proposed

discovery_implications:
  resolved_uncertainties:
    - "Explicit per-cell heights and volumes emerge from a 3D surface-energy + volume-target monolayer over the tyssue engine (no prism approximation)."
    - "The explicit 3D monolayer is numerically stable over short EulerSolver integration."
  remaining_uncertainties:
    - "Whether cells are taller under a slowly-relaxing BM -- needs the three BM-shell controls."
    - "The quantitative height / basal-area distribution vs BM relaxation."
  followup_study_proposals:
    - {id: fp-r5-bm-shell-controls, title: "no-BM / elastic-BM / relaxing-BM controls on the 3D monolayer"}

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: "The tyssue_3d_monolayer composite is registered and steps cleanly over the vivarium-tyssue engine; the behavior-test contracts (test_tyssue_3d_monolayer_runs) pass."
  biological_validation:
    result: PENDING
    basis: >
      Explicit per-cell volumes and an emergent height exist and are well-posed, but the no-BM /
      elastic-BM / relaxing-BM morphology comparison the question turns on is not yet in the
      composite, so the "taller under slow relaxation" ordering is neither validated nor refuted.
  explanatory_gain:
    result: POSITIVE
    basis: >
      Replacing the homogeneous prism with an explicit 3D monolayer in which per-cell heights and
      volumes emerge from surface energies + volume targets is a genuine representational advance
      over the R1 approximation, even before the BM controls are wired.

expert_review_status: requested
expert_questions:
  - "Is the emergent monolayer z-extent (~1.0) the right per-cell height readout, or should height be measured per cell as an apical-basal vertex distance before the morphology ordering is claimed?"
  - "Should the three BM-shell controls be a hard prerequisite before R5 is called evidence, given the central question is specifically about BM relaxation?"

bibliography:
  sources:
    - key: barrientos2026cellshape
      note: "Barrientos et al. cell-shape paper; the explicit 3D monolayer is the resolved-geometry counterpart of the Fig 1 confinement model, replacing the prism approximation."
