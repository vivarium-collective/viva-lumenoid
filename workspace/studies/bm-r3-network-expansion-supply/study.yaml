schema_version: 3
name: bm-r3-network-expansion-supply
status: in-progress
title: "Network expansion & collagen supply"
kind: reproduction
phase: Build
confidence: Investigating
claim: >
  The three supply conditions run from a shared initial state; matching the paper's ordering in network area, concentration and connectivity is in progress.
question: >
  Why are both crosslink remodeling and collagen replacement (insertion) necessary for
  sustained basement-membrane growth?

hypothesis: >
  From identical initial states, no-remodeling, remodeling-without-insertion and remodeling-
  with-insertion diverge in network area, collagen concentration and integrity in the
  direction and ordering of Figure 2B-C: only remodeling with supply sustains growth without
  loss of the largest connected network.

objective: >
  From identical initial states, compare no remodeling, remodeling without insertion, and
  remodeling with insertion under matched forcing; measure area expansion, collagen density
  and largest-connected-network size; match the direction and ordering of Fig 2B-C.

description: |
  Reproduces the supply/loss/dilution decomposition of Barrientos Fig 2B-C. Three matched
  conditions share one initial state and forcing; the readouts are network area expansion,
  collagen concentration and connectivity (largest connected component). The study establishes
  which combination of remodeling and insertion sustains a growing network, a prerequisite for
  the growth-rheology coupling used by R4 and the perturbations in R6.

parent_studies:
  - {study: bm-r2-collagen-network-rheology, relation: leads-to, condition: tests-passed}

cites: [barrientos2026cellshape]

expected_behavior:
  - name: supply-ordering-matches-fig2bc
    observable: area / concentration / largest-connected-network ordering
    condition: no-remodel vs remodel-no-supply vs remodel-with-supply
    rationale: >
      Matching Fig 2B-C ordering and direction across the three conditions is the success
      criterion; absolute values are secondary to the ordering.

