schema_version: 4
name: bm-r3-network-expansion-supply
title: "Network expansion & collagen supply"
created: "2026-10-20"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted
confidence: Investigating

claim: >
  The collagen IV network composite distinguishes a REMODELING network (crosslink chemistry on
  -> crosslinks form, the network remodels) from a FROZEN one (chemistry off -> no crosslinks),
  but it has NO material-insertion / supply mechanism, so it cannot realise the third supply
  mode (remodeling WITH insertion) that Figure 2B-C's ordering needs. R3 is therefore a PARTIAL
  reproduction, scoped to remodeling-vs-frozen.

experiment: >
  Drive the collagen IV network composite (viva_lumenoid.composites.stage2_sweep /
  CollagenNetworkProcess) from a shared initial state in the two modes the composite CAN
  express: remodeling ON (make_on = break_on = 1, so crosslinks form and the chemistry turns
  over) versus FROZEN (make_on = break_on = 0, so the topology is fixed and no crosslinks form).
  A bounded smoke run (40 rods, real angles, 4 steps) confirms the direction: ON forms
  crosslinks, FROZEN forms none. The third Fig-2B-C mode -- remodeling WITH material insertion
  -- is NOT run, because the composite has no process that inserts new collagen material.

result: >
  The composite cleanly separates the two modes it can express. Remodeling ON forms a
  crosslinked network (n_crosslinks 5 at 40 rods); FROZEN forms exactly zero crosslinks
  (n_crosslinks 0): crosslinks appear ONLY when the chemistry is on. This reproduces the
  remodeling-vs-no-remodeling contrast underlying Fig 2B-C. It does NOT reproduce the full
  three-mode ordering (no-remodeling / remodeling-without-insertion / remodeling-with-insertion),
  because the third mode requires a material-insertion / supply term the composite does not have.
  That missing insertion process is an explicit COMPOSITE GAP, and R3 stays Investigating until
  it is added.

# Canonical DAG edge -- R3 is the supply-mode study; it consumes R2's rheology reference.
pipeline_gate:
  prerequisites:
    - {study: bm-r2-collagen-network-rheology, condition: tests-passed}
  enables: []
  proceed_condition: >
    The remodeling-vs-frozen distinction is a reproducible, contract-locked building block. The
    full Fig-2B-C supply-mode ordering is NOT established and does not gate downstream work --
    it is blocked on adding a material-insertion process (see followup_proposals).

question: >
  Why are both crosslink remodeling and collagen replacement (insertion) necessary for
  sustained basement-membrane growth?

purpose:
  question: >
    Why are both crosslink remodeling and collagen replacement (insertion) necessary for
    sustained basement-membrane growth?
  mechanism: >
    Fig 2B-C decomposes sustained growth into three supply modes: no remodeling, remodeling
    without insertion, and remodeling with insertion. The collagen IV composite expresses
    crosslink remodeling (chemistry on -> crosslinks form and turn over) but has no term that
    inserts new collagen material, so it can only contrast remodeling against a frozen topology.
  expected_outcome: >
    From a shared initial state, remodeling ON forms and turns over crosslinks while FROZEN holds
    a fixed topology with none -- the remodeling-vs-frozen half of the Fig-2B-C decomposition.
    The third (insertion) mode is out of reach until a supply process is added.

key_assumptions:
  - "The collagen IV network is the faithful NC1/7S model; the composite is viva_lumenoid.composites.stage2_sweep / CollagenNetworkProcess."
  - "Remodeling is driven by make_on / break_on: both 1 -> crosslinks form and turn over; both 0 -> topology frozen, no crosslinks."
  - "The composite has NO material-insertion / collagen-supply process -- the third Fig-2B-C mode cannot be expressed. This is the central honest gap, not a tuning choice."
  - "Both modes share one initial state (bare rods) and the same forcing; the only difference is whether the crosslink chemistry is on."
  - "Reduced (LJ) units; the readout here is the crosslink-count contrast (direction), not an absolute area/concentration/connectivity ordering."

parent_studies:
  - {study: bm-r2-collagen-network-rheology, condition: tests-passed}

cites: [barrientos2026cellshape, meadowcroft2025nonequilibrium]

baseline:
  - name: collagen-network-supply
    composite: viva_lumenoid.composites.stage2_sweep
    params:
      n_rods: 40
      box_xy: 8.0
      slab_thickness: 4.0
      use_real_angles: true
      bending_k: 4.0
    note: >
      The faithful collagen IV network driven from a shared bare-rod initial state. The two
      expressible supply modes are remodeling ON (make_on = break_on = 1) vs FROZEN
      (make_on = break_on = 0); n_crosslinks is the readout that distinguishes them.

variants:
  - name: remodeling-on
    description: "Crosslink chemistry ON (make_on = break_on = 1): crosslinks form and the network remodels."
    params: {make_on: 1.0, break_on: 1.0}
  - name: frozen
    description: "Crosslink chemistry OFF (make_on = break_on = 0): topology frozen, no crosslinks form."
    params: {make_on: 0.0, break_on: 0.0}

conditions:
  baseline:
    composite: viva_lumenoid.composites.stage2_sweep
    params:
      n_rods: 40
      box_xy: 8.0
      slab_thickness: 4.0
      use_real_angles: true
      bending_k: 4.0
  variants:
    - name: remodeling-on
      description: "make_on = break_on = 1 -> crosslinks form, network remodels."
    - name: frozen
      description: "make_on = break_on = 0 -> no crosslinks, topology frozen."
  model_settings:
    - name: make_on
      default: 1.0
      current: 1.0
      range: [0.0, 1.0]
      units: toggle
      cites: [meadowcroft2025nonequilibrium]
      notes: "Crosslink formation (fix bond/create) on/off; 1 -> crosslinks form."
    - name: break_on
      default: 1.0
      current: 1.0
      range: [0.0, 1.0]
      units: toggle
      cites: [meadowcroft2025nonequilibrium]
      notes: "Force-independent off-rate (random deletion) on/off; paired with make_on to turn the chemistry on/off."

robustness:
  parameter_sweep: true
  n_replicates: 1
  note: >
    A 2-condition contrast (remodeling ON vs FROZEN) at a single seed on a small 40-rod network.
    The crosslink-forms-only-with-chemistry-on direction is deterministic and sharp (5 vs 0), so
    one seed is adequate for the direction; it is NOT a quantitative area/concentration/
    connectivity ordering (that needs the missing insertion process plus seeds).

controls:
  - name: frozen-no-remodeling
    kind: negative
    result: PASS
    observed: "make_on = break_on = 0 -> n_crosslinks 0; the network forms NO crosslinks when the chemistry is off."
    note: "The discriminating negative control: crosslinks must appear ONLY when the chemistry is on. Frozen confirms there is no spurious crosslinking."

simulation_set:
  - name: r3-remodeling-vs-frozen
    status: completed
    base_model: viva_lumenoid.composites.stage2_sweep
    provenance: "Run by THIS evidence session (bounded smoke, 40 rods, real angles, 4 steps) to confirm the mode distinction and mechanism direction."
    fixed: {n_rods: 40, box_xy: 8.0, slab_thickness: 4.0, use_real_angles: true, bending_k: 4.0, assemble_steps: 300, hold_steps: 200, growth_steps: 4}
    axes:
      mode: [remodeling-on, frozen]
    metrics:
      n_crosslinks_remodeling_on: 5   # make_on = break_on = 1
      n_crosslinks_frozen: 0          # make_on = break_on = 0
      sigma_inplane_remodeling_on_lj: 0.250
    pass_fail_tests:
      - "remodeling-forms-crosslinks: pass"
      - "frozen-has-no-remodeling: pass"

# Canonical run record -- feeds the dashboard's Ran . Tests . Verdict strip.
runs:
  - name: r3-remodeling-vs-frozen
    base_model: viva_lumenoid.composites.stage2_sweep
    status: completed
    provenance: "this evidence session (bounded smoke, 40 rods)"
    outcomes:
      remodeling-forms-crosslinks:
        result: PASS
        observed: "make_on = break_on = 1 -> n_crosslinks 5 (> 0); the network remodels"
      frozen-has-no-remodeling:
        result: PASS
        observed: "make_on = break_on = 0 -> n_crosslinks 0; topology frozen, no crosslinks form"

readouts:
  - name: n_crosslinks
    description: Number of NC1/7S crosslink bonds (total minus intra-rod); the readout that distinguishes remodeling from frozen.
    store_path: "n_crosslinks"
    units: count
    status: primary
  - name: sigma_inplane
    description: Bond-virial in-plane stress; reported for the remodeling mode (finite) as a supporting readout.
    store_path: "sigma_inplane"
    units: kT/sigma^3 (LJ)
    status: measured
  - name: network_area
    description: Network area expansion -- a Fig-2B-C readout that needs the material-insertion process to be meaningful. Deferred (composite gap).
    store_path: "positions"
    units: sigma^2
    status: deferred
  - name: largest_connected_network
    description: Size of the largest connected component (Fig-2B-C connectivity readout). Deferred -- needs the insertion mode to differentiate the three supply modes.
    store_path: "bonds"
    units: fraction
    status: deferred

behavior_tests:
  - name: remodeling-forms-crosslinks
    classification: primary
    description: >
      With the crosslink chemistry ON (make_on = break_on = 1) the network forms crosslinks
      (n_crosslinks > 0): it remodels.
    measure: {kind: count, field: n_crosslinks, when: remodeling-on}
    pass_if: {op: gt, value: 0, field: n_crosslinks}
    units: count
    requires_simulation: r3-remodeling-vs-frozen
    cites: [meadowcroft2025nonequilibrium]
    calibration_anchor:
      observed_value: 5
      literature_target: "a remodeling network forms crosslinks (chemistry on)"
      resolution: concept
      cites: [meadowcroft2025nonequilibrium]
  - name: frozen-has-no-remodeling
    classification: primary
    description: >
      With the chemistry OFF (make_on = break_on = 0) the network forms NO crosslinks
      (n_crosslinks == 0): the topology is frozen -- the discriminating negative control.
    measure: {kind: count, field: n_crosslinks, when: frozen}
    pass_if: {op: eq, value: 0, field: n_crosslinks}
    units: count
    requires_simulation: r3-remodeling-vs-frozen
    cites: [meadowcroft2025nonequilibrium]
    calibration_anchor:
      observed_value: 0
      literature_target: "no remodeling -> no crosslink turnover (chemistry off)"
      resolution: concept
      cites: [meadowcroft2025nonequilibrium]

falsifiability: >
  The claim (the composite distinguishes remodeling from frozen) would be overturned if FROZEN
  (make_on = break_on = 0) produced crosslinks (n_crosslinks > 0), or if remodeling ON produced
  none -- either would mean the crosslink chemistry toggle does not control remodeling. The
  broader supply-mode claim is ALREADY scoped out: because the composite has no insertion
  process, the three-mode Fig-2B-C ordering is declared out of reach rather than asserted. The
  locking contract in tests/test_r3_supply.py (ON -> crosslinks > 0, FROZEN -> 0) would fail if
  the distinction broke.

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "The composite runs both modes from a shared state and the crosslink chemistry toggle controls remodeling."
    biological_validation: "Partial Fig-2B-C: the remodeling-vs-frozen half reproduces; the third (insertion) supply mode is a composite gap, not validated."
    pipeline_unblocks: []
  if_primary_tests_fail:
    diagnose:
      - "Crosslinks forming while frozen -> the make_on / break_on toggle is not gating the chemistry; check the process update path."
      - "No crosslinks while remodeling -> network under-percolated; raise n_rods / assemble length / make_prob."
    block_downstream: "Do not claim any supply-mode ordering until the remodeling-vs-frozen distinction holds AND an insertion process exists."

limitations:
  - "COMPOSITE GAP: viva_lumenoid.composites.stage2_sweep has NO material-insertion / collagen-supply process, so the third Fig-2B-C mode (remodeling WITH insertion) CANNOT be expressed -- only remodeling-vs-frozen is run."
  - "Scoped to the crosslink-count direction (5 vs 0); the absolute area / concentration / largest-connected-network ordering of Fig 2B-C is NOT reproduced (those readouts are deferred)."
  - "Single seed, small (40-rod) network: adequate for the deterministic direction, not for a quantitative ordering."
  - "Reduced (LJ) units; no calibration to physical area / concentration / time."

visualizations:
  - name: r3_supply
    address: "html:r3_supply.html"
    config:
      title: "Supply vs remodelling (small real run)"
      caption: >
        A small REAL collagen run contrasting remodelling (make+break) vs make-only - the ordering behind 'supply sustains growth'. Full Fig 2B-C reproduction is the study target.

report:
  title: "R3 -- network expansion & collagen supply (remodeling-vs-frozen; insertion is a composite gap)"
  verdict: >
    The collagen IV network composite cleanly separates a remodeling network from a frozen one:
    with the chemistry on it forms crosslinks (n_crosslinks 5 at 40 rods), and with the chemistry
    off it forms none (n_crosslinks 0), confirmed in this session by a bounded smoke run. This
    reproduces the remodeling-vs-no-remodeling contrast underlying Fig 2B-C. It does NOT reproduce
    the full three-mode supply ordering, because the composite has no material-insertion process
    to realise the third mode (remodeling WITH insertion). That missing insertion term is an
    explicit COMPOSITE GAP; R3 stays Investigating.
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    The composite distinguishes remodeling from frozen (crosslinks form only when the chemistry
    is on), but the collagen-supply / insertion term the third Fig-2B-C mode needs is not in the
    model -- a composite gap, honestly flagged rather than faked.
  caveat: >
    Only remodeling-vs-frozen is run; the three-mode Fig-2B-C ordering awaits an insertion
    process. Single seed, small network, reduced units.
  key_metrics:
    - {label: "crosslinks (remodeling on)", value: 5, status: pass}
    - {label: "crosslinks (frozen)", value: 0, status: pass}
    - {label: "third supply mode (insertion)", value: "composite gap -- not expressible", status: warn}

findings:
  - id: F1-remodeling-vs-frozen-distinguished
    kind: biological
    status: partial
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      The collagen IV composite distinguishes a remodeling network from a frozen one: with the
      crosslink chemistry on it forms crosslinks (n_crosslinks 5), and with it off it forms none
      (n_crosslinks 0). This reproduces the remodeling-vs-no-remodeling half of Fig 2B-C, but not
      the full three-mode supply ordering.
    evidence:
      from_run: r3-remodeling-vs-frozen
      from_test: remodeling-forms-crosslinks
      observed: "remodeling ON -> 5 crosslinks; FROZEN -> 0 crosslinks; verified in this session"
    expected:
      cites: [barrientos2026cellshape]
      range: "remodeling sustains a connected network; no remodeling does not (Fig 2B-C)"
    explanation: >
      make_on / break_on gate the crosslink chemistry; crosslinks appear only when it is on, so
      the composite cleanly separates the two modes it can express.
    next_action: "add a material-insertion process so the third Fig-2B-C supply mode can be run"
    next_action_type: refine_representation
    provenance:
      run_ids: [r3-remodeling-vs-frozen]
    cites: [barrientos2026cellshape]
  - id: F2-insertion-composite-gap
    kind: methodological
    status: partial
    tier: observation
    mechanism_origin: engineered
    statement: >
      The third Fig-2B-C supply mode (remodeling WITH material insertion) is a COMPOSITE GAP:
      viva_lumenoid.composites.stage2_sweep has no process that inserts new collagen material, so
      the full no-remodeling / remodeling-without-insertion / remodeling-with-insertion ordering
      cannot be reproduced. The gap is flagged, not faked.
    evidence:
      from_run: r3-remodeling-vs-frozen
      from_test: frozen-has-no-remodeling
      observed: "only two modes expressible (ON vs FROZEN); no insertion term exists in the composite"
    explanation: >
      The composite's chemistry toggles crosslink formation/breaking but never adds material to
      the box, so area expansion by supply cannot be distinguished from remodeling alone.
    next_action: "seed a follow-up that adds a collagen-insertion / supply process"
    next_action_type: escalate_model
    provenance:
      run_ids: [r3-remodeling-vs-frozen]

followup_proposals:
  - id: fp-r3-insertion-process
    title: "Add a material-insertion / collagen-supply process to the network"
    motivation: >
      The third Fig-2B-C supply mode (remodeling WITH insertion) is unreachable because the
      composite has no term that inserts new collagen material. Adding a supply/insertion process
      would let all three supply modes be run and the Fig-2B-C area / concentration / connectivity
      ordering be reproduced.
    hypothesized_mechanism: >
      A process that inserts new rods (collagen protomers) into the box at a supply rate, so a
      remodeling network with supply sustains area expansion while remodeling alone does not.
    status: proposed
  - id: fp-r3-connectivity-readouts
    title: "Add area / concentration / largest-connected-network readouts"
    motivation: >
      Fig 2B-C is an ordering over area, collagen concentration and connectivity. Those readouts
      are deferred here; they are needed (alongside the insertion process) to reproduce the
      ordering quantitatively.
    status: proposed

discovery_implications:
  resolved_uncertainties:
    - "The composite does distinguish remodeling (chemistry on -> crosslinks) from frozen (off -> none)."
  remaining_uncertainties:
    - "The full three-mode Fig-2B-C supply ordering -- blocked on a missing material-insertion process (composite gap)."
    - "Area / concentration / connectivity orderings -- readouts deferred."
  followup_study_proposals:
    - {id: fp-r3-insertion-process, title: "Add a material-insertion / collagen-supply process"}

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: "The stage2_sweep composite runs both modes cleanly; the locking contract in tests/test_r3_supply.py (ON -> crosslinks > 0, FROZEN -> 0) passes."
  biological_validation:
    result: MIXED
    basis: >
      PARTIAL, scoped to remodeling-vs-frozen: that contrast reproduces (5 vs 0 crosslinks), but the full
      three-mode supply ordering of Fig 2B-C is not reproduced because the insertion mode is a
      composite gap.
  explanatory_gain:
    result: POSITIVE
    basis: >
      Pins down exactly what is missing to reproduce Fig 2B-C: a material-insertion / supply
      process. The remodeling-vs-frozen distinction is a reproducible, contract-locked building
      block the insertion follow-up can extend.

expert_review_status: requested
expert_questions:
  - "Insertion mechanism: what is the right way to add collagen supply -- inserting new rods at a supply rate, or raising free-monomer concentration -- so the third Fig-2B-C mode is physically faithful?"
  - "Readouts: which of area / concentration / largest-connected-network is the primary Fig-2B-C ordering variable to target once insertion exists?"

bibliography:
  sources:
    - key: barrientos2026cellshape
      note: "Barrientos et al. cell-shape paper; Figure 2B-C (supply-mode ordering) is the reproduction target."
    - key: meadowcroft2025nonequilibrium
      note: "Nonequilibrium collagen IV network; the two-bead-rod + stochastic-crosslink model the composite is built from (remodeling chemistry via make_on / break_on)."
