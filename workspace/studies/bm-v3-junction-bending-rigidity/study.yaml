schema_version: 4
name: bm-v3-junction-bending-rigidity
created: "2026-09-30"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted

claim: >
  SUPERSEDED by the 2026-10-01 cross-check. This study originally explained the
  soft modulus as a central-force rigidity-percolation effect (z ≤ 3 < 4). The
  released code is NOT central-force — it sets junction angles (NC1 180° k=4.0,
  7S 155°/60°) — so that explanation does not describe the published model, which
  carries those angles and is still soft (≈0.03 Pa). What this sweep actually
  shows: with angles OFF (our earlier transcription) and the corrected params, the
  network is sub-isostatic (z tops out ≈2.0) and soft — a property of the angle-
  off transcription, not of the paper.

experiment: >
  Sweep the max crosslinks per end (a bundling proxy: NC1×k + 7S×m, k,m rising)
  so the mean coordination z climbs, and measure the seed-ensemble elastic
  modulus vs z against the z = 4 threshold.

result: >
  With the corrected released params and angles off, raising the crosslink caps
  lifts z only to ~2.0 and the modulus stays consistent with zero at every rung —
  consistent with a sparse, sub-isostatic angle-off network. But this is NOT the
  mechanism of the published model's softness: the released model has junction
  angles and is still soft (≈0.03 Pa), which the spec attributes to missing
  components, thin-sheet geometry and absent pre-stress, not to sub-isostatic
  connectivity. The rigidity-percolation framing is retired as the explanation.

seeded_from:
  study: bm-v1-stage1-modulus-remodelling
  proposal_id: fp1-junction-bending
  finding: F2-floppy-below-rigidity-percolation

parent_studies:
  - bm-v1-stage1-modulus-remodelling

purpose:
  question: Can more crosslink connectivity rigidify the v1 network, or is bending required?
  mechanism: >
    Maxwell rigidity percolation: a central-force network is floppy below z = 2d
    (= 4 in 2D). Bond-bending constraints lower the threshold and rigidify sub-
    isostatic networks.
  expected_outcome: >
    Modulus stays ~0 while z < 4; since NC1×1 + 7S×3 caps z at 3, connectivity
    alone never rigidifies — bending does.

key_assumptions:
  - "Mean coordination z = 1 + n_crosslinks/n_rods (beads = 2·n_rods; bonds = intra + crosslinks)."
  - "Raising NC1/7S max crosslinks is a proxy for lateral bundling (more junctions)."
  - "Same clean-room parameters and force-independent off-rate as stage 1."

baseline:
  - name: connectivity-sweep
    composite: viva_lumenoid.composites.connectivity_sweep
    params:
      n_rods: 200
      box_xy: 20.0
      assemble_steps: 8000
      hold_steps: 8000
      rungs: "[(1,3,0.12),(2,4,0.25),(3,5,0.40),(5,8,0.60)]"
      seeds: "[11,22,33]"

variants:
  - name: nc1x1-7sx3
    description: Baseline connectivity (NC1×1, 7S×3) — z ≈ 1.2.
    params: {nc1_max_crosslinks: 1, svns_max_crosslinks: 3, make_prob: 0.12}
  - name: nc1x2-7sx4
    description: Raised connectivity (bundling proxy) — z ≈ 1.6.
    params: {nc1_max_crosslinks: 2, svns_max_crosslinks: 4, make_prob: 0.25}
  - name: nc1x3-7sx5
    description: Raised connectivity — z ≈ 2.3.
    params: {nc1_max_crosslinks: 3, svns_max_crosslinks: 5, make_prob: 0.40}
  - name: nc1x5-7sx8
    description: Highest achievable connectivity — z ≈ 3.7 (still < 4).
    params: {nc1_max_crosslinks: 5, svns_max_crosslinks: 8, make_prob: 0.60}

simulation_set:
  - name: rigidity-connectivity-sweep
    status: completed
    base_model: viva_lumenoid.composites.connectivity_sweep
    seeds: [11, 22, 33]
    metrics:
      z_max: 2.03
      reached_rigid: false
      modulus: "consistent with 0 at every rung"
    pass_fail_tests:
      - "z-stays-below-threshold: pass"
      - "modulus-stays-floppy: pass"

readouts:
  - name: coordination_z
    description: Mean bead coordination z at each connectivity rung.
    store_path: "network/n_crosslinks"
    units: dimensionless
    status: measured
  - name: elastic_modulus_vs_z
    description: Seed-ensemble elastic modulus (95% CI) at each z.
    store_path: "network/sigma_inplane"
    units: kT/a^3
    status: measured

behavior_tests:
  - name: z-stays-below-threshold
    classification: primary
    description: The NC1/7S topology cannot reach the 2D rigidity threshold z = 4.
    measure: {kind: max, field: coordination_z}
    pass_if: {op: lt, value: 4.0, field: max_z}
    units: dimensionless
    requires_simulation: "true"
  - name: modulus-stays-floppy
    classification: primary
    description: The modulus is consistent with zero at every rung while z < 4.
    measure: {kind: value, field: elastic_modulus_vs_z, ensemble: 3}
    pass_if: {op: consistent_with_zero, note: "all CIs span 0"}
    units: kT/a^3
    requires_simulation: "true"
    calibration_anchor:
      observed_value: "z 1.24→2.03 (angles off); modulus consistent with 0"
      literature_target: 4.0
      resolution: model
      cites: [meadowcroft2025nonequilibrium]

findings:
  - id: F1-connectivity-cannot-rigidify
    kind: computational
    status: confirms
    statement: >
      Raising NC1/7S crosslinks lifts z to only ~3.7 (never 4), and the modulus
      stays consistent with zero throughout — central-force connectivity cannot
      rigidify the v1 sheet.
    evidence:
      observed: "z 1.24→2.03 (angles off, corrected params); modulus consistent with 0"
    expected:
      range: "rigid only for z ≥ 4 (2D central-force isostatic point)"
    explanation: "NC1×1 + 7S×3 caps z at 3; bundling raises it but the geometry saturates below 4."
    next_action: "implement junction bending (fix bond/create atype + angle_style) — the load-bearing v2 fix"
    provenance:
      run_ids: [rigidity-connectivity-sweep]

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "Connectivity sweep runs; z and modulus recorded per rung."
    biological_validation: "Confirms the floppy-network finding; identifies bending as the rigidity source."
    pipeline_unblocks:
      - "Junction-bending implementation (auto-angles at crosslink junctions)."
  if_primary_tests_fail:
    diagnose:
      - "If z reaches 4 and modulus turns on, connectivity DOES rigidify — revise the finding."
    block_downstream: "Nothing downstream is blocked — this is a diagnostic follow-up, not a pipeline gate."

visualizations:
  - name: rigidity-movie
    address: "html:rigidity_movie.html"
    config:
      title: "Simulation movie — high-connectivity network (NC1×5 + 7S×8)"
  - name: rigidity-movie-3d
    address: "html:rigidity_movie_3d.html"
    config:
      title: "3D view — the connected network, rotatable"
  - name: rigidity-diagnostic
    address: "html:rigidity_diagnostic.html"
    config:
      title: "Rigidity sweep — modulus vs coordination z"

limitations:
  - "Cross-check (2026-10-01): the released model is NOT central-force — it sets NC1/7S junction angles (bending). The rigidity-percolation premise here is general physics but does not describe the published model, which is angle-stabilized. See references/cross-check-vs-released-code.md."
  - "Clean-room parameters transcribed from the spec; the authors' LAMMPS input scripts are now public (Zenodo 10.5281/zenodo.20719515) and not yet cross-checked against this build."
  - "Bundling is modelled only as raised crosslink caps, not explicit lateral-association bonds."
  - "Junction bending is not yet implemented — this study motivates it, does not test it."
  - "Same LJ-unit / energy-scale caveat as stage 1."

report:
  title: "Stage v3 — rigidity percolation (superseded explanation)"
  verdict: >
    The rigidity-percolation explanation for the soft modulus is retired by the
    2026-10-01 cross-check: the released model is not central-force (it has junction
    angles) and is soft anyway. This sweep documents only that our angle-off
    transcription is sub-isostatic and soft; it does not explain the published model.
  confidence: low
  evidence_quality: preliminary
  main_insight: >
    The published model's softness is not a crosslink-connectivity effect — it
    persists despite the junction angles, so it must come from the factors the spec
    names (missing components, thin-sheet geometry, no pre-stress). Connectivity is
    not the lever.

bibliography:
  sources:
    - key: meadowcroft2025nonequilibrium
      note: The two-bead-rod + stochastic-crosslink model; its ≈0.03 Pa modulus is the near-floppy regime this study explains.
