schema_version: 4
name: bm-v3-junction-bending-rigidity
title: "Rigidity percolation (central-force control)"
created: "2026-09-30"
kind: adversarial   # counterfactual (central-force) control: it should not reproduce the released angle-stabilized model; retained per upgrade-plan §2
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted

claim: >
  This study originally explained the soft modulus as a central-force
  rigidity-percolation effect (z ≤ 3 < 4). The released code is not a central-force
  network — it sets junction angles (NC1 at 180° with stiffness 4.0, 7S at 155° and
  60°) — so that explanation does not describe the published model, which carries
  those angles and is still soft (≈0.03 Pa). What this connectivity sweep actually
  shows is that with angles off (our earlier transcription) and the corrected
  parameters, the network is sub-isostatic (z tops out at ≈2.0) and soft — a
  property of the angle-off transcription, not of the paper.

experiment: >
  Sweep the max crosslinks per end (a bundling proxy: NC1×k + 7S×m, k,m rising)
  so the mean coordination z climbs, and measure the seed-ensemble elastic
  modulus vs z against the z = 4 threshold.

result: >
  With the corrected parameters and angles off, raising the crosslink caps lifts z
  only to about 2.0, and the modulus stays consistent with zero at every step — as
  expected for a sparse, sub-isostatic network. This is not the mechanism behind the
  published model's softness: the released model has junction angles and is still
  soft (≈0.03 Pa), which comes from missing components, thin-sheet geometry and the
  absence of pre-stress rather than from sub-isostatic connectivity. The
  rigidity-percolation story is retired as the explanation.

# Figure-review provenance (2026-10-20) — the primary is reframed as a clearly
# marked NEGATIVE CONTROL (engineered-diagnostic), not a reproduction.
figure_review:
  date: "2026-10-20"
  resolution: >
    v3-centralforce-control is the primary: angles OFF (bending_k=0), modulus vs
    MEASURED z with a zero reference and per-seed scatter, titled as a control. The
    z=4 Maxwell line is annotated as an idealized 2D central-force heuristic, not a
    threshold for the released angle-stabilized finite-thickness network.
  key_numbers: >
    Real bounded LAMMPS, 60-rod network, 3 seeds (11/22/33). Measured z rises
    1.17 → 1.36 → 1.46 → 1.61 across crosslink caps NC1×1/7S×3 → NC1×5/7S×8; the
    athermal modulus is scattered about zero with CIs spanning 0 at every rung
    (e.g. 0.09±0.12, -3.52±4.89, 0.03±0.04, 1.18±2.72 LJ) — not reproducibly
    positive, by design.
  study: bm-v1-stage1-modulus-remodelling
  proposal_id: fp1-junction-bending
  finding: F2-floppy-below-rigidity-percolation

# Canonical DAG edge (supersedes the legacy parent_studies shim).
pipeline_gate:
  prerequisites:
    - study: bm-v1-stage1-modulus-remodelling
      condition: tests-passed
  enables:
    - bm-v4-junction-bending
  proceed_condition: >
    Motivates (does not gate) the junction-bending implementation in bm-v4.

question: Can more crosslink connectivity rigidify the v1 network, or is bending required?

purpose:
  question: Can more crosslink connectivity rigidify the v1 network, or is bending required?
  mechanism: >
    Maxwell rigidity percolation: a central-force network is floppy below z = 2d
    (= 4 in 2D). Bond-bending constraints lower the threshold and rigidify sub-
    isostatic networks.
  expected_outcome: >
    Modulus stays ~0 while z < 4; since NC1×1 + 7S×3 caps z at 3, connectivity
    alone never rigidifies — bending does.

key_assumptions:
  - "Mean coordination z = 1 + n_crosslinks/n_rods (beads = 2·n_rods; bonds = intra + crosslinks)."
  - "Raising NC1/7S max crosslinks is a proxy for lateral bundling (more junctions)."
  - "Same clean-room parameters and force-independent off-rate as stage 1."

model_assumptions_declaration:
  preferred_vs_realized: "n/a — central-force negative control"
  load_control_vs_reaction: "imposed/athermal strain"
  geometry_dimension: "2D (z=4 rigidity heuristic)"
  material_representation: "explicit-LAMMPS"
  growth_vs_division: "n/a"
  calibration_limits: "reduced LJ units; adversarial control, not the released network"

meeting_alignment_2026_10_20:
  disposition: revise
  note: "Retain ONLY as a central-force negative control; it does not describe the native released collagen network. Do not expand into a primary narrative branch. Caption must say intentionally angle-free, not evidence of native-BM floppiness."

baseline:
  - name: connectivity-sweep
    composite: viva_lumenoid.composites.connectivity_sweep
    params:
      n_rods: 200
      box_xy: 20.0
      assemble_steps: 8000
      hold_steps: 8000
      rungs: "[(1,3,0.12),(2,4,0.25),(3,5,0.40),(5,8,0.60)]"
      seeds: "[11,22,33]"

variants:
  - name: nc1x1-7sx3
    description: Baseline connectivity (NC1×1, 7S×3) — z ≈ 1.2.
    params: {nc1_max_crosslinks: 1, svns_max_crosslinks: 3, make_prob: 0.12}
  - name: nc1x2-7sx4
    description: Raised connectivity (bundling proxy) — z ≈ 1.6.
    params: {nc1_max_crosslinks: 2, svns_max_crosslinks: 4, make_prob: 0.25}
  - name: nc1x3-7sx5
    description: Raised connectivity — z ≈ 2.3.
    params: {nc1_max_crosslinks: 3, svns_max_crosslinks: 5, make_prob: 0.40}
  - name: nc1x5-7sx8
    description: Highest crosslink caps (NC1×5, 7S×8) — measured z tops out ≈2.0 (still ≪ 4).
    params: {nc1_max_crosslinks: 5, svns_max_crosslinks: 8, make_prob: 0.60}

# v4 grouped Build-tab inputs (mirrors baseline + variants above).
conditions:
  baseline:
    composite: viva_lumenoid.composites.connectivity_sweep
    params:
      n_rods: 200
      box_xy: 20.0
      assemble_steps: 8000
      hold_steps: 8000
      rungs: "[(1,3,0.12),(2,4,0.25),(3,5,0.40),(5,8,0.60)]"
      seeds: "[11,22,33]"
  variants:
    - name: nc1x1-7sx3
      description: Baseline connectivity (NC1×1, 7S×3).
    - name: nc1x5-7sx8
      description: Highest crosslink caps; measured z tops out ≈2.0.
  model_settings:
    - name: nc1_max_crosslinks
      default: 1
      current: 1
      range: [1, 5]
      units: count
      cites: [barrientos2026basement]
      notes: "Max NC1 crosslinks per end (released model: 1). Raised as a bundling proxy."
    - name: svns_max_crosslinks
      default: 3
      current: 3
      range: [3, 8]
      units: count
      cites: [barrientos2026basement]
      notes: "Max 7S crosslinks per end (released model: 3). Raised as a bundling proxy."

simulation_set:
  - name: rigidity-connectivity-sweep
    status: completed
    base_model: viva_lumenoid.composites.connectivity_sweep
    seeds: [11, 22, 33]
    metrics:
      z_max: 2.03
      reached_rigid: false
      modulus: "consistent with 0 at every rung"
    pass_fail_tests:
      - "z-stays-below-threshold: pass"
      - "modulus-stays-floppy: pass"

# Canonical run record — feeds the dashboard's Ran · Tests · Verdict strip.
runs:
  - name: rigidity-connectivity-sweep
    base_model: viva_lumenoid.composites.connectivity_sweep
    seeds: [11, 22, 33]
    status: completed
    outcomes:
      z-stays-below-threshold:
        result: PASS
        observed: "z 1.24→2.03 across rungs; never approaches 4"
      modulus-stays-floppy:
        result: PASS
        observed: "modulus consistent with 0 at every rung (angles off)"

readouts:
  - name: coordination_z
    description: Mean bead coordination z at each connectivity rung.
    store_path: "network/n_crosslinks"
    units: dimensionless
    status: measured
  - name: elastic_modulus_vs_z
    description: Seed-ensemble elastic modulus (95% CI) at each z.
    store_path: "network/sigma_inplane"
    units: kT/a^3
    status: measured

behavior_tests:
  - name: z-stays-below-threshold
    classification: primary
    description: The NC1/7S topology cannot reach the 2D rigidity threshold z = 4.
    measure: {kind: max, field: coordination_z}
    pass_if: {op: lt, value: 4.0, field: max_z}
    units: dimensionless
    requires_simulation: rigidity-connectivity-sweep
  - name: modulus-stays-floppy
    classification: primary
    description: The modulus is consistent with zero at every rung while z < 4.
    measure: {kind: value, field: elastic_modulus_vs_z, ensemble: 3}
    pass_if: {op: consistent_with_zero, note: "all CIs span 0"}
    units: kT/a^3
    requires_simulation: rigidity-connectivity-sweep
    cites: [meadowcroft2025nonequilibrium]
    calibration_anchor:
      observed_value: "z 1.24→2.03 (angles off); modulus consistent with 0"
      literature_target: 4.0
      resolution: model
      cites: [meadowcroft2025nonequilibrium]

findings:
  - id: F1-connectivity-cannot-rigidify
    kind: computational
    status: confirms
    statement: >
      Raising NC1/7S crosslink caps lifts measured z only to ~2.0 (never near the
      z = 4 threshold), and the modulus stays consistent with zero throughout —
      central-force connectivity cannot rigidify the v1 angle-off sheet.
    evidence:
      from_run: rigidity-connectivity-sweep
      from_test: modulus-stays-floppy
      observed: "z 1.24→2.03 (angles off, corrected params); modulus consistent with 0"
    expected:
      cites: [meadowcroft2025nonequilibrium]
      range: "rigid only for z ≥ 4 (2D central-force isostatic point)"
    explanation: "NC1×1 + 7S×3 caps z at ~3 in principle, but the sparse angle-off geometry only reaches z≈2.0; either way it saturates below 4."
    next_action: "implement junction bending (released NC1/7S angles) — carried out in bm-v4"
    next_action_type: refine_representation
    provenance:
      run_ids: [rigidity-connectivity-sweep]

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "Connectivity sweep runs; z and modulus recorded per rung."
    biological_validation: "Confirms the floppy-network finding; identifies bending as the rigidity source."
    pipeline_unblocks:
      - "Junction-bending implementation (auto-angles at crosslink junctions)."
  if_primary_tests_fail:
    diagnose:
      - "If z reaches 4 and modulus turns on, connectivity does rigidify — revise the finding."
    block_downstream: "Nothing downstream is blocked — this is a diagnostic follow-up, not a pipeline gate."

visualizations:
  # PRIMARY (figure-review 2026-10-20): the central-force NEGATIVE CONTROL.
  - name: v3-centralforce-control
    address: "html:v3_centralforce_control.html"
    config:
      title: "Central-force control does not reproduce the released network"
      evidence_status: engineered-diagnostic
      tier: main
      caption: >
        With angular potentials intentionally removed (bending_k=0), changing the
        allowable end-link valency does not produce a reproducibly positive modulus
        across sampled connectivities. This artificial control must NOT be
        interpreted as the mechanism of softness in the published model. Measured
        coordination z = 1 + crosslinks/rod is on the x-axis; each seed's athermal
        (energy-minimization) modulus is a point with a zero reference and the
        ensemble mean ± SD (released-code LAMMPS, reduced LJ units; 60-rod network,
        3 seeds 11/22/33). z rises 1.17 → 1.61 across the swept crosslink caps and
        never approaches 4; the modulus is scattered about zero with seed-spread
        exceeding the mean at every rung (every CI spans 0) — not reproducibly
        positive, by design. The z=4 Maxwell line is drawn ONLY as the idealized 2D
        central-force heuristic — it is NOT a threshold for the released,
        angle-stabilized, finite-thickness network, which carries junction angles
        and is soft for other reasons (missing components, thin-sheet geometry, no
        pre-stress).
  # Demoted (figure-review): superseded diagnostic + rigidity movies.
  - name: rigidity-diagnostic
    address: "html:rigidity_diagnostic.html"
    config:
      title: "Rigidity sweep — modulus vs coordination z (superseded)"
      evidence_status: engineered-diagnostic
      tier: supplement
      caption: >
        The earlier modulus-vs-z sweep; superseded as the primary by
        v3-centralforce-control (which frames it explicitly as a negative control
        with the zero reference and the Maxwell-line caveat). Supplement.
  - name: rigidity-movie
    address: "html:rigidity_movie.html"
    config:
      title: "Simulation movie — high-connectivity network (NC1×5 + 7S×8)"
      evidence_status: engineered-diagnostic
      tier: supplement
      caption: >
        Optional animation of the high-connectivity angle-off network; removed from
        the main narrative (a control, not a result). Supplement.
  - name: rigidity-movie-3d
    address: "html:rigidity_movie_3d.html"
    config:
      title: "3D view — the connected network, rotatable"
      evidence_status: engineered-diagnostic
      tier: supplement
      caption: >
        3D rotatable view of the same angle-off network; supplement (removed from
        the main narrative).

limitations:
  - "Cross-check: the released model is not central-force — it sets NC1/7S junction angles (bending). The rigidity-percolation premise here is general physics but does not describe the published model, which is angle-stabilized."
  - "Clean-room parameters transcribed from the spec; the authors' LAMMPS input scripts are now public (Zenodo 10.5281/zenodo.20719515) and not yet cross-checked against this build."
  - "Bundling is modelled only as raised crosslink caps, not explicit lateral-association bonds."
  - "Junction bending is not yet implemented — this study motivates it, does not test it."
  - "Same LJ-unit / energy-scale caveat as stage 1."

report:
  title: "Stage v3 — rigidity percolation (superseded explanation)"
  verdict: >
    The rigidity-percolation explanation for the soft modulus is retired by the
    2026-10-01 cross-check: the released model is not central-force (it has junction
    angles) and is soft anyway. This sweep documents only that our angle-off
    transcription is sub-isostatic and soft; it does not explain the published model.
  confidence: low
  evidence_quality: preliminary
  main_insight: >
    The published model's softness is not a crosslink-connectivity effect — it
    persists despite the junction angles, so it must come from the factors the spec
    names (missing components, thin-sheet geometry, no pre-stress). Connectivity is
    not the lever.

bibliography:
  sources:
    - key: meadowcroft2025nonequilibrium
      note: The two-bead-rod + stochastic-crosslink model; its ≈0.03 Pa modulus is the near-floppy regime this study explains.
