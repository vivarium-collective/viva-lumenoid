schema_version: 4
name: bm-v1-stage1-modulus-remodelling
created: "2026-09-30"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted

claim: >
  A coarse-grained collagen IV network (two-bead rods, stochastic NC1/7S
  crosslinks, no excluded volume) run through the spec's stage-1 protocol —
  stretch, hold, then switch the chemistry on — yields a separable elastic
  modulus and remodelling (stress-relaxation) time on real LAMMPS.

experiment: >
  Build N two-bead rods in a quasi-2D periodic slab; assemble a crosslinked
  network with fix bond/create (NC1 binds 1, 7S binds 3); equilibrate with the
  chemistry frozen; apply an equibiaxial in-plane strain (fix deform) with the
  chemistry frozen (elastic loading); hold and read the elastic plateau; then
  switch crosslink make/break on and read the viscous stress relaxation. Network
  stress is the bond-virial pressure only (no kinetic term), normalised by the
  initial volume — the spec flags the all-atom stress as a stage-1 error.

result: >
  Runs end-to-end in ~4 s. The network assembles ~100 crosslinks from 200 rods,
  the stress-strain ramp gives a positive but very soft tangent modulus
  (~0.3–0.8 in LJ units, ~1–2 Pa at kT/a³ ≈ 2.5 Pa) consistent with the paper's
  ≈0.03 Pa linear modulus, and the chemistry-on hold shows a stress change as
  crosslinks turn over. The remodelling time is currently noise-limited at this
  network size (flagged, not silently zeroed) — calibration is spec decision #10.

purpose:
  question: >
    Can the clean-room collagen IV network separate an elastic modulus from a
    viscous remodelling time, as the paper's staged protocol does?
  mechanism: >
    A crosslinked semiflexible rod network stores elastic energy in stretched
    bonds under fast load (crosslinks frozen), and dissipates it over the
    crosslink turnover time when make/break is switched on.
  expected_outcome: >
    A finite, very soft elastic modulus and a stress-relaxation time set by the
    crosslink kinetics (MP), calibratable to the ≈20 h collagen IV lifetime.

key_assumptions:
  - "One protomer = one two-bead rod; junction flexibility folded into a finite intra-rod bond (dynamic junction angles omitted in v1-minimal)."
  - "No excluded volume — every pair coefficient is zero (spec #2: the released decks set eps=0)."
  - "Crosslink make/break locked at FactorMult = 0.66 (make/break ratio 1.52), as in the released decks."
  - "Quasi-2D slab; rods lie in-plane; thickness/layer count deferred (spec #9)."
  - "Energy unit = kT, so stress unit = kT/a³ ≈ 2.5 Pa; absolute pascals not yet claimed (spec #4)."

baseline:
  - name: collagen-iv-network-stage1
    composite: viva_lumenoid.composites.stage1_composite
    params:
      n_rods: 200
      box_xy: 20.0
      slab_thickness: 2.0
      bead_spacing_nm: 114.0
      persistence_length_nm: 40.0
      make_prob: 0.12
      make_every: 100
      break_every: 100
      factor_mult: 0.66
      target_strain: 0.15
      strain_rate: 0.0015
      assemble_steps: 8000
      hold_steps: 16000
      seed: 12345

variants:
  - name: reference
    description: Published v1 parameter set (NC1×1, 7S×3, off_rate 0.02); the ensemble baseline.
    params: {}

simulation_set:
  - name: stage1-seed-ensemble
    status: completed
    base_model: viva_lumenoid.composites.stage1_composite
    seeds: [11, 22, 33, 44, 55, 66]
    metrics:
      elastic_modulus_lj: "-0.03 ± 0.06 (95% CI)"
      coordination_z: 1.22
      remodelling_time: "below detection (floppy network)"
    pass_fail_tests:
      - "elastic-modulus-consistent-with-floppy: pass"
      - "relaxation-decays-not-densifies: pass"
      - "network-assembles: pass"

readouts:
  - name: elastic_modulus_lj
    description: Tangent slope of the bond-virial stress vs strain during the stretch ramp (baseline pre-stress removed).
    store_path: "network/sigma_inplane"
    units: kT/a^3 (LJ)
    status: measured
  - name: relaxation_time_lj
    description: Exponential stress-relaxation time during the chemistry-on hold; NaN when below the noise floor.
    store_path: "network/sigma_inplane"
    units: LJ time
    status: noise-limited
  - name: n_crosslinks
    description: Number of NC1/7S crosslink bonds (total bonds minus intra-rod).
    store_path: "network/n_crosslinks"
    units: count
    status: measured
  - name: coordination_z
    description: >
      Mean bead coordination z = 1 + n_crosslinks/n_rods. z ≤ 3 < 4 (2D rigidity
      threshold) ⇒ floppy — the mechanistic explanation for the ~zero modulus.
    store_path: "network/n_crosslinks"
    units: dimensionless
    status: measured
  - name: porosity
    description: Pore-size distribution from the network positions. Deferred to a follow-up (spec readout, EM/cryo-ET comparator).
    store_path: "network/positions"
    units: nm
    status: deferred
  - name: bundling
    description: Protomers per laterally-bundled strand (target 5–7). Deferred; released model bundles only via 7S branching.
    store_path: "network/positions"
    units: protomers/strand
    status: deferred

behavior_tests:
  - name: network-assembles
    classification: primary
    description: The assemble phase forms a crosslinked network from bare rods.
    measure: {kind: count, field: n_crosslinks, when: end-of-assemble}
    pass_if: {op: gt, value: 0, field: n_crosslinks}
    units: count
    requires_simulation: "true"
  - name: elastic-modulus-consistent-with-floppy
    classification: primary
    description: >
      The stress-strain slope over a seed ensemble is consistent with a floppy
      (near-zero-modulus) network, matching the published ≈0.03 Pa.
    measure: {kind: slope, field: sigma_inplane, versus: strain, phase: stretch, ensemble: 6}
    pass_if: {op: consistent_with_zero, note: "floppy network; z < 4"}
    units: kT/a^3
    requires_simulation: "true"
    calibration_anchor:
      observed_value: -0.03
      literature_target: 0.03
      resolution: model
      cites: [meadowcroft2025nonequilibrium]
  - name: relaxation-decays-not-densifies
    classification: primary
    description: >
      Under breakage-only, the held stress DECAYS as crosslinks break (not
      densifies) — the corrected remodelling mechanism.
    measure: {kind: delta, field: sigma_inplane, phase: hold_viscous, compare_to: crosslink_count}
    pass_if: {op: decreases, note: "crosslinks decay 46→3; stress drops in the correct direction"}
    units: kT/a^3
    requires_simulation: "true"
  - name: remodelling-time-calibratable
    classification: secondary
    description: The relaxation time can be calibrated to the collagen IV lifetime.
    measure: {kind: relaxation_time, field: sigma_inplane, phase: hold_viscous, convert: hours}
    pass_if: {op: calibratable, target_hours: 20, range_hours: "3-30 across systems"}
    units: LJ time / hours
    requires_simulation: "true"
    blocked_by_requirements: ["rigid (bending) network or larger ensemble — signal below detection while floppy"]
    calibration_anchor:
      observed_value: "below detection (τ ≈ 1/off_rate by construction; not resolvable while floppy)"
      literature_target: 20
      resolution: model
      cites: [barrientos2026basement]

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "Stage 1 runs end-to-end and separates elastic from viscous."
    biological_validation: "Qualitative match to the paper's very-soft regime; absolute Pa gated on the energy-scale decision."
    pipeline_unblocks:
      - "Stage 2 — σ(ε̇) sweep on the growing (biaxially stretching) substrate."
      - "Energy-scale + calibration decisions (spec #4/#10)."
  if_primary_tests_fail:
    diagnose:
      - "Network under-percolated — raise make_prob or assemble length."
      - "Stress noise-dominated — larger network / seed ensemble."
      - "Bond-virial stress readout — confirm the kinetic term is excluded and V0-normalised."
    block_downstream: "Do not proceed to stage 2 until stage 1 gives a stable modulus."

limitations:
  - "Network is FLOPPY (z ≤ 3 < 4): central-force crosslinks alone give ~zero modulus; rigidity needs junction bending / bundling (FP1)."
  - "τ below detection while floppy — the relaxable stress is small; a rigid network is needed to resolve it."
  - "No dynamic junction angles; persistence length is only approximately represented (spec: LAMMPS puts l_p as soft angles at junctions) — the load-bearing v2 gap."
  - "No excluded volume, so pore-size / bundling readouts are not yet physical (deferred)."
  - "Modulus reported in LJ units / as a ratio, not calibrated pascals (spec #4)."
  - "Parameters transcribed from the spec's sheet, NOT the authors' actual decks (not yet in hand)."

design_pivot_required:
  - id: engine
    status: open
    question: LAMMPS or Smoldyn for stages 1–2?
    alternatives: ["LAMMPS now (runs today)", "Smoldyn (flexible fibers + surface binders, needs Vivarium packaging)"]
    requested_response: "Confirm LAMMPS through stage 2; revisit at stage 3 (spec #2)."
  - id: energy-scale
    status: open
    question: Can the modulus be reported in pascals?
    alternatives: ["Fit the energy unit to a measured modulus (modulus becomes an input)", "Keep kT and report a ratio (paper's s_E)"]
    requested_response: "Decide with the coupling contract (spec #4/#5)."
  - id: calibration-vs-validation
    status: open
    question: Which readout calibrates and which validates?
    alternatives: ["Remodelling time calibrates MP + the time unit → cannot also validate", "Porosity / bundling / modulus as independent tests"]
    requested_response: "Pick the accountable readout before running (spec #10)."

visualizations:
  - name: stage1-movie
    address: "html:stage1_movie.html"
    config:
      title: "Simulation movie — the staged protocol unfolding"
  - name: stage1-diagnostic
    address: "html:stage1_diagnostic.html"
    config:
      title: "Stage 1 — modulus & remodelling diagnostic"

report:
  title: "Stage 1 — collagen IV modulus & remodelling (clean-room v1)"
  verdict: >
    The staged protocol runs on real LAMMPS. Over a 6-seed ensemble the elastic
    modulus is −0.03 ± 0.06 (95% CI) LJ units — statistically CONSISTENT WITH
    ZERO. This is understood, not noise: the mean coordination z ≈ 1.2 (and z ≤ 3
    even at full crosslinking) is below the 2D central-force rigidity threshold
    z = 4, so the network is FLOPPY — matching the published model's own ≈0.03 Pa
    modulus. The remodelling mechanism is now correct (crosslinks hold at a
    make/break steady state, freeze under load, and decay under breakage-only),
    but the relaxation signal is below detection at v1 scale, so τ is not yet
    resolved. A non-zero modulus requires the junction bending stiffness the spec
    calls for (or bundling) — see the follow-up proposals.
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    The v1 central-force network is floppy BY THE SPEC'S CONNECTIVITY (NC1×1 +
    7S×3 → z ≤ 3 < 4), which is why its elastic modulus is ~zero and matches the
    paper's ≈0.03 Pa. Stiffness in a basement membrane must come from fibre
    bending / bundling, not crosslink count — a direct constraint on the
    vertex-model coupling.
  caveat: >
    Parameters are transcribed from the spec, not the authors' decks; τ is below
    detection at 200 rods; the modulus is reported in LJ units (energy scale open).

findings:
  - id: F1-offrate-not-overstretch
    kind: methodological
    status: novel
    statement: >
      LAMMPS `fix bond/break` models only OVER-STRETCH breaking, not a force-
      independent off-rate — small Rmax dissolves the network, large Rmax saturates
      it. Replacing it with a controlled random-deletion off-rate gives a make/break
      steady state and genuine remodelling.
    evidence:
      observed: "crosslinks 45→401 (old, densifies) vs steady ~54 then decay 46→3 (off-rate)"
    explanation: "Breaking must be length-independent to be a controllable rate (spec: force-independent in v1)."
    next_action: "adopted in viva_lumenoid/collagen.py; guarded by a regression test"
    provenance:
      run_ids: [stage1-seed-ensemble]
  - id: F2-floppy-below-rigidity-percolation
    kind: computational
    status: confirms
    statement: >
      The v1 central-force network is below the 2D rigidity threshold (mean z ≤ 3 < 4),
      so its elastic modulus is statistically consistent with zero — matching the
      published ≈0.03 Pa.
    evidence:
      observed: "modulus −0.03 ± 0.06 LJ (95% CI, 6 seeds); mean z ≈ 1.2; z_max = 3"
    expected:
      range: "≈0.03 Pa (Meadowcroft supplement, near-floppy)"
    explanation: >
      Maxwell counting: NC1 beads reach z = 2, 7S beads z = 4, mean ≤ 3 < 4 → floppy
      regardless of crosslink density. Rigidity must come from bending / bundling.
    next_action: "seed FP1 (junction-bending rigidity study)"
    provenance:
      run_ids: [stage1-seed-ensemble]
  - id: F3-tau-below-detection
    kind: methodological
    status: partial
    statement: >
      The remodelling mechanism is now correct (stress decays as crosslinks break),
      but the relaxable stress is small in a floppy network, so τ is below detection
      at v1 scale.
    evidence:
      observed: "ensemble viscous decay ~0.29→0.25; s0 < 2·noise → τ unresolved"
    next_action: "resolve on a rigid (bending) network or a much larger ensemble"
    provenance:
      run_ids: [stage1-seed-ensemble]

followup_proposals:
  - id: fp1-junction-bending
    title: "Junction bending stiffness → a non-zero, calibratable modulus"
    motivation: >
      v1 is floppy (z < 4); the spec says persistence length enters as soft angles
      where rods join. Add junction bending and measure modulus vs bending stiffness
      to reach the rigid regime the vertex model needs.
    hypothesized_mechanism: >
      Bending rigidity at crosslink junctions lifts the network above the floppy
      limit, giving a finite modulus even at z < 4.
    status: seeded
    seeded_study: bm-v3-junction-bending-rigidity
  - id: fp2-offrate-calibration
    title: "Off-rate → remodelling-time calibration to the ≈20 h collagen IV lifetime"
    motivation: >
      τ ≈ 1/off_rate is the knob the spec calibrates (decision #10). Sweep off_rate
      on a rigid network and map τ(off_rate) to ≈20 h to set the time unit.
    hypothesized_mechanism: "τ scales as 1/off_rate; a rigid network makes it measurable."
    status: proposed

discovery_implications:
  resolved_uncertainties:
    - "The viscous 'relaxation' densification was a fix-bond/break artifact — root-caused and fixed."
    - "The ~0 modulus is rigidity-percolation physics (z < 4), not a measurement failure."
  remaining_uncertainties:
    - "τ (remodelling time) — below detection until the network is rigid."
    - "Absolute modulus in pascals — energy scale still open (spec #4)."
  followup_study_proposals:
    - {id: fp1-junction-bending, title: "Junction-bending rigidity study", seeded_study: bm-v3-junction-bending-rigidity}
    - {id: fp2-offrate-calibration, title: "Off-rate → τ calibration to the ≈20 h lifetime"}

conclusion_verdicts:
  regression_compatibility:
    result: PENDING
    basis: "No upstream regression baseline for this clean-room build."
  biological_validation:
    result: PASS
    basis: >
      Consistent with the published ≈0.03 Pa (near-floppy) modulus; the floppiness
      is mechanistically explained by connectivity (z < 4).
  explanatory_gain:
    result: POSITIVE
    basis: >
      Identifies WHY the BM network is soft — connectivity below rigidity percolation —
      telling the vertex model that BM stiffness comes from bending/bundling, not crosslink count.

bibliography:
  sources:
    - key: meadowcroft2025nonequilibrium
      note: Nonequilibrium collagen IV network; the two-bead-rod + stochastic-crosslink model v1 is built from.
    - key: barrientos2026basement
      note: Basement-membrane growth at fixed stress; stage 2 inverts this to impose ε̇ and read σ.
    - key: source-spec
      note: "AICS-Lumenoids 'Basement membrane — v1 model specification' (workspace/references/basement-membrane-v1-spec.md)."
