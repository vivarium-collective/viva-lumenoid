schema_version: 4
name: bm-v5-porosity-bundling
title: "Network porosity & strand bundling"
created: "2026-09-30"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted

claim: >
  Of the two geometric readouts the model should reproduce, one is met and one is
  not. The simulated pore-size distribution reaches the measured corneal-EM band
  (72 ± 40 nm) at realistic density, while the protomers-per-strand distribution
  stays near 1, below the measured 5-7. The released NC1/7S topology has no
  lateral-association bond, so it cannot form multi-protomer strands — a limitation
  identified in advance.

experiment: >
  Assemble the real LAMMPS collagen IV network at several densities, then read
  porosity (pore-size distribution via the maximal-inscribed-disc / distance-
  transform method) and bundling (protomers per laterally-associated strand, at
  the measured 59.5 nm cell-deposited lateral spacing) off the snapshot, and
  place both against the measured comparators.

result: >
  With the parameters corrected to the released code (a 3σ rod, σ≈125 nm), the pore
  median falls with coverage and lands near or within the measured corneal-EM band
  (72 ± 40 nm) at the densest network (median ~54 nm): the open mesh is realistic,
  and pore size is a density knob rather than a fixed property. Bundling stays near
  1 (mean ~1.29 protomers per strand, mostly singletons, up to ~6). With no
  lateral-association bond, the NC1/7S topology cannot build the 5-7-protomer
  strands measured in the PFHR-9 scaffold.

# Canonical DAG edge (supersedes the legacy parent_studies shim).
pipeline_gate:
  prerequisites:
    - study: bm-v1-stage1-modulus-remodelling
      condition: tests-passed
  enables: []
  proceed_condition: >
    Diagnostic readout study; gates nothing. Motivates a v2 lateral-association bond.

question: Does the v1 network reproduce the measured pore-size and bundling of a real BM?

purpose:
  question: Does the v1 network reproduce the measured pore-size and bundling of a real BM?
  mechanism: >
    Porosity is set by the areal density of rods (an emergent mesh); bundling
    requires lateral association of 5–7 protomers into a strand, a bond the
    released NC1/7S model does not have (it can bundle only through 7S branching).
  expected_outcome: >
    Pore size tunable into the EM band with density; bundling under-shoots 5–7
    because there is no lateral-association bond — a readout that reproduces
    porosity but exposes a missing connectivity mode.

key_assumptions:
  - "Pore size = diameter of the maximal empty disc inscribed in the periodic network plane."
  - "A strand = connected component of rods within 59.5 nm (≈0.5 a) lateral spacing AND near-parallel (≤22°)."
  - "Length unit a = 114 nm (bead spacing); readouts converted to nm via a."
  - "Same clean-room parameters and force-independent off-rate as stage 1."

model_assumptions_declaration:
  preferred_vs_realized: "n/a — geometric readout of an assembled network"
  load_control_vs_reaction: "imposed assembly"
  geometry_dimension: "quasi-2D slab"
  material_representation: "explicit-LAMMPS"
  growth_vs_division: "n/a"
  calibration_limits: "length unit a=114nm firm; stiffness not; corneal-EM comparison is cross-system reference, not lumenoid validation"

meeting_alignment_2026_10_20:
  disposition: revise
  note: "Porosity and bundling are two distinct mechanisms; corneal-BM comparisons are contextual, not direct wing-disc/lumenoid calibration. Do not infer physical BM thickness from a 2D projection."

baseline:
  - name: porosity-bundling-network
    composite: viva_lumenoid.composites.porosity_bundling
    params:
      n_rods: 500
      box_xy: 20.0
      assemble_steps: 8000

variants:
  - name: density-sweep
    description: Assemble at coverage rungs (150, 250, 350, 500 rods) to place pore size vs density.
    params: {box_xy: 20.0}

# v4 grouped Build-tab inputs (mirrors baseline + variants above).
conditions:
  baseline:
    composite: viva_lumenoid.composites.porosity_bundling
    params:
      n_rods: 500
      box_xy: 20.0
      assemble_steps: 8000
  variants:
    - name: density-sweep
      description: Coverage rungs (150, 250, 350, 500 rods) to place pore size vs density.
  model_settings:
    - name: n_rods
      default: 500
      current: 500
      range: [150, 500]
      units: count
      cites: [abrams2000nanoscale]
      notes: "Areal rod coverage; sets emergent pore size. Densest rung lands pore median in the EM band."

simulation_set:
  - name: porosity-bundling-density-sweep
    status: completed
    base_model: viva_lumenoid.composites.porosity_bundling
    seeds: [12345]
    metrics:
      pore_median_nm_dense: 54.0
      mean_strand_dense: 1.29
      max_strand: 7
      frac_in_5_7: 0.02
    pass_fail_tests:
      - "porosity-reaches-EM-band: pass"
      - "bundling-under-shoots-5-7: pass"

# Canonical run record — feeds the dashboard's Ran · Tests · Verdict strip.
runs:
  - name: porosity-bundling-density-sweep
    base_model: viva_lumenoid.composites.porosity_bundling
    seeds: [12345]
    status: completed
    outcomes:
      porosity-reaches-EM-band:
        result: PASS
        observed: "median pore ~54 nm at the densest network (within 72 ± 40 nm band)"
      bundling-under-shoots-5-7:
        result: PASS
        observed: "mean ~1.29 protomers/strand (mostly singletons); below measured 5–7"

readouts:
  - name: pore_diameter
    description: Pore-size distribution (maximal inscribed disc), in nm.
    store_path: "network/positions"
    units: nm
    status: measured
  - name: protomers_per_strand
    description: Bundling — protomers per laterally-associated strand.
    store_path: "network/positions"
    units: count
    status: measured

behavior_tests:
  - name: porosity-reaches-EM-band
    classification: primary
    description: The simulated pore median falls within the corneal-EM band (72 ± 40 nm) at realistic density.
    measure: {kind: median, field: pore_diameter}
    pass_if: {op: between, lo: 32.0, hi: 112.0, field: median_pore_nm}
    units: nm
    requires_simulation: porosity-bundling-density-sweep
    cites: [abrams2000nanoscale]
    calibration_anchor:
      observed_value: "median 54 nm at the densest network (corrected σ≈125 nm)"
      literature_target: "72 ± 40 nm (corneal BM, low-voltage SEM)"
      resolution: model
      cites: [abrams2000nanoscale]
  - name: bundling-under-shoots-5-7
    classification: primary
    description: >
      The NC1/7S-only network cannot build 5–7-protomer strands — the bundling
      distribution stays near 1 (below the measured 5–7, confirming the missing
      lateral-association bond).
    measure: {kind: mean, field: protomers_per_strand}
    pass_if: {op: lt, value: 2.0, field: mean_strand}
    units: count
    requires_simulation: porosity-bundling-density-sweep
    cites: [pokidysheva2025targeted]
    calibration_anchor:
      observed_value: "mean 1.29 protomers/strand, mostly singletons, max ~6"
      literature_target: "5–7 protomers/strand (PFHR-9 scaffold, immuno-gold SEM)"
      resolution: model
      cites: [pokidysheva2025targeted]

findings:
  - id: F1-porosity-matches-EM-at-density
    kind: computational
    status: confirms
    statement: >
      Pore size scales with network density and reaches the corneal-EM band
      (72 ± 40 nm) at the densest sampled network (median 54 nm, corrected σ≈125 nm) — the mesh is
      realistic and pore size is a tunable density readout, not a free universal.
    evidence:
      from_run: porosity-bundling-density-sweep
      from_test: porosity-reaches-EM-band
      observed: "median pore ~54 nm at the densest network"
    expected:
      cites: [abrams2000nanoscale]
      range: "72 ± 40 nm (corneal BM EM); 20–60 nm hydrated Matrigel"
    explanation: "Porosity is emergent from areal coverage; the comparator fixes a density."
    provenance:
      run_ids: [porosity-bundling-density-sweep]
  - id: F2-bundling-undershoots
    kind: computational
    status: confirms
    statement: >
      The NC1/7S-only topology does not bundle: mean strand size stays near 1
      (~82% singletons), below the 5–7 protomers per strand measured in the
      PFHR-9 scaffold. The model has no lateral-association bond.
    evidence:
      from_run: porosity-bundling-density-sweep
      from_test: bundling-under-shoots-5-7
      observed: "mean strand ~1.29, max ~6, <5% of rods in 5–7 strands"
    expected:
      cites: [pokidysheva2025targeted]
      range: "5–7 protomers per strand (PFHR-9 cell-deposited scaffold)"
    explanation: >
      The released model bundles only through 7S branching; the lateral-
      association bond that builds strands is absent.
    next_action: "add an explicit lateral-association bond (v2) and re-measure bundling"
    next_action_type: refine_representation
    provenance:
      run_ids: [porosity-bundling-density-sweep]

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "Porosity + bundling readouts run on the real network across densities."
    biological_validation: "Porosity reproduces the EM comparator; bundling exposes a missing connectivity mode."
    pipeline_unblocks:
      - "A v2 lateral-association bond (to build 5–7 strands) and bundle-driven stiffening."
  if_primary_tests_fail:
    diagnose:
      - "If bundling reaches 5–7 without a lateral bond, 7S branching alone suffices — revise F2."
    block_downstream: "Diagnostic readout study; nothing downstream is gated on it."

visualizations:
  # MAIN 1 (2026-10-20 review: split the old 2×2 into two story figures) — the
  # porosity story: pore-size CDF + median-vs-coverage + low/high network images.
  - name: pore-size-coverage
    address: "html:bm_v5_porosity.html"
    config:
      title: "Simulated pore size reaches the corneal-EM reference at density"
      evidence_status: observed
      tier: main
      caption: >
        How to read: follow the pore-diameter distributions as areal coverage rises
        (median shifts 88 → 62 → 54 nm); the result is reached when the densest
        network's distribution overlaps the shaded corneal-EM reference band, meaning
        the simulated mesh has reached a realistic open-mesh pore size.
        Simulated pore-diameter distribution (maximal-inscribed-disc /
        distance-transform method, periodic plane) at three areal-coverage rungs;
        lengths via σ = 125 nm. Real assembled-network geometry (single
        deterministic run, seed 12345; box 13σ, 12σ slab, assemble 10000). Median
        pore falls with coverage (88 → 62 → 54 nm) and the densest network reaches
        the corneal-EM REFERENCE band (72 ± 40 nm; Abrams 2000, low-voltage SEM),
        shaded. Panels C/D show the mesh at low (200 rods) vs high (500 rods)
        density as a 2D top-down projection of the quasi-2D slab, with matched
        2σ ≈ 250 nm scale bars. The corneal-EM band is a cross-system REFERENCE
        for an open-mesh length scale, NOT validation for lumenoid BM; the match
        holds at one coverage, it is not a universal property.
  # MAIN 2 — the bundling story: protomers-per-strand vs the 5–7 reference.
  - name: protomers-per-strand
    address: "html:bm_v5_bundling.html"
    config:
      title: "The NC1/7S-only network under-bundles (no lateral-association bond)"
      evidence_status: observed
      tier: main
      caption: >
        How to read: look at where the protomers-per-strand distribution sits relative
        to the shaded 5–7 reference band; because it piles up at 1 (mostly single
        protomers) and falls well short of the band, the network under-bundles — the
        gap between the distribution and the shaded band is the missing lateral association.
        Protomers-per-strand distribution at the densest network. STRAND
        DEFINITION: a connected component of rods whose minimum-image midpoints lie
        within the measured cell-deposited lateral spacing (59.5 nm ≈ 0.48σ) AND
        run ≤22° parallel. Real geometry (single deterministic run, seed 12345).
        Strands are predominantly isolated protomers (mean 1.38, 76% singletons,
        max 6; ~6% of rods in strands of 5–7), below the PFHR-9 REFERENCE band
        (5–7 protomers/strand; Pokidysheva 2025, immuno-gold SEM), shaded. The
        shortfall is consistent with the released NC1/7S topology having no
        explicit lateral-association bond; it is NOT evidence that NC1/7S chemistry
        alone recapitulates bundled BM. The PFHR-9 band is a cross-system
        reference, not validation; the missing lateral association is the named gap.
  # SUPPLEMENT — the original combined 2×2 panel (kept; real geometry).
  - name: porosity-bundling
    address: "html:porosity_bundling.html"
    config:
      title: "Stage 5 — combined porosity & bundling panel (supplement)"
      evidence_status: observed
      tier: supplement
      caption: >
        The original 2×2 panel (pore histogram + density scaling + strand sizes +
        pore map), retained as a combined reference. Superseded for the headline
        narrative by the two split story figures above. Same real geometry; the
        measured bands are cross-system references, not validation.
  # SUPPLEMENT — the comparison-audit / evidence map (incompatible units/systems).
  - name: evidence-map
    address: "html:evidence_map.html"
    config:
      title: "Comparison-audit — readouts vs measured comparators (supplement)"
      evidence_status: engineered-diagnostic
      tier: supplement
      caption: >
        A comparison-audit forest plot of every spec comparator (geometry, pores,
        modulus, bundling, time) with the model's own values where run. The panels
        span incompatible units and biological systems, so it is an audit table,
        not a single scientific claim — kept in supplement per the figure review.
  # SUPPLEMENT — one optional assembly movie.
  - name: assembly-movie
    address: "html:assembly_movie.html"
    config:
      title: "Simulation movie — a porous collagen IV mesh forms (supplement)"
      evidence_status: engineered-diagnostic
      tier: supplement
      caption: >
        Optional animation of the collagen IV mesh assembling. Illustrative
        spatial context; the quantitative pore/bundle readouts are in the two main
        figures. 2D top-down projection of the quasi-2D slab.

limitations:
  - "Cross-check: pore sizes in nm use the wrong length mapping (rod is 1σ here, 3σ in the released code → σ≈125 nm), and bundling is affected by the absent 7S angles that organise trimers. Not a like-for-like comparison."
  - "Clean-room parameters transcribed from the spec; the authors' LAMMPS input scripts are now public (Zenodo 10.5281/zenodo.20719515) and not yet cross-checked against this build."
  - "Bundling is inferred geometrically (lateral proximity + parallelism), not from explicit lateral bonds the model lacks."
  - "Pore sizes depend on the chosen density; the comparator is matched at one coverage, not proven universal."
  - "Single seed per density rung; a seed ensemble would put CIs on the pore/bundling trends."
  - "Same LJ-unit / energy-scale caveat as stage 1 (lengths are firm via a = 114 nm; stiffness is not)."

report:
  title: "Stage v5 — porosity & bundling: the geometric readouts"
  verdict: >
    The network reproduces the measured pore-size distribution at realistic
    density but does not bundle: protomers-per-strand stays near 1, below the
    measured 5–7. Porosity meets its comparator; bundling identifies a missing
    lateral-association bond as the next model addition.
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    Of the two geometric readouts, porosity falls within the measured band and
    bundling does not. The gap isolates one missing interaction — a lateral-
    association bond — rather than a diffuse discrepancy.

bibliography:
  sources:
    - key: abrams2000nanoscale
      note: Corneal BM pore diameter 72 ± 40 nm (low-voltage SEM) — the porosity comparator.
    - key: pokidysheva2025targeted
      note: 5–7 protomers per laterally-bundled strand in the PFHR-9 scaffold — the bundling comparator.
