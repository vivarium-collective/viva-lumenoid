report:
  title: "E4 -- bidirectional epithelium<->BM coupling: reduced-order controls + explicit-LAMMPS-BM loop"
  verdict: >
    The multiscale-coupling capstone now runs on BOTH BM realizations. On the reduced-order BM
    the bidirectional loop runs end-to-end, the three coupling controls behave exactly as the
    mechanism requires (two-way basal_tension -0.2995, one-way 0.0, uncoupled bm_sigma 0.0), and
    subcycling converges (|s8-s4| 0.017 < |s2-s1| 0.066). The EXPLICIT-LAMMPS-collagen-BM path
    now closes E4's main gap: the real bidirectional loop runs bounded at 40 rods with correct
    feedback directionality (two-way basal_tension != 0, one-way == 0 exactly). It is, however,
    numerically delicate -- the explicit collagen carries intrinsic stress (uncoupled != 0) and
    its subcycling DIVERGES (stable only at coarse subcycling / ~40 rods), so a stable
    explicit-BM integrator + gain calibration (and the full exchange-interval) are the open items.
  confidence: medium
  evidence_quality: solid
  main_insight: >
    Putting the REAL explicit collagen BM in the loop both closes the coupling gap AND exposes
    what the reduced-order path hid: the explicit BM has intrinsic stress and its subcycling
    diverges rather than converges. The coupling directionality is correct on both paths, but the
    explicit path needs a stable subcycling scheme + recalibrated gains before it can be a
    publication-quality quantitative result -- a concrete next step, honestly scoped.
  caveat: >
    Reduced-order path: clean controls + convergence. Explicit path: demonstrated but delicate --
    stable only at ~40 rods / coarse subcycling (120 rods diverges), uncoupled stress not zero,
    subcycling divergent. v0 single patch, reduced units, single deterministic runs. Run locally
    (the loop is light; a denser run diverges, so the mini was not useful here).

findings:
  - id: F1-bidirectional-coupling-controls-separate
    kind: computational
    status: confirms
    tier: mechanism
    mechanism_origin: engineered
    statement: >
      The bidirectional epithelium<->BM coupling runs end-to-end on the reduced-order BM and
      the three coupling controls separate exactly as the mechanism demands: two-way feeds the
      membrane reaction back as a non-zero basal tension (-0.2995), one-way feeds none back
      (0.0), and uncoupled leaves the membrane inert (bm_sigma 0.0).
    evidence:
      from_run: e4-coupling-controls
      from_test: two-way-feeds-back-reaction
      observed: "two-way basal_tension -0.2995; one-way basal_tension 0.0; uncoupled bm_sigma 0.0"
    expected:
      cites: [barrientos2026cellshape]
      range: "a growing epithelium's basement membrane pushes back on the cells; absent when the reaction is not wired"
    explanation: >
      coupling_mode gates the two halves of the contract: the forward half (strain_gain) drives
      the BM, the reaction half (tension_gain) feeds the BM stress back as a basal tension.
      Two-way enables both; one-way drops the reaction; uncoupled drops the forward drive, so
      the BM carries no stress.
    next_action: "realize the same contract on the explicit LAMMPS collagen network (bm_mode explicit)"
    next_action_type: escalate_model
    provenance:
      run_ids: [e4-coupling-controls]
  - id: F2-reduced-order-bm-subcycling-converges
    kind: computational
    status: confirms
    tier: mechanism
    mechanism_origin: engineered
    statement: >
      Subcycling the reduced-order BM relaxation converges: bm_sigma over bm_substeps {1,2,4,8}
      = -14.976/-15.042/-15.075/-15.092, with the successive-refinement error shrinking
      monotonically (0.066 -> 0.033 -> 0.017), so |s8-s4| 0.017 < |s2-s1| 0.066.
    evidence:
      from_run: e4-bm-subcycling-sweep
      from_test: bm-subcycling-converges
      observed: "refinement error 0.0659 -> 0.0333 -> 0.0167 as substeps double"
    explanation: >
      Finer substeps integrate the BM rest-area relaxation more accurately within each coupling
      step; the error halving per doubling is first-order convergence of the reduced-order BM
      integrator.
    next_action: "check convergence of the FULL epithelium<->BM exchange interval, not only the reduced-order BM substep"
    next_action_type: refine_representation
    provenance:
      run_ids: [e4-bm-subcycling-sweep]
  - id: F3-reduced-order-path-only
    kind: methodological
    status: partial
    tier: observation
    statement: >
      The reduced-order (effective) BM path (bm_mode=reduced) is the clean, fully-converged
      realization; the explicit-LAMMPS-BM path is now also exercised (see F4/F5) but is
      numerically delicate. The spatially resolved E4 feedback predictions
      (turnover/heterogeneity/confinement/adhesion/failure) remain a v0 single patch, not yet
      simulated.
    evidence:
      from_run: e4-coupling-controls
      from_test: uncoupled-bm-inert
      observed: "reduced path: clean controls + convergence; explicit path: demonstrated but delicate (F4/F5); spatial predictions not yet run"
    next_action: "stand up the spatially resolved E4 feedback predictions; stabilize + calibrate the explicit-BM path (F5)"
    next_action_type: escalate_model
    provenance:
      run_ids: [e4-coupling-controls]
  - id: F4-explicit-bm-loop-demonstrated
    kind: computational
    status: confirms
    tier: mechanism
    mechanism_origin: engineered
    statement: >
      The EXPLICIT-LAMMPS-collagen-BM path now runs the real bidirectional loop end-to-end: the
      epithelial basal shell stretches a real LAMMPS collagen IV patch and its bond-virial stress
      is fed back as a basal tension. Over 16 steps at 40 rods the round-trip is bounded (basal
      area 199.0 -> 160.1, lumen pressure 6.7 -> 78.1), and the feedback DIRECTIONALITY control
      holds: two-way basal_tension != 0 (e.g. +0.106), one-way basal_tension == 0 exactly. This
      closes E4's main open gap (the recorded controls were previously reduced-order only).
    evidence:
      from_run: e4-explicit-coupling-controls
      from_test: explicit-two-way-feeds-back-reaction
      observed: "explicit two-way basal_tension != 0; one-way == 0; loop bounded at 40 rods/16 steps"
    expected:
      cites: [barrientos2026cellshape]
      range: "a real collagen BM in the loop pushes back on the epithelium (bidirectional feedback), as on the effective-BM path"
    explanation: >
      With bm_mode=explicit the coupling drives a persistent CollagenNetworkProcess instead of an
      analytic relaxation; coupling_mode still gates the reaction half, so one-way zeroes the fed-
      back tension while two-way carries the real network stress.
    next_action: "stabilize the explicit subcycling + calibrate the explicit-path gains (F5)"
    next_action_type: refine_representation
    provenance:
      run_ids: [e4-explicit-coupling-controls]
  - id: F5-explicit-path-numerically-delicate
    kind: computational
    status: partial
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      The explicit path does NOT inherit two reduced-path behaviors. (1) Subcycle convergence
      FAILS/inverts: bm_sigma over bm_substeps {1,2,4,8} = -11.4/-14.5/+28.6/+1828, the
      successive-refinement error GROWS (3.1 -> 43.1 -> 1799.6) -- more subcycling destabilizes
      the explicit BM rather than converging it. (2) The "uncoupled bm_sigma==0" inert control
      does not transfer: the explicit collagen patch carries intrinsic bond-virial stress
      (uncoupled bm_sigma +1.6 at 40 rods). The explicit loop is stable only at coarse subcycling
      (substeps 1-2) and a bounded network (~40 rods)/duration; 120 rods/24 steps diverges
      (bm_sigma ~4.5e4). A stable explicit-BM subcycling integrator + explicit-path gain
      calibration are the open items.
    evidence:
      from_run: e4-explicit-bm-subcycling-sweep
      from_test: explicit-subcycling-converges
      observed: "explicit subcycle sweep DIVERGES (1799.6 >> 3.1); uncoupled bm_sigma +1.6 != 0; 120 rods blows up"
    explanation: >
      The explicit collagen BM is a stochastic LAMMPS relaxation with its own intrinsic stress and
      dynamics, not a smooth first-order ODE like the reduced BM, so re-running it more finely per
      coupling step amplifies rather than refines, and its undriven state is not stress-free.
    next_action: "design a stable explicit-BM subcycling scheme (or an implicit exchange) and recalibrate strain_gain/tension_gain for the explicit stress scale; route a denser multiseed sweep to the mini once stable"
    next_action_type: escalate_model
    provenance:
      run_ids: [e4-explicit-bm-subcycling-sweep, e4-explicit-coupling-controls]

