discovery_implications:
  alternate_hypotheses:
    - hypothesis: >
        The non-zero two-way basal tension is a numerical artifact or a bias present in every
        coupling mode, not a genuine fed-back membrane reaction.
      status: excluded
      discriminated_by: >
        The one-way control produces a basal tension of exactly 0.0 and the uncoupled control
        a bm_sigma of exactly 0.0 under identical parameters; the non-zero tension appears only
        when the reaction half (tension_gain) is wired, so it is the coupling, not an artifact.
  resolved_uncertainties:
    - "The epithelium<->BM coupling is a well-posed bidirectional contract on the reduced-order BM: the reaction half is live only under two-way coupling."
    - "The one-way and uncoupled controls cleanly isolate the reaction half from the forward half and from the null."
    - "The reduced-order BM subcycling converges under refinement."
  remaining_uncertainties:
    - "The explicit LAMMPS collagen-network realization of the same contract -- reduced-order effective BM only here."
    - "Convergence of the full epithelium<->BM exchange interval -- only the reduced-order BM substep is converged."
    - "The spatial E4 feedback predictions (turnover/heterogeneity/confinement/adhesion/failure) -- framed but not yet simulated."
  followup_study_proposals:
    - {id: fp-e4-explicit-lammps-bm, title: "Explicit LAMMPS collagen-network realization"}
    - {id: fp-e4-full-exchange-interval-convergence, title: "Full exchange-interval convergence"}

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: >
      The coupled_lumenoid composite is registered and the bidirectional coupling runs cleanly on
      BOTH the reduced-order BM and (now) the explicit LAMMPS collagen BM; the reduced-path
      behavior-test contracts in tests/test_p3_coupling_controls.py pass deterministically, and
      the explicit path runs bounded in its stable regime (40 rods).
  biological_validation:
    result: MIXED
    basis: >
      Reduced-order path: PASS -- the three coupling controls behave correctly and the BM
      subcycling converges. Explicit-LAMMPS-BM path: the real bidirectional loop runs with correct
      feedback DIRECTIONALITY (two-way basal_tension != 0, one-way == 0), closing E4's main gap,
      BUT two reduced-path behaviors do not transfer -- the explicit collagen carries intrinsic
      stress (uncoupled bm_sigma != 0) and its subcycling DIVERGES (stable only at coarse
      subcycling / ~40 rods). The explicit demonstration is therefore scoped to the bounded stable
      regime; stability + gain calibration are open.
  explanatory_gain:
    result: POSITIVE
    basis: >
      Establishes the epithelium<->BM coupling as a control-separable bidirectional contract and
      now puts the REAL explicit LAMMPS collagen BM in the loop -- and, importantly, shows the
      explicit path is numerically delicate in ways the reduced path hides (intrinsic BM stress;
      divergent subcycling), pinpointing a stable explicit-BM integrator + gain calibration as the
      concrete next step rather than assuming the reduced-path result carries over.

