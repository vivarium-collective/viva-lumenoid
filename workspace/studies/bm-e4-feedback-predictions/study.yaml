      status: excluded
      discriminated_by: >
        The one-way control produces a basal tension of exactly 0.0 and the uncoupled control
        a bm_sigma of exactly 0.0 under identical parameters; the non-zero tension appears only
        when the reaction half (tension_gain) is wired, so it is the coupling, not an artifact.
