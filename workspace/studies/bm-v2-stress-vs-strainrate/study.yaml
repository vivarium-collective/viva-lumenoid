        The earlier single-seed E(ε̇)/τ(ε̇) coupling table. Demoted: these are
        stress-derived quantities presented from a single seed [12345] and are not
        independently validated; they belong AFTER the primary rheology summary, not
        as a headline deliverable. Supplement.
  - name: stage2-diagnostic
    address: "html:stage2_diagnostic.html"
    config:
      title: "Stage 2 — σ(ε̇) diagnostic"
      evidence_status: engineered-diagnostic
      tier: supplement
      caption: >
        Near-duplicate σ(ε̇) diagnostic; a smoke/diagnostic view, not an independent
