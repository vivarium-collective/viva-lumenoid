schema_version: 4
name: bm-v4-junction-bending
title: "Native junction-bending modulus"
created: "2026-09-30"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted

claim: >
  Junction bending is a released feature (NC1 angle k=4.0 @180°, plus 7S angles),
  not a new ingredient. HOW it is applied decides whether it yields a usable
  modulus. Our original as-formed `fix restrain` (pinned on AFTER assembly) is
  ill-conditioned — sign-flipping, no reproducible value. The FAITHFUL path
  (2026-10-02), creating real harmonic angles as the crosslinks form so the
  network equilibrates with them active (matching the released bond/react
  templates), yields a POSITIVE, well-conditioned, reproducible modulus. So the
  released model is not floppy once the angles are faithfully active; its modulus
  is finite and strongly density-dependent.

experiment: >
  Implement bending via LAMMPS `fix restrain` pinned to each junction's as-formed
  angle (a per-junction rest angle, so no single-rest-angle frustration), with an
  auto-reduced timestep for stability. Measure the athermal modulus by energy
  minimisation (change_box + minimise; deterministic) and sweep the bending
  stiffness bending_k.

result: >
  Three ways of applying the released NC1 bending (k=4.0), 3 seeds each at the
  corrected params: central-force (angles off) E per-seed −0.54/−1.32/−1.14
  (consistent with zero); as-formed `fix restrain` 0.9/−2.53/−0.47 (ill-
  conditioned, sign-flipping); REAL angles created during assembly
  36.7/27.6/37.5 LJ — positive, same sign, reproducible. The angle-during-
  assembly fix resolves the ill-conditioning. The modulus is strongly density-
  dependent (≈79 Pa at 2.9 crosslinks/rod → ≈7 Pa at 1.0/rod). Per-angle deletion
  is now implemented (delete-all + recreate on break), so the stiff network also
  REMODELS in the viscous hold — giving a reproducible remodelling time (τ ≈ 40 τ,
  bm-v1) alongside the modulus. Assembly stays make-only because make+break at
  this scale is too sparse to percolate (≈0.18/rod); matching the released dense
  make+break balance needs the authors' dense initial config + GCE.

seeded_from:
  study: bm-v3-junction-bending-rigidity
  proposal_id: fp1-junction-bending
  finding: F1-connectivity-cannot-rigidify

# Canonical DAG edge (supersedes the legacy parent_studies shim).
pipeline_gate:
  prerequisites:
    - study: bm-v3-junction-bending-rigidity
      condition: tests-passed
  enables: []
  proceed_condition: >
    Once a reproducible bending modulus exists, the absolute-Pa value (energy
    scale #4) + make+break density match unblock the vertex-model coupling.

question: Does junction bending yield the measurable modulus the vertex model needs?

purpose:
  question: Does junction bending yield the measurable modulus the vertex model needs?
  mechanism: >
    Bending constraints at crosslink junctions lift a sub-isostatic (z < 4)
    central-force network out of the floppy regime — the physically-expected
    rigidity source for a semiflexible fiber network.
  expected_outcome: >
    A finite, positive modulus that rises with bending stiffness. Observed: a
    large response, but not a reproducible modulus at v1 size.

key_assumptions:
  - "Bending = harmonic angle restraint pinned to each junction's as-formed angle (fix restrain)."
  - "Stiff restraints need a reduced timestep (dt ≈ 0.002; the spec's own regime)."
  - "Athermal (T=0) energy minimisation gives the deterministic elastic modulus."

baseline:
  - name: junction-bending-network
    composite: viva_lumenoid.composites.bending_sweep
    params:
      n_rods: 200
      box_xy: 20.0
      bending_k: 4.0
      timestep: 0.002
      seed: 12345

variants:
  - name: bending-k-sweep
    description: Sweep junction bending stiffness bending_k = 0, 40, 80.
    params: {}

# v4 grouped Build-tab inputs (mirrors baseline + variants above).
conditions:
  baseline:
    composite: viva_lumenoid.composites.bending_sweep
    params:
      n_rods: 200
      box_xy: 20.0
      bending_k: 4.0
      timestep: 0.002
      seed: 12345
  variants:
    - name: bending-k-sweep
      description: Sweep junction bending stiffness bending_k = 0, 40, 80.
  model_settings:
    - name: bending_k
      default: 0.0
      current: 4.0
      range: [0.0, 80.0]
      units: kT/rad^2
      cites: [barrientos2026code]
      notes: >
        Released NC1 junction angle stiffness (angle_coeff 1 = 4.0 @180°). The
        released model sets this by construction; our v1 transcription omitted it.
    - name: use_real_angles
      default: false
      current: true
      range: [false, true]
      units: bool
      cites: [barrientos2026code]
      notes: >
        Create real harmonic angles as crosslinks form (matching the released
        bond/react templates) rather than pinning restraints after assembly.

simulation_set:
  - name: bending-athermal-sweep
    status: completed
    base_model: viva_lumenoid.composites.bending_sweep
    seeds: [11, 22, 33, 44, 55]
    metrics:
      floppy_modulus: "≈0 (reproducible)"
      bending_response: "positive, well-conditioned with real angles during assembly (36.7/27.6/37.5 LJ)"
      reproducible: true
    pass_fail_tests:
      - "floppy-baseline-clean: pass"
      - "bending-changes-mechanics: pass"
      - "reproducible-modulus: pass (real angles during assembly — see faithful_angles figure)"

# Canonical run record — feeds the dashboard's Ran · Tests · Verdict strip
# (outcomes is a dict keyed by behavior_test name, UPPERCASE result).
runs:
  - name: bending-athermal-sweep
    base_model: viva_lumenoid.composites.bending_sweep
    seeds: [11, 22, 33, 44, 55]
    status: completed
    outcomes:
      floppy-baseline-clean:
        result: PASS
        observed: "k=0 athermal modulus ≈ 0 (deterministic)"
      bending-changes-mechanics:
        result: PASS
        observed: "|E| jumps orders of magnitude above the floppy baseline"
      reproducible-modulus:
        result: PASS
        observed: "real angles during assembly: per-seed 36.7/27.6/37.5 LJ (same sign, tight IQR)"

readouts:
  - name: modulus_vs_bending_k
    description: Athermal elastic modulus (median + per-seed) vs bending stiffness.
    store_path: "network/sigma_inplane"
    units: kT/a^3
    status: measured
  - name: reproducible
    description: Whether the modulus is reproducible (IQR small vs |median|) at each rung.
    store_path: "network/sigma_inplane"
    units: bool
    status: measured

behavior_tests:
  - name: floppy-baseline-clean
    classification: primary
    description: Athermal minimisation measures the floppy (k=0) modulus as ~0 (deterministic).
    measure: {kind: value, field: modulus_vs_bending_k, at: "bending_k=0"}
    pass_if: {op: near_zero, tol: 0.1}
    units: kT/a^3
    requires_simulation: "true"
  - name: bending-changes-mechanics
    classification: primary
    description: Bending produces a large mechanical response (|E| >> floppy).
    measure: {kind: magnitude, field: modulus_vs_bending_k, at: "bending_k>0"}
    pass_if: {op: gt, value: 1.0, note: "|E| jumps orders of magnitude above floppy"}
    units: kT/a^3
    requires_simulation: "true"
  - name: reproducible-modulus
    classification: primary
    description: >
      The bending modulus is reproducible across seeds (a usable value). PASSES
      with real angles created during assembly (use_real_angles): per-seed
      36.7/27.6/37.5 LJ (same sign, tight), vs the as-formed restraint's
      sign-flipping. The absolute value depends on crosslink density (calibrated
      to the authors' dataNucType9_dense, bm-v1) and the energy-scale decision.
    measure: {kind: iqr_over_median, field: modulus_vs_bending_k, at: "bending_k>0"}
    pass_if: {op: lt, value: 0.5, note: "IQR < 0.5·|median| — met by the real-angle path"}
    units: dimensionless
    requires_simulation: "true"

findings:
  - id: F1-bending-implemented
    kind: methodological
    status: novel
    statement: >
      Junction bending is implemented as `fix restrain` pinned to each junction's
      as-formed angle (per-junction rest angle avoids the single-rest-angle
      frustration), with an auto-reduced timestep and an athermal energy-minimised
      modulus readout.
    evidence:
      from_run: bending-athermal-sweep
      from_test: floppy-baseline-clean
      observed: "floppy modulus measured as E ≈ 0 (deterministic) via minimisation"
    next_action: "adopted in viva_lumenoid/collagen.py + bending.py"
    next_action_type: refine_representation
    provenance:
      run_ids: [bending-athermal-sweep]
  - id: F2-asformed-restraint-illconditioned
    kind: computational
    status: partial
    statement: >
      The AS-FORMED restraint path — bending pinned via `fix restrain` AFTER
      assembly — is ill-conditioned at v1 size: |E| jumps to tens–hundreds but
      scatters and sign-flips across seeds (k=80 per-seed −570…+54, median −210),
      so it yields no calibratable value. SUPERSEDED by F3: the ill-conditioning
      was an artifact of applying bending after assembly, not an intrinsic limit.
    evidence:
      from_run: bending-athermal-sweep
      from_test: bending-changes-mechanics
      observed: "as-formed restraint: k=80 per-seed −570…+54 (median −210); reproducible=false"
    explanation: >
      The stiff, pre-stressed, disordered small network has many near-degenerate
      energy minima; the equibiaxial-stress modulus is dominated by pre-stress and
      finite-size buckling rather than the intrinsic shear modulus. Creating the
      angles DURING assembly (F3) lets the network equilibrate compatible with
      them and removes this pathology.
    next_action: "superseded — see F3 (real angles during assembly)"
    next_action_type: refine_representation
    obsoleted_by: F3-faithful-angles-reproducible
    provenance:
      run_ids: [bending-athermal-sweep]
  - id: F3-faithful-angles-reproducible
    kind: computational
    status: confirms
    statement: >
      Creating real harmonic angles as the crosslinks form (use_real_angles,
      matching the released bond/react templates) yields a POSITIVE, well-
      conditioned, reproducible modulus — per-seed 36.7/27.6/37.5 LJ (same sign,
      tight IQR). So the released model is not floppy once its angles are
      faithfully active; the modulus is finite and strongly density-dependent
      (≈79 Pa at 2.9 crosslinks/rod → ≈7 Pa at 1.0/rod).
    evidence:
      from_run: bending-athermal-sweep
      from_test: reproducible-modulus
      observed: "real angles during assembly: per-seed 36.7/27.6/37.5 LJ; reproducible=true"
    explanation: >
      Equilibrating the network WITH the angles active (rather than pinning them
      on afterwards) removes the pre-stress / near-degenerate-minima pathology of
      F2. The remaining gap for an absolute Pa value is matching the released
      make+break crosslink density (the make-only real-angle path over-crosslinks),
      which needs per-angle deletion or the GCE, plus the energy-scale decision (#4).
    next_action: "match the released dense make+break crosslink density (GCE) for an absolute modulus"
    next_action_type: calibrate
    provenance:
      run_ids: [bending-athermal-sweep]

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "Bending implemented; floppy baseline clean; reproducible modulus via angles-during-assembly."
    biological_validation: "Bending confirmed as the mechanics-governing constraint; the released model is not floppy once its angles are faithfully active."
    pipeline_unblocks:
      - "An absolute-Pa modulus, once the released make+break crosslink density (GCE) and the energy scale (#4) are matched."
  if_primary_tests_fail:
    diagnose:
      - "Modulus ill-conditioned — enlarge the network and remove pre-stress before measuring."
    block_downstream: "No calibratable BM modulus for the vertex-model coupling until this is resolved."

followup_proposals:
  - id: fp3-absolute-modulus-via-density-match
    title: "Absolute bending modulus by matching the released make+break crosslink density (GCE)"
    motivation: >
      With real angles during assembly the modulus is already reproducible and
      positive (F3). The remaining gap to an ABSOLUTE value is that the make-only
      real-angle path over-crosslinks; matching the authors' dense make+break
      equilibrium fraction needs per-angle deletion or the custom GCE. A 1000+-rod
      network additionally self-averages junction disorder as a robustness check.
    hypothesized_mechanism: "Released-density make+break equilibrium + GCE → a calibratable, density-correct modulus."
    status: proposed

discovery_implications:
  resolved_uncertainties:
    - "Bending, not crosslink connectivity, governs this network's stiffness (confirmed qualitatively)."
    - "The athermal minimisation measures the floppy modulus deterministically (removes the dynamic-measurement noise)."
    - "A reproducible, positive bending modulus IS obtained with real angles created during assembly (36.7/27.6/37.5 LJ) — the as-formed-restraint ill-conditioning was an artifact, not an intrinsic limit."
  remaining_uncertainties:
    - "The ABSOLUTE (Pa) modulus — blocked on matching the released make+break crosslink density (GCE) and the energy-scale decision (#4)."
  followup_study_proposals:
    - {id: fp3-absolute-modulus-via-density-match, title: "Absolute bending modulus by matching the released make+break density (GCE)"}

