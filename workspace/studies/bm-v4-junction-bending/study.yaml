schema_version: 4
name: bm-v4-junction-bending
created: "2026-09-30"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: needs_calibration
design_status: drafted

claim: >
  Junction bending is a released feature (NC1 angle k=4.0 @180°, plus 7S angles),
  not a new ingredient. HOW it is applied decides whether it yields a usable
  modulus. Our original as-formed `fix restrain` (pinned on AFTER assembly) is
  ill-conditioned — sign-flipping, no reproducible value. The FAITHFUL path
  (2026-10-02), creating real harmonic angles as the crosslinks form so the
  network equilibrates with them active (matching the released bond/react
  templates), yields a POSITIVE, well-conditioned, reproducible modulus. So the
  released model is not floppy once the angles are faithfully active; its modulus
  is finite and strongly density-dependent.

experiment: >
  Implement bending via LAMMPS `fix restrain` pinned to each junction's as-formed
  angle (a per-junction rest angle, so no single-rest-angle frustration), with an
  auto-reduced timestep for stability. Measure the athermal modulus by energy
  minimisation (change_box + minimise; deterministic) and sweep the bending
  stiffness bending_k.

result: >
  Three ways of applying the released NC1 bending (k=4.0), 3 seeds each at the
  corrected params: central-force (angles off) E per-seed −0.54/−1.32/−1.14
  (consistent with zero); as-formed `fix restrain` 0.9/−2.53/−0.47 (ill-
  conditioned, sign-flipping); REAL angles created during assembly
  36.7/27.6/37.5 LJ — positive, same sign, reproducible. The angle-during-
  assembly fix resolves the ill-conditioning. The modulus is strongly density-
  dependent (≈79 Pa at 2.9 crosslinks/rod → ≈7 Pa at 1.0/rod). Per-angle deletion
  is now implemented (delete-all + recreate on break), so the stiff network also
  REMODELS in the viscous hold — giving a reproducible remodelling time (τ ≈ 40 τ,
  bm-v1) alongside the modulus. Assembly stays make-only because make+break at
  this scale is too sparse to percolate (≈0.18/rod); matching the released dense
  make+break balance needs the authors' dense initial config + GCE.

seeded_from:
  study: bm-v3-junction-bending-rigidity
  proposal_id: fp1-junction-bending
  finding: F1-connectivity-cannot-rigidify

parent_studies:
  - bm-v3-junction-bending-rigidity

purpose:
  question: Does junction bending yield the measurable modulus the vertex model needs?
  mechanism: >
    Bending constraints at crosslink junctions lift a sub-isostatic (z < 4)
    central-force network out of the floppy regime — the physically-expected
    rigidity source for a semiflexible fiber network.
  expected_outcome: >
    A finite, positive modulus that rises with bending stiffness. Observed: a
    large response, but not a reproducible modulus at v1 size.

key_assumptions:
  - "Bending = harmonic angle restraint pinned to each junction's as-formed angle (fix restrain)."
  - "Stiff restraints need a reduced timestep (dt ≈ 0.002; the spec's own regime)."
  - "Athermal (T=0) energy minimisation gives the deterministic elastic modulus."

baseline:
  - name: junction-bending-network
    composite: viva_lumenoid.composites.bending_sweep
    params:
      n_rods: 200
      box_xy: 20.0
      bending_k: 4.0
      timestep: 0.002
      seed: 12345

variants:
  - name: bending-k-sweep
    description: Sweep junction bending stiffness bending_k = 0, 40, 80.
    params: {}

simulation_set:
  - name: bending-athermal-sweep
    status: completed
    base_model: viva_lumenoid.composites.bending_sweep
    seeds: [11, 22, 33, 44, 55]
    metrics:
      floppy_modulus: "≈0 (reproducible)"
      bending_response: "|E| tens–hundreds, sign-flipping (ill-conditioned)"
      reproducible: false
    pass_fail_tests:
      - "floppy-baseline-clean: pass"
      - "bending-changes-mechanics: pass"
      - "reproducible-modulus: fail (needs larger network / pre-stress-free measurement)"

readouts:
  - name: modulus_vs_bending_k
    description: Athermal elastic modulus (median + per-seed) vs bending stiffness.
    store_path: "network/sigma_inplane"
    units: kT/a^3
    status: measured
  - name: reproducible
    description: Whether the modulus is reproducible (IQR small vs |median|) at each rung.
    store_path: "network/sigma_inplane"
    units: bool
    status: measured

behavior_tests:
  - name: floppy-baseline-clean
    classification: primary
    description: Athermal minimisation measures the floppy (k=0) modulus as ~0 (deterministic).
    measure: {kind: value, field: modulus_vs_bending_k, at: "bending_k=0"}
    pass_if: {op: near_zero, tol: 0.1}
    units: kT/a^3
    requires_simulation: "true"
  - name: bending-changes-mechanics
    classification: primary
    description: Bending produces a large mechanical response (|E| >> floppy).
    measure: {kind: magnitude, field: modulus_vs_bending_k, at: "bending_k>0"}
    pass_if: {op: gt, value: 1.0, note: "|E| jumps orders of magnitude above floppy"}
    units: kT/a^3
    requires_simulation: "true"
  - name: reproducible-modulus
    classification: primary
    description: The bending modulus is reproducible across seeds (a usable value).
    measure: {kind: iqr_over_median, field: modulus_vs_bending_k, at: "bending_k>0"}
    pass_if: {op: lt, value: 0.5, note: "IQR < 0.5·|median|"}
    units: dimensionless
    requires_simulation: "true"
    blocked_by_requirements: ["larger network (self-averaging) + pre-stress-free reference state"]

findings:
  - id: F1-bending-implemented
    kind: methodological
    status: novel
    statement: >
      Junction bending is implemented as `fix restrain` pinned to each junction's
      as-formed angle (per-junction rest angle avoids the single-rest-angle
      frustration), with an auto-reduced timestep and an athermal energy-minimised
      modulus readout.
    evidence:
      observed: "floppy modulus measured as E ≈ 0 (deterministic) via minimisation"
    next_action: "adopted in viva_lumenoid/collagen.py + bending.py"
    provenance:
      run_ids: [bending-athermal-sweep]
  - id: F2-bending-dominates-but-illconditioned
    kind: computational
    status: partial
    statement: >
      Bending dominates the mechanics (|E| jumps to tens–hundreds, network no
      longer floppy) but the modulus is ill-conditioned at v1 size — it scatters
      and sign-flips across seeds (pathological near-degenerate minima), so it is
      not yet a calibratable value.
    evidence:
      observed: "k=0 E≈0; k=80 per-seed −570…+54 (median −210); reproducible=false"
    explanation: >
      The stiff, pre-stressed, disordered small network has many near-degenerate
      energy minima; the equibiaxial-stress modulus is dominated by pre-stress and
      finite-size buckling rather than the intrinsic shear modulus.
    next_action: "seed v2: larger network (self-averaging) + pre-stress-free reference"
    provenance:
      run_ids: [bending-athermal-sweep]

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "Bending implemented; floppy baseline clean."
    biological_validation: "Bending confirmed as the mechanics-governing constraint."
    pipeline_unblocks:
      - "A v2 rigid-modulus measurement (larger network + pre-stress-free reference)."
  if_primary_tests_fail:
    diagnose:
      - "Modulus ill-conditioned — enlarge the network and remove pre-stress before measuring."
    block_downstream: "No calibratable BM modulus for the vertex-model coupling until this is resolved."

followup_proposals:
  - id: fp3-largescale-prestressfree-modulus
    title: "Reproducible bending modulus at scale (larger network + pre-stress-free reference)"
    motivation: >
      The bending modulus is ill-conditioned at 200 rods. A 1000+-rod network
      self-averages the junction disorder, and minimising to a pre-stress-free
      reference before straining removes the pre-stress artefact — together they
      should yield a reproducible, positive modulus vs bending_k.
    hypothesized_mechanism: "Self-averaging + a relaxed reference → a well-conditioned shear modulus."
    status: proposed

discovery_implications:
  resolved_uncertainties:
    - "Bending, not crosslink connectivity, governs this network's stiffness (confirmed qualitatively)."
    - "The athermal minimisation measures the floppy modulus deterministically (removes the dynamic-measurement noise)."
  remaining_uncertainties:
    - "A reproducible, calibratable bending modulus — blocked on network size + pre-stress-free measurement."
  followup_study_proposals:
    - {id: fp3-largescale-prestressfree-modulus, title: "Reproducible bending modulus at scale"}

visualizations:
  - name: faithful-angles
    address: "html:faithful_angles.html"
    config:
      title: "Faithful angles — the modulus becomes reproducible (headline)"
  - name: bending-movie
    address: "html:bending_movie.html"
    config:
      title: "Simulation movie — rods pinned at crosslink angles"
  - name: bending-movie-3d
    address: "html:bending_movie_3d.html"
    config:
      title: "3D view — the bending-pinned network, rotatable"
  - name: bending-diagnostic
    address: "html:bending_diagnostic.html"
    config:
      title: "FP1 — junction bending response"

limitations:
  - "Cross-check (2026-10-01): junction bending is NOT a new ingredient — the released code already sets KangNC1=4.0 (@180°) plus two 7S angles. Re-scope as 'match the released angle set', not 'add bending'. See references/cross-check-vs-released-code.md."
  - "Clean-room parameters transcribed from the spec; the authors' LAMMPS input scripts are now public (Zenodo 10.5281/zenodo.20719515) and not yet cross-checked against this build."
  - "The bending modulus is ill-conditioned at 200 rods (pre-stress + finite-size); not calibratable yet."
  - "Bending targets are pinned from a thermally-noisy as-formed geometry (a pre-stress source)."
  - "Only equibiaxial stress-strain slope is used; a shear or energy-curvature modulus may be better conditioned."

report:
  title: "Stage v4 — junction bending: the angle-during-assembly fix"
  verdict: >
    Applying the released NC1 bending (k=4.0) via real harmonic angles created as
    the crosslinks form — matching how the released bond/react templates add
    angles during assembly — resolves the ill-conditioning: the modulus is
    positive, reproducible across seeds (36.7/27.6/37.5 LJ) and well-conditioned,
    where the as-formed restraint sign-flipped. So the released model is not floppy
    once its angles are faithfully active; the modulus is finite and strongly
    density-dependent. The remaining gap for an absolute value is matching the
    make+break crosslink density (the real-angle path runs make-only and
    over-crosslinks), which needs per-angle deletion or the GCE.
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    With the junction angles active during assembly — the way the released model
    builds them — the network has a reproducible, well-conditioned, finite modulus.
    The earlier ill-conditioned/soft readings were artifacts of applying bending
    after assembly (as-formed restraints) and of the angle-off runs. The absolute
    value now hinges on crosslink density, which the make-only real-angle path
    over-shoots; matching the released make+break density is the remaining step.

bibliography:
  sources:
