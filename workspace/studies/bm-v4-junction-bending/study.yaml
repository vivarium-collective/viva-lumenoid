limitations:
  - "Cross-check (2026-10-01): junction bending is NOT a new ingredient — the released code already sets KangNC1=4.0 (@180°) plus two 7S angles. Re-scope as 'match the released angle set', not 'add bending'. See references/cross-check-vs-released-code.md."
  - "Clean-room parameters transcribed from the spec; the authors' LAMMPS input scripts are now public (Zenodo 10.5281/zenodo.20719515) and not yet cross-checked against this build."
  - "The bending modulus is ill-conditioned at 200 rods (pre-stress + finite-size); not calibratable yet."
  - "Bending targets are pinned from a thermally-noisy as-formed geometry (a pre-stress source)."
  - "Only equibiaxial stress-strain slope is used; a shear or energy-curvature modulus may be better conditioned."

report:
  title: "Stage v4 — junction bending: the angle-during-assembly fix"
  verdict: >
    Applying the released NC1 bending (k=4.0) via real harmonic angles created as
    the crosslinks form — matching how the released bond/react templates add
    angles during assembly — resolves the ill-conditioning: the modulus is
    positive, reproducible across seeds (36.7/27.6/37.5 LJ) and well-conditioned,
    where the as-formed restraint sign-flipped. So the released model is not floppy
    once its angles are faithfully active; the modulus is finite and strongly
    density-dependent. The remaining gap for an absolute value is matching the
    make+break crosslink density (the real-angle path runs make-only and
    over-crosslinks), which needs per-angle deletion or the GCE.
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    With the junction angles active during assembly — the way the released model
    builds them — the network has a reproducible, well-conditioned, finite modulus.
    The earlier ill-conditioned/soft readings were artifacts of applying bending
    after assembly (as-formed restraints) and of the angle-off runs. The absolute
    value now hinges on crosslink density, which the make-only real-angle path
    over-shoots; matching the released make+break density is the remaining step.

expert_review_status: requested
expert_questions:
  - "Exact turnover (cross-check gap): to reproduce the authors' equilibrium crosslink fraction and remodelling kinetics, do we need their custom-patched GCE (Nucleation/Death with the density penalty) + distance-gated bond/react breaking, or is matching the free-monomer concentration / a force-independent off-rate sufficient for the modulus and \u03c4 the vertex model needs?"
  - "Engine for stage 3 (spec decision #2): stages 1\u20132 run on LAMMPS. Should stage 3 (surface-attached linkers / flexible fibers) stay on LAMMPS or move to Smoldyn, and when do the Smoldyn surface binders land?"

