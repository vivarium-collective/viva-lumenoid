  - {study: bm-r2-collagen-network-rheology, relation: supports, condition: tests-passed}

cites: [barrientos2026cellshape]

expected_behavior:
  - name: force-transfer-conserves-work
    observable: traction / linker occupancy / network deformation / work balance
    condition: single-cell patch, prescribed-displacement + imposed-traction tests
    rationale: >
      Work consistency and force balance across the cortex->adhesion->BM chain must hold before
      multicellular coupling (P3/P4).

