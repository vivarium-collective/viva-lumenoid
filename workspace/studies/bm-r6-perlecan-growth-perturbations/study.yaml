schema_version: 4
name: bm-r6-perlecan-growth-perturbations
title: "Perlecan & growth perturbations on cell shape"
created: "2026-09-30"
status: in-progress
phase: Decide
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted
confidence: Accepted

claim: >
  Carrying an inferred collagen lifetime through BM relaxation to cell shape reproduces the
  paper's intervention ordering: perlecan gain gives taller cells than control, and loss gives
  flatter ones, with the inferred relaxation time (turnover) kept distinct from the predicted
  cell height (mechanics).

experiment: >
  Run the TurnoverShapeProcess pipeline for four conditions -- control, perlecan gain, perlecan
  loss, and fast growth. The inferred collagen IV lifetime (modulated by a perlecan factor) sets
  the BM relaxation time (inferred_relaxation = collagen_lifetime x perlecan_factor); that
  relaxation drives the reduced-order prism mechanics (R1) to a predicted cell height. Read
  inferred_relaxation (the turnover/inference quantity) and cell_height / confinement (the
  independent mechanical prediction) at the end of each 40-step run (dt 0.2), and check the
  rank-order against Barrientos Figure 7.

result: >
  The intervention ordering reproduces exactly. Predicted cell height is tallest under perlecan
  gain (0.4386), then control (0.4287), then perlecan loss (0.4043) -- a strict gain > control >
  loss ordering, matching Figure 7. The inferred relaxation time scales exactly linearly with the
  perlecan factor (inferred_relaxation = 5.0 x perlecan_factor: 1.5 at loss, 5.0 at control, 10.0
  at gain, 15.0 at a factor of 3), and is reported as a separate output from the predicted height,
  so the inferred (turnover) and predicted (mechanics) quantities stay distinct as the plan
  requires. The fast-growth condition (shorter doubling time) collapses the cell to height 0.134 --
  faster proliferation spreads the cell far more strongly than perlecan changes it. The
  perlecan-driven height differences are small in magnitude (~2-3% gain-vs-control at these
  parameters) while strictly ordered; the growth-rate axis dominates cell shape.

# Canonical DAG edge -- R6 closes the reproduction campaign (Fig 7) on the R1 mechanics endpoint.
pipeline_gate:
  prerequisites:
    - bm-r1-published-tissue-baseline
  proceed_condition: >
    A reproduced intervention ordering (perlecan gain > control > loss) with the inferred
    relaxation kept distinct from the predicted shape closes the P1-era reproduction and feeds
    the predictive-feedback study (E4).

question: >
  Does the inferred chain lifetime -> relaxation -> shape reproduce the paper's perlecan and
  growth-rate intervention ordering?

purpose:
  question: >
    Does the inferred chain (collagen lifetime -> BM relaxation -> cell shape) reproduce the
    paper's perlecan and growth-rate intervention ordering, keeping inferred and predicted
    quantities distinct?
  mechanism: >
    Perlecan stabilizes collagen IV, lengthening its inferred molecular lifetime; a longer
    lifetime is a slower BM relaxation time, which the reduced-order prism mechanics (R1) turns
    into a taller (more confined) cell. The turnover-inferred relaxation and the mechanics-predicted
    shape are two distinct outputs of the pipeline.
  expected_outcome: >
    A strict cell-height ordering perlecan gain > control > loss (Fig 7), with inferred_relaxation
    scaling with the perlecan factor and reported separately from the predicted height.

hypothesis: >
  Propagating inferred collagen lifetime distributions for control, perlecan gain/loss and
  growth-rate changes through the relaxation->shape chain reproduces the relative cell-
  morphology ordering and uncertainty of Figure 7, keeping inferred and independently
  predicted outcomes distinct.

objective: >
  Use inferred collagen lifetime distributions for control, perlecan gain/loss and growth-rate
  conditions; propagate parameter uncertainty through relaxation and shape; compare relative
  cell morphology and uncertainty to Fig 7 while keeping inferred vs predicted outcomes
  distinct.

description: |
  Closes the reproduction campaign by propagating the turnover-inference results (Fig 3-6)
  into predicted shapes (Fig 7). Collagen lifetime distributions for control, perlecan
  gain/loss and growth-rate perturbations drive the relaxation->shape chain with explicit
  uncertainty propagation. The study must keep quantities that are INFERRED from the timer
  observation model distinct from quantities INDEPENDENTLY PREDICTED by the mechanical model,
  per the plan's validation distinction.

key_assumptions:
  - "Perlecan modulates the collagen IV lifetime multiplicatively (perlecan_factor); >1 stabilizes (longer lifetime), <1 destabilizes."
  - "The inferred collagen lifetime, times the perlecan factor, IS the BM relaxation time (turnover -> relaxation)."
  - "The predicted cell shape is the R1 reduced-order prism mechanics run with that relaxation (perlecan does not act on the mechanics except through the relaxation time)."
  - "inferred_relaxation (turnover/inference) and cell_height (mechanics prediction) are kept as distinct outputs; the inferred quantity is not re-derived from the predicted one."
  - "Reduced units; relative morphology ordering is the claim, not absolute cell height. Uncertainty bands over the inferred lifetime distribution are a documented follow-up (point estimates recorded here)."

parent_studies:
  - {study: bm-r1-published-tissue-baseline, condition: tests-passed}
  - {study: bm-r5-explicit-3d-confinement, condition: tests-passed}
  - {study: bm-r3-network-expansion-supply, condition: tests-passed}

cites: [barrientos2026cellshape]

baseline:
  - name: bm-r6-perlecan-growth-perturbations
    composite: viva_lumenoid.composites.turnover_shape_pipeline
    params:
      collagen_lifetime: 5.0
      perlecan_factor: 1.0
      doubling_time: 5.0
    note: >
      The chain from turnover to shape. An inferred collagen IV lifetime, adjusted
      for perlecan, sets the basement-membrane relaxation time, which the
      homogeneous tissue model turns into a predicted cell shape. Perlecan that
      stabilizes collagen lengthens the lifetime and confines the cells, so the
      model reproduces the paper's ordering of the perlecan and growth-rate
      interventions: perlecan gain gives the tallest cells, then the control, then
      perlecan loss. Quantities inferred from the turnover data are kept separate
      from the shapes the mechanics predicts.

variants:
  - name: perlecan-gain
    description: "Perlecan gain (factor 2.0): stabilized collagen -> longer lifetime -> slower BM relaxation -> taller cell."
    params: {perlecan_factor: 2.0}
  - name: perlecan-loss
    description: "Perlecan loss (factor 0.3): destabilized collagen -> shorter lifetime -> faster BM relaxation -> flatter cell."
    params: {perlecan_factor: 0.3}
  - name: fast-growth
    description: "Fast growth (doubling_time 2.5): faster proliferation spreads the cell regardless of perlecan."
    params: {doubling_time: 2.5}

conditions:
  baseline:
    composite: viva_lumenoid.composites.turnover_shape_pipeline
    params: {collagen_lifetime: 5.0, perlecan_factor: 1.0, doubling_time: 5.0}
  variants:
    - name: perlecan-gain
      description: "Perlecan gain -> taller."
    - name: perlecan-loss
      description: "Perlecan loss -> flatter."
    - name: fast-growth
      description: "Faster growth -> flatter."
  model_settings:
    - name: perlecan_factor
      default: 1.0
      current: 1.0
      range: [0.3, 2.0]
      units: multiplier on collagen lifetime
      cites: [barrientos2026cellshape]
      notes: "Perlecan modulation of the inferred collagen IV lifetime; the Fig 7 intervention axis."
    - name: collagen_lifetime
      default: 5.0
      current: 5.0
      range: [1.5, 10.0]
      units: reduced time (inferred)
      cites: [barrientos2026cellshape]
      notes: "Inferred collagen IV molecular lifetime; x perlecan_factor sets the BM relaxation time."
    - name: doubling_time
      default: 5.0
      current: 5.0
      range: [2.5, 5.0]
      units: reduced time
      cites: [barrientos2026cellshape]
      notes: "Growth-rate condition; a shorter doubling time spreads the cell."

robustness:
  parameter_sweep: true
  n_replicates: 4
  note: >
    Deterministic pipeline (no stochasticity, so seeds are not meaningful):
    replication is the 4-condition intervention sweep (control / perlecan gain /
    perlecan loss / fast growth) rather than a seed ensemble.

simulation_set:
  - name: r6-perlecan-growth-conditions
    status: completed
    base_model: viva_lumenoid.composites.turnover_shape_pipeline
    conditions:
      control:       {perlecan_factor: 1.0, doubling_time: 5.0}
      perlecan_gain: {perlecan_factor: 2.0, doubling_time: 5.0}
      perlecan_loss: {perlecan_factor: 0.3, doubling_time: 5.0}
      fast_growth:   {perlecan_factor: 1.0, doubling_time: 2.5}
    fixed: {collagen_lifetime: 5.0, steps: 40, dt: 0.2}
    metrics:
      height_perlecan_gain: 0.4386
      height_control: 0.4287
      height_perlecan_loss: 0.4043
      height_fast_growth: 0.1343
      inferred_relaxation_gain: 10.0
      inferred_relaxation_control: 5.0
      inferred_relaxation_loss: 1.5
      ordering_gain_gt_control_gt_loss: true
      inferred_relaxation_linear_in_perlecan: true
    pass_fail_tests:
      - "perlecan-intervention-ordering: pass"
      - "inferred-relaxation-scales-with-perlecan: pass"
      - "inferred-and-predicted-distinct: pass"
      - "faster-growth-spreads: pass"

# Canonical run record -- feeds the dashboard's Ran . Tests . Verdict strip.
runs:
  - name: r6-perlecan-growth-conditions
    base_model: viva_lumenoid.composites.turnover_shape_pipeline
    status: completed
    outcomes:
      perlecan-intervention-ordering:
        result: PASS
        observed: "cell height 0.4386 (gain) > 0.4287 (control) > 0.4043 (loss) -- strict Fig 7 ordering"
      inferred-relaxation-scales-with-perlecan:
        result: PASS
        observed: "inferred_relaxation = 5.0 x perlecan_factor: 1.5 / 5.0 / 10.0 / 15.0 for factor 0.3 / 1.0 / 2.0 / 3.0"
      inferred-and-predicted-distinct:
        result: PASS
        observed: "inferred_relaxation (turnover) and cell_height (mechanics) emitted as separate outputs; perlecan acts on height only via relaxation"
      faster-growth-spreads:
        result: PASS
        observed: "fast-growth height 0.1343 << control 0.4287 -- growth rate dominates shape"

readouts:
  - name: inferred_relaxation
    description: Inferred BM relaxation time = collagen_lifetime x perlecan_factor; the turnover/inference quantity (NOT the mechanical prediction).
    store_path: "inferred_relaxation"
    units: reduced time (inferred)
    status: measured
  - name: cell_height
    description: Predicted cell height from the R1 reduced-order mechanics run with the inferred relaxation; the mechanical prediction.
    store_path: "cell_height"
    units: reduced (volume/area)
    status: measured
  - name: confinement
    description: Predicted cell height relative to the initial height; the morphology variable compared across conditions.
    store_path: "confinement"
    units: dimensionless
    status: measured
  - name: basal_area
    description: Predicted basal area of the prism cell under each condition.
    store_path: "basal_area"
    units: reduced area
    status: measured

behavior_tests:
  - name: perlecan-intervention-ordering
    classification: primary
    description: >
      Predicted cell height follows the Fig 7 intervention ordering: perlecan gain > control >
      perlecan loss.
    measure: {kind: order, field: cell_height, cases: ["perlecan_gain", "control", "perlecan_loss"]}
    pass_if: {op: strictly_decreasing, note: "height(gain) > height(control) > height(loss)"}
    units: reduced
    requires_simulation: r6-perlecan-growth-conditions
    cites: [barrientos2026cellshape]
    calibration_anchor:
      observed_value: "0.4386 > 0.4287 > 0.4043"
      literature_target: "perlecan gain taller, loss flatter (Fig 7 ordering)"
      resolution: concept
      cites: [barrientos2026cellshape]
  - name: inferred-relaxation-scales-with-perlecan
    classification: primary
    description: >
      The inferred BM relaxation time scales with the perlecan factor (turnover -> relaxation),
      linearly as collagen_lifetime x perlecan_factor.
    measure: {kind: monotonicity, field: inferred_relaxation, versus: perlecan_factor}
    pass_if: {op: increasing, note: "inferred_relaxation = 5.0 x perlecan_factor; strictly increasing in perlecan"}
    units: reduced time
    requires_simulation: r6-perlecan-growth-conditions
  - name: inferred-and-predicted-distinct
    classification: secondary
    description: >
      The inferred (turnover) relaxation and the predicted (mechanics) cell height are distinct
      outputs -- the validation distinction the plan requires.
    measure: {kind: structure, fields: [inferred_relaxation, cell_height]}
    pass_if: {op: both_emitted, note: "both are emitted independently; perlecan drives height only through the relaxation time"}
    units: mixed
    requires_simulation: r6-perlecan-growth-conditions
  - name: faster-growth-spreads
    classification: secondary
    description: >
      A faster growth rate (shorter doubling time) spreads the cell flat, independent of perlecan --
      the growth-rate intervention of Fig 7.
    measure: {kind: compare, field: cell_height, cases: ["fast_growth", "control"]}
    pass_if: {op: lt, note: "height(fast_growth) < height(control)"}
    units: reduced
    requires_simulation: r6-perlecan-growth-conditions

falsifiability: >
  The claim would be overturned if the predicted cell-height ordering were not strictly perlecan
  gain > control > loss (an inverted or collapsed ordering), if inferred_relaxation did not
  increase with the perlecan factor, if the pipeline failed to emit the inferred relaxation and
  the predicted height as distinct outputs, or if a faster growth rate did not spread the cell.
  Any of these would show the turnover->shape chain does not reproduce the Fig 7 intervention
  ordering or violate the inferred-vs-predicted distinction. The deterministic contracts in
  tests/test_turnover_shape.py would fail in that case.

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "The turnover->shape pipeline runs end-to-end and reproduces the Fig 7 ordering."
    biological_validation: "Perlecan gain > control > loss reproduced; inferred relaxation scales with perlecan; inferred vs predicted kept distinct."
    pipeline_unblocks:
      - "E4 predictive-feedback study -- this closes the reproduction campaign it builds on."
  if_primary_tests_fail:
    diagnose:
      - "Ordering inverted -- check the sign of the perlecan modulation (>1 must lengthen the lifetime)."
      - "Inferred and predicted collapsed into one -- the pipeline must emit inferred_relaxation separately from cell_height."
    block_downstream: "Do not advance to the predictive-feedback study until the ordering + the inferred/predicted split hold."

limitations:
  - "Reduced units; the claim is the RELATIVE morphology ordering, not absolute cell height."
  - "Perlecan-driven height differences are small in magnitude (~2-3% gain vs control at these parameters); the ordering is strict but the sensitivity is modest, while the growth-rate axis dominates shape."
  - "Point estimates only: the Fig 7 result propagates an inferred-lifetime DISTRIBUTION with uncertainty bands; this study records the point-estimate ordering and leaves the uncertainty propagation as a documented follow-up."
  - "The inferred collagen lifetime is an input parameter here, not re-inferred from a turnover observation model (Fig 3-6); the inference step is upstream (R3-era) and assumed."
  - "Homogeneous single cell via the R1 endpoint; no spatial epithelium."

visualizations:
  - name: r6_intervention
    address: "html:r6_intervention.html"
    config:
      title: "Intervention ordering on cell height (Fig 7 reproduction)"
      caption: >
        Predicted cell height for each perlecan and growth-rate condition, with the inferred membrane relaxation time marked on each bar, reproducing the paper's Figure 7. Perlecan gain gives the tallest cells, then the control, then perlecan loss.

report:
  title: "R6 -- turnover -> shape intervention ordering (Fig 7 reproduction)"
  verdict: >
    The turnover -> relaxation -> shape pipeline reproduces Barrientos Figure 7's intervention
    ordering on a deterministic run: predicted cell height is tallest under perlecan gain (0.439),
    then control (0.429), then perlecan loss (0.404), and the inferred BM relaxation time scales
    exactly with the perlecan factor (5.0 x factor) while being reported as a distinct output from
    the predicted shape. The fast-growth condition collapses the cell to 0.134, showing the
    growth-rate axis dominates morphology. The perlecan effect is strictly ordered but small in
    magnitude; uncertainty-band propagation over the inferred-lifetime distribution is a documented
    follow-up.
  confidence: high
  evidence_quality: solid
  main_insight: >
    Carrying an inferred collagen lifetime (x perlecan) through the BM relaxation time into the R1
    mechanics reproduces the paper's perlecan intervention ordering and keeps the inferred
    (turnover) and predicted (mechanics) quantities distinct, as the validation plan requires.
  caveat: >
    Reduced units and point estimates only; the perlecan-driven height differences are modest
    (~2-3%), and the growth-rate axis dominates shape -- the strength of the result is the robust
    ordering and the inferred/predicted separation, not the magnitude of the perlecan effect.

findings:
  - id: F1-fig7-ordering-reproduced
    kind: biological
    status: confirms
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      The pipeline reproduces Figure 7's intervention ordering: predicted cell height is tallest
      under perlecan gain (0.4386), then control (0.4287), then perlecan loss (0.4043) -- a strict
      gain > control > loss ordering.
    evidence:
      from_run: r6-perlecan-growth-conditions
      from_test: perlecan-intervention-ordering
      observed: "0.4386 > 0.4287 > 0.4043 (perlecan gain / control / loss)"
    expected:
      cites: [barrientos2026cellshape]
      range: "perlecan gain taller, loss flatter (Fig 7)"
    explanation: >
      Perlecan gain lengthens the inferred collagen lifetime, slowing BM relaxation, so the R1
      mechanics keep the cell taller; perlecan loss does the reverse.
    next_action: "feed the closed reproduction campaign into the E4 predictive-feedback study"
    next_action_type: escalate_model
    provenance:
      run_ids: [r6-perlecan-growth-conditions]
  - id: F2-inferred-predicted-distinct
    kind: methodological
    status: confirms
    tier: mechanism
    mechanism_origin: engineered
    statement: >
      The inferred BM relaxation time (turnover) and the predicted cell height (mechanics) are
      distinct pipeline outputs; the inferred relaxation scales exactly linearly with the perlecan
      factor (5.0 x factor: 1.5 / 5.0 / 10.0 / 15.0), and perlecan reaches the predicted shape only
      through that relaxation time.
    evidence:
      from_run: r6-perlecan-growth-conditions
      from_test: inferred-relaxation-scales-with-perlecan
      observed: "inferred_relaxation = 5.0 x perlecan_factor, exact; emitted separately from cell_height"
    explanation: "The pipeline reports inferred_relaxation and cell_height as separate outputs, satisfying the plan's inferred-vs-predicted validation distinction."
    provenance:
      run_ids: [r6-perlecan-growth-conditions]
  - id: F3-growth-dominates-magnitude-modest
    kind: biological
    status: partial
    tier: interpretation
    mechanism_origin: emergent
    statement: >
      The growth-rate axis dominates cell shape (fast growth collapses height to 0.134 vs control
      0.429), while the perlecan-driven height differences are small in magnitude (~2-3% gain vs
      control). The Fig 7 ordering is robust, but the model's perlecan sensitivity is modest.
    evidence:
      from_run: r6-perlecan-growth-conditions
      from_test: faster-growth-spreads
      observed: "fast-growth 0.1343 vs control 0.4287; gain-vs-control gap ~2.3%"
    next_action: "propagate the inferred-lifetime uncertainty bands to test whether the perlecan ordering survives the distribution width"
    next_action_type: replicate
    provenance:
      run_ids: [r6-perlecan-growth-conditions]

followup_proposals:
  - id: fp-r6-uncertainty-bands
    title: "Propagate the inferred-lifetime uncertainty bands through to the predicted shape"
    motivation: >
      Figure 7 carries uncertainty bands from the inferred collagen-lifetime distribution. This
      study records point-estimate ordering; propagate the distribution (sample the inferred
      lifetime per condition) and test whether the perlecan ordering survives the band width given
      the modest ~2-3% effect.
    hypothesized_mechanism: "The perlecan ordering may overlap within the inferred-lifetime uncertainty, which would weaken the reproduction from strict to distributional."
    status: proposed

discovery_implications:
  resolved_uncertainties:
    - "The turnover->shape pipeline reproduces the Fig 7 perlecan intervention ordering."
    - "Inferred (turnover) and predicted (mechanics) quantities are kept distinct, as the plan requires."
  remaining_uncertainties:
    - "Whether the perlecan ordering survives uncertainty-band propagation given the modest ~2-3% effect."
    - "Absolute cell shape in physical units."
  followup_study_proposals:
    - {id: fp-r6-uncertainty-bands, title: "Inferred-lifetime uncertainty-band propagation"}

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: "The turnover_shape_pipeline composite is registered and the pipeline runs cleanly; the behavior-test contracts pass deterministically in CI."
  biological_validation:
    result: PASS
    basis: >
      Reproduces Fig 7's intervention ordering (perlecan gain > control > loss) with the inferred
      relaxation kept distinct from the predicted shape. Magnitude of the perlecan effect is modest
      (noted as a limitation), but the ordering and the inferred/predicted split are robust.
  explanatory_gain:
    result: POSITIVE
    basis: >
      Shows the growth-rate axis dominates cell shape over the perlecan axis, and provides the
      closed turnover->shape chain the predictive-feedback study (E4) builds on.

expert_review_status: requested
expert_questions:
  - "Magnitude: the perlecan-driven height difference is only ~2-3% at these parameters. Is the strict ordering a sufficient reproduction of Fig 7, or should the perlecan sensitivity (how strongly the lifetime maps to relaxation, and relaxation to shape) be recalibrated to match the paper's effect size?"
  - "Uncertainty: should the canonical R6 run propagate the inferred collagen-lifetime DISTRIBUTION (uncertainty bands), rather than the point estimates recorded here, before the reproduction is called complete?"

bibliography:
  sources:
    - key: barrientos2026cellshape
      note: "Barrientos et al. cell-shape paper; Figure 7 perlecan / growth-rate intervention ordering on cell shape is the reproduction target."
