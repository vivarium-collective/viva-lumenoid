    address: "html:r6_intervention.html"
    config:
      title: "Intervention ordering on cell height (Fig 7 reproduction)"
      caption: >
        REAL run (Fig 7 reproduction): predicted cell height per perlecan / growth-rate condition from the turnover->shape pipeline (inferred BM relaxation annotated). Reproduces the rank-order — perlecan gain -> taller > control > loss.
