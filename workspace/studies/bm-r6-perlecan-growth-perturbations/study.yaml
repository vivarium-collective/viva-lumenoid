question: >
  Does the inferred chain lifetime -> relaxation -> shape reproduce the paper's perlecan and
  growth-rate intervention ordering?

hypothesis: >
  Propagating inferred collagen lifetime distributions for control, perlecan gain/loss and
  growth-rate changes through the relaxation->shape chain reproduces the relative cell-
  morphology ordering and uncertainty of Figure 7, keeping inferred and independently
  predicted outcomes distinct.

objective: >
  Use inferred collagen lifetime distributions for control, perlecan gain/loss and growth-rate
  conditions; propagate parameter uncertainty through relaxation and shape; compare relative
  cell morphology and uncertainty to Fig 7 while keeping inferred vs predicted outcomes
  distinct.

description: |
  Closes the reproduction campaign by propagating the turnover-inference results (Fig 3-6)
  into predicted shapes (Fig 7). Collagen lifetime distributions for control, perlecan
  gain/loss and growth-rate perturbations drive the relaxation->shape chain with explicit
  uncertainty propagation. The study must keep quantities that are INFERRED from the timer
  observation model distinct from quantities INDEPENDENTLY PREDICTED by the mechanical model,
  per the plan's validation distinction.

