schema_version: 4
name: bm-r6-perlecan-growth-perturbations
title: "Perlecan & growth perturbations on cell shape"
created: "2026-09-30"
status: in-progress
phase: Decide
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted
confidence: Accepted

claim: >
  Carrying an inferred collagen IV lifetime through BM relaxation to cell shape reproduces the
  paper's Figure 7 perlecan intervention ordering: perlecan knockdown (loss) gives the TALLEST
  cells, control intermediate, and perlecan overexpression (gain) the SHORTEST -- with the
  inferred relaxation time (turnover) kept distinct from the predicted cell height (mechanics).
  This followed a correction: the figure review caught that the model's perlecan direction was
  inverted; an audit against the paper (perlecan OVEREXPRESSION shortens the collagen IV lifetime
  ~1 h vs ~20 h control, knockdown lengthens it ~500 h; "perlecan promotes bond breakage") fixed
  the perlecan_factor -> lifetime mapping, after which the ordering matches.

correction_note: >
  2026-10-20: an earlier version assumed perlecan STABILIZES collagen (gain -> longer lifetime ->
  taller), which produced the OPPOSITE ordering and was flagged by the figure review as
  contradicting the paper. Verified against Barrientos et al. Cell 2026 (full text, PMC13536978):
  perlecan promotes collagen IV bond breakage, so overexpression SHORTENS lifetime. The
  perlecan_factor direction was inverted accordingly (overexpression -> factor < 1); the mechanics
  (relaxation -> height) were already correct. R6 now reproduces Fig 7.

experiment: >
  Run the TurnoverShapeProcess pipeline for four conditions -- control, perlecan gain, perlecan
  loss, and fast growth. The inferred collagen IV lifetime (modulated by a perlecan factor) sets
  the BM relaxation time (inferred_relaxation = collagen_lifetime x perlecan_factor); that
  relaxation drives the reduced-order prism mechanics (R1) to a predicted cell height. Read
  inferred_relaxation (the turnover/inference quantity) and cell_height / confinement (the
  independent mechanical prediction) at the end of each 40-step run (dt 0.2), and check the
  rank-order against Barrientos Figure 7.

result: >
  With the perlecan direction corrected to the paper, the intervention ordering reproduces Figure
  7: predicted cell height is tallest under perlecan knockdown/loss (0.4508), then control
  (0.4287), then perlecan overexpression/gain (0.3793) -- a strict loss > control > gain ordering
  matching the paper (perlecan loss -> taller/thinner; overexpression -> shorter/fatter). The
  inferred BM relaxation time tracks the perlecan-set collagen lifetime (inferred_relaxation =
  5.0 x perlecan_factor: 125 at loss, 5.0 at control, 0.25 at gain, using the paper's lifetime
  ratios ~500 h / ~20 h / ~1 h), reported as a separate output from the predicted height so the
  inferred (turnover) and predicted (mechanics) quantities stay distinct as the plan requires.
  The fast-growth condition collapses the cell to height 0.134 -- faster proliferation spreads the
  cell more strongly than perlecan changes it. With the paper's full lifetime range the perlecan
  height effect is substantial (loss-vs-gain ~19%), not the ~2-3% the inverted small-factor
  version showed.
result_superseded: >
  (INVERTED, pre-correction) Predicted cell height tallest under perlecan gain (0.4386), then
  control (0.4287), then loss (0.4043) -- a gain > control > loss ordering that CONTRADICTED the
  paper. Flagged by the figure review; the perlecan direction was audited against Barrientos et al.
  Cell 2026 and inverted (overexpression shortens the collagen IV lifetime), which fixed the
  ordering. Kept for provenance.

# Canonical DAG edge -- R6 closes the reproduction campaign (Fig 7) on the R1 mechanics endpoint.
pipeline_gate:
  prerequisites:
    - bm-r1-published-tissue-baseline
  proceed_condition: >
    A reproduced intervention ordering (perlecan gain > control > loss) with the inferred
    relaxation kept distinct from the predicted shape closes the P1-era reproduction and feeds
    the predictive-feedback study (E4).

question: >
  Does the inferred chain lifetime -> relaxation -> shape reproduce the paper's perlecan and
  growth-rate intervention ordering?

purpose:
  question: >
    Does the inferred chain (collagen lifetime -> BM relaxation -> cell shape) reproduce the
    paper's perlecan and growth-rate intervention ordering, keeping inferred and predicted
    quantities distinct?
  mechanism: >
    Perlecan stabilizes collagen IV, lengthening its inferred molecular lifetime; a longer
    lifetime is a slower BM relaxation time, which the reduced-order prism mechanics (R1) turns
    into a taller (more confined) cell. The turnover-inferred relaxation and the mechanics-predicted
    shape are two distinct outputs of the pipeline.
  expected_outcome: >
    A strict cell-height ordering perlecan gain > control > loss (Fig 7), with inferred_relaxation
    scaling with the perlecan factor and reported separately from the predicted height.

hypothesis: >
  Propagating inferred collagen lifetime distributions for control, perlecan gain/loss and
  growth-rate changes through the relaxation->shape chain reproduces the relative cell-
  morphology ordering and uncertainty of Figure 7, keeping inferred and independently
  predicted outcomes distinct.

objective: >
  Use inferred collagen lifetime distributions for control, perlecan gain/loss and growth-rate
  conditions; propagate parameter uncertainty through relaxation and shape; compare relative
  cell morphology and uncertainty to Fig 7 while keeping inferred vs predicted outcomes
  distinct.

description: |
  Closes the reproduction campaign by propagating the turnover-inference results (Fig 3-6)
  into predicted shapes (Fig 7). Collagen lifetime distributions for control, perlecan
  gain/loss and growth-rate perturbations drive the relaxation->shape chain with explicit
  uncertainty propagation. The study must keep quantities that are INFERRED from the timer
  observation model distinct from quantities INDEPENDENTLY PREDICTED by the mechanical model,
  per the plan's validation distinction.

key_assumptions:
  - "Perlecan modulates the collagen IV lifetime multiplicatively (perlecan_factor); >1 stabilizes (longer lifetime), <1 destabilizes."
  - "The inferred collagen lifetime, times the perlecan factor, IS the BM relaxation time (turnover -> relaxation)."
  - "The predicted cell shape is the R1 reduced-order prism mechanics run with that relaxation (perlecan does not act on the mechanics except through the relaxation time)."
  - "inferred_relaxation (turnover/inference) and cell_height (mechanics prediction) are kept as distinct outputs; the inferred quantity is not re-derived from the predicted one."
  - "Reduced units; relative morphology ordering is the claim, not absolute cell height. Uncertainty bands over the inferred lifetime distribution are a documented follow-up (point estimates recorded here)."

parent_studies:
  - {study: bm-r1-published-tissue-baseline, condition: tests-passed}
  - {study: bm-r5-explicit-3d-confinement, condition: tests-passed}
  - {study: bm-r3-network-expansion-supply, condition: tests-passed}

cites: [barrientos2026cellshape]

baseline:
  - name: bm-r6-perlecan-growth-perturbations
    composite: viva_lumenoid.composites.turnover_shape_pipeline
    params:
      collagen_lifetime: 5.0
      perlecan_factor: 1.0
      doubling_time: 5.0
    note: >
      The chain from turnover to shape. An inferred collagen IV lifetime, adjusted
      for perlecan, sets the basement-membrane relaxation time, which the
      homogeneous tissue model turns into a predicted cell shape. Perlecan that
      stabilizes collagen lengthens the lifetime and confines the cells, so the
      model reproduces the paper's ordering of the perlecan and growth-rate
      interventions: perlecan gain gives the tallest cells, then the control, then
      perlecan loss. Quantities inferred from the turnover data are kept separate
      from the shapes the mechanics predicts.

variants:
  - name: perlecan-gain
    description: "Perlecan overexpression (factor 0.05, lifetime ~1 h): perlecan promotes bond breakage -> SHORTER collagen lifetime -> faster BM relaxation -> shorter/fatter cell."
    params: {perlecan_factor: 0.05}
  - name: perlecan-loss
    description: "Perlecan knockdown (factor 25.0, lifetime ~500 h): less bond breakage -> LONGER collagen lifetime -> slower BM relaxation -> taller/thinner cell."
    params: {perlecan_factor: 25.0}
  - name: fast-growth
    description: "Fast growth (doubling_time 2.5): faster proliferation spreads the cell regardless of perlecan."
    params: {doubling_time: 2.5}

conditions:
  baseline:
    composite: viva_lumenoid.composites.turnover_shape_pipeline
    params: {collagen_lifetime: 5.0, perlecan_factor: 1.0, doubling_time: 5.0}
  variants:
    - name: perlecan-gain
      description: "Perlecan overexpression -> shorter."
    - name: perlecan-loss
      description: "Perlecan knockdown -> taller."
    - name: fast-growth
      description: "Faster growth -> flatter."
  model_settings:
    - name: perlecan_factor
      default: 1.0
      current: 1.0
      range: [0.05, 25.0]
      units: multiplier on collagen lifetime (<1 overexpression, >1 knockdown)
      cites: [barrientos2026cellshape]
      notes: "Perlecan modulation of the inferred collagen IV lifetime; the Fig 7 intervention axis. Perlecan promotes collagen IV bond breakage, so overexpression (factor < 1) shortens the lifetime (~1 h vs ~20 h control) and knockdown (factor > 1) lengthens it (~500 h)."
    - name: collagen_lifetime
      default: 5.0
      current: 5.0
      range: [1.5, 10.0]
      units: reduced time (inferred)
      cites: [barrientos2026cellshape]
      notes: "Inferred collagen IV molecular lifetime; x perlecan_factor sets the BM relaxation time."
    - name: doubling_time
      default: 5.0
      current: 5.0
      range: [2.5, 5.0]
      units: reduced time
      cites: [barrientos2026cellshape]
      notes: "Growth-rate condition; a shorter doubling time spreads the cell."

robustness:
  parameter_sweep: true
  n_replicates: 4
  note: >
    Deterministic pipeline (no stochasticity, so seeds are not meaningful):
    replication is the 4-condition intervention sweep (control / perlecan gain /
    perlecan loss / fast growth) rather than a seed ensemble.

simulation_set:
  - name: r6-perlecan-growth-conditions
    status: completed
    base_model: viva_lumenoid.composites.turnover_shape_pipeline
    conditions:
      control:       {perlecan_factor: 1.0,  doubling_time: 5.0}
      perlecan_gain: {perlecan_factor: 0.05, doubling_time: 5.0}
      perlecan_loss: {perlecan_factor: 25.0, doubling_time: 5.0}
      fast_growth:   {perlecan_factor: 1.0,  doubling_time: 2.5}
    fixed: {collagen_lifetime: 5.0, steps: 40, dt: 0.2}
    metrics:
      height_perlecan_loss: 0.4508    # knockdown ~500h lifetime -> tallest
      height_control: 0.4287
      height_perlecan_gain: 0.3793    # overexpression ~1h lifetime -> shortest
      height_fast_growth: 0.1343
      inferred_relaxation_loss: 125.0
      inferred_relaxation_control: 5.0
      inferred_relaxation_gain: 0.25
      ordering_loss_gt_control_gt_gain: true
      matches_paper_fig7: true
    pass_fail_tests:
      - "perlecan-intervention-ordering: pass"
      - "inferred-relaxation-scales-with-perlecan: pass"
      - "inferred-and-predicted-distinct: pass"
      - "faster-growth-spreads: pass"

# Canonical run record -- feeds the dashboard's Ran . Tests . Verdict strip.
runs:
  - name: r6-perlecan-growth-conditions
    base_model: viva_lumenoid.composites.turnover_shape_pipeline
    status: completed
    outcomes:
      perlecan-intervention-ordering:
        result: PASS
        observed: "cell height 0.4508 (loss/knockdown) > 0.4287 (control) > 0.3793 (gain/overexpression) -- the paper's Fig 7 ordering (perlecan loss taller, overexpression shorter), after correcting the inverted perlecan direction."
      inferred-relaxation-scales-with-perlecan:
        result: PASS
        observed: "inferred_relaxation = 5.0 x perlecan_factor: 0.25 (gain ~1h) / 5.0 (control ~20h) / 125 (loss ~500h), the paper's lifetime ratios"
      inferred-and-predicted-distinct:
        result: PASS
        observed: "inferred_relaxation (turnover) and cell_height (mechanics) emitted as separate outputs; perlecan acts on height only via relaxation"
      faster-growth-spreads:
        result: PASS
        observed: "fast-growth height 0.1343 << control 0.4287 -- growth rate dominates shape"

readouts:
  - name: inferred_relaxation
    description: Inferred BM relaxation time = collagen_lifetime x perlecan_factor; the turnover/inference quantity (NOT the mechanical prediction).
    store_path: "inferred_relaxation"
    units: reduced time (inferred)
    status: measured
  - name: cell_height
    description: Predicted cell height from the R1 reduced-order mechanics run with the inferred relaxation; the mechanical prediction.
    store_path: "cell_height"
    units: reduced (volume/area)
    status: measured
  - name: confinement
    description: Predicted cell height relative to the initial height; the morphology variable compared across conditions.
    store_path: "confinement"
    units: dimensionless
    status: measured
  - name: basal_area
    description: Predicted basal area of the prism cell under each condition.
    store_path: "basal_area"
    units: reduced area
    status: measured

behavior_tests:
  - name: perlecan-intervention-ordering
    classification: primary
    description: >
      Predicted cell height follows the paper's Fig 7 perlecan ordering: knockdown/loss (longest
      lifetime) > control > overexpression/gain (shortest lifetime). Reproduces the paper's
      direction after correcting the inverted perlecan assumption.
    measure: {kind: order, field: cell_height, cases: ["perlecan_loss", "control", "perlecan_gain"]}
    pass_if: {op: strictly_decreasing, note: "height(loss) > height(control) > height(gain) -- the paper's direction"}
    units: reduced
    requires_simulation: r6-perlecan-growth-conditions
    cites: [barrientos2026cellshape]
    calibration_anchor:
      observed_value: "0.4508 (loss) > 0.4287 (control) > 0.3793 (gain)"
      literature_target: "paper: perlecan knockdown -> taller, overexpression -> shorter (Fig 7)"
      resolution: concept
      cites: [barrientos2026cellshape]
  - name: inferred-relaxation-scales-with-perlecan
    classification: primary
    description: >
      The inferred BM relaxation time scales with the perlecan factor (turnover -> relaxation),
      linearly as collagen_lifetime x perlecan_factor.
    measure: {kind: monotonicity, field: inferred_relaxation, versus: perlecan_factor}
    pass_if: {op: increasing, note: "inferred_relaxation = 5.0 x perlecan_factor; strictly increasing in perlecan"}
    units: reduced time
    requires_simulation: r6-perlecan-growth-conditions
  - name: inferred-and-predicted-distinct
    classification: secondary
    description: >
      The inferred (turnover) relaxation and the predicted (mechanics) cell height are distinct
      outputs -- the validation distinction the plan requires.
    measure: {kind: structure, fields: [inferred_relaxation, cell_height]}
    pass_if: {op: both_emitted, note: "both are emitted independently; perlecan drives height only through the relaxation time"}
    units: mixed
    requires_simulation: r6-perlecan-growth-conditions
  - name: faster-growth-spreads
    classification: secondary
    description: >
      A faster growth rate (shorter doubling time) spreads the cell flat, independent of perlecan --
      the growth-rate intervention of Fig 7.
    measure: {kind: compare, field: cell_height, cases: ["fast_growth", "control"]}
    pass_if: {op: lt, note: "height(fast_growth) < height(control)"}
    units: reduced
    requires_simulation: r6-perlecan-growth-conditions

falsifiability: >
  The claim would be overturned if the predicted cell-height ordering were not strictly perlecan
  loss/knockdown > control > gain/overexpression (an inverted or collapsed ordering), if inferred_relaxation did not
  increase with the perlecan factor, if the pipeline failed to emit the inferred relaxation and
  the predicted height as distinct outputs, or if a faster growth rate did not spread the cell.
  Any of these would show the turnover->shape chain does not reproduce the Fig 7 intervention
  ordering or violate the inferred-vs-predicted distinction. The deterministic contracts in
  tests/test_turnover_shape.py would fail in that case.

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "The turnover->shape pipeline runs end-to-end and keeps inferred vs predicted distinct."
    biological_validation: "Reproduces Fig 7: perlecan knockdown -> taller > control > overexpression -> shorter, matching the paper, after correcting the perlecan direction (overexpression shortens the collagen IV lifetime). The growth-rate axis (faster growth -> flatter) is also correct."
    pipeline_unblocks:
      - "E4 predictive-feedback study -- this closes the reproduction campaign it builds on."
  if_primary_tests_fail:
    diagnose:
      - "Ordering inverted -- re-check the perlecan direction (overexpression must SHORTEN the lifetime -> perlecan_factor < 1)."
      - "Inferred and predicted collapsed into one -- the pipeline must emit inferred_relaxation separately from cell_height."

limitations:
  - "Perlecan direction was INVERTED in an earlier version (flagged by the figure review) and has been corrected against the paper (perlecan promotes bond breakage -> overexpression shortens the collagen IV lifetime). Provenance kept in correction_note / *_superseded."
  - "Reduced units; the claim is the RELATIVE morphology ordering, not absolute cell height. The perlecan factors (0.05 / 1 / 25) encode the paper's measured lifetime ratios (~1 h / ~20 h / ~500 h)."
  - "Point estimates only: the Fig 7 result propagates an inferred-lifetime DISTRIBUTION with uncertainty bands; this study records the point-estimate ordering and leaves the uncertainty propagation as a documented follow-up."
  - "The inferred collagen lifetime is an input parameter here, not re-inferred from a turnover observation model (Fig 3-6); the inference step is upstream (R3-era) and assumed."
  - "Homogeneous single cell via the R1 endpoint; no spatial epithelium."

visualizations:
  - name: r6_intervention
    address: "html:r6_intervention.html"
    config:
      title: "Perlecan/growth intervention on predicted cell height (Barrientos Fig 7 reproduction)"
      evidence_status: reproduced
      tier: main
      caption: >
        Predicted cell height per perlecan and growth-rate condition (inferred BM relaxation annotated), reproducing the paper's Figure 7 after correcting the perlecan direction. Perlecan knockdown lengthens the collagen IV lifetime (~500 h) → slower BM relaxation → the tallest cells; overexpression shortens it (~1 h) → faster relaxation → the shortest; control intermediate — matching Barrientos et al. (perlecan promotes collagen bond breakage). Faster growth (right) spreads the cell flat regardless of perlecan. Reduced units; the perlecan factors encode the paper's measured lifetime ratios.

report:
  title: "R6 -- turnover -> shape intervention ordering (Barrientos Fig 7 reproduction)"
  verdict: >
    The turnover -> relaxation -> shape pipeline reproduces Barrientos Figure 7's perlecan
    intervention ordering: predicted cell height is tallest under perlecan knockdown/loss (0.451),
    then control (0.429), then perlecan overexpression/gain (0.379) -- matching the paper
    (knockdown -> taller/thinner; overexpression -> shorter/fatter). The inferred BM relaxation
    time tracks the perlecan-set collagen lifetime (125 / 5 / 0.25 reduced units, the paper's
    ~500 h / ~20 h / ~1 h ratios) and is reported as a distinct output from the predicted shape.
    Fast growth collapses the cell to 0.134, so the growth-rate axis dominates magnitude. This
    reproduction followed a correction: the figure review caught that the perlecan direction was
    inverted; an audit against the paper (perlecan promotes collagen IV bond breakage, so
    overexpression SHORTENS lifetime) fixed the perlecan_factor sign, after which the ordering
    matches. The mechanics (relaxation -> height) were already correct.
  confidence: high
  evidence_quality: reproduced
  main_insight: >
    Carrying the perlecan-set collagen IV lifetime through the BM relaxation time into the R1
    mechanics reproduces the paper's perlecan morphology ordering, with inferred (turnover) and
    predicted (mechanics) quantities kept distinct. The review-caught inversion is a good example
    of the figure review doing exactly its job: a decisive sign error, found and fixed against the
    source.
  caveat: >
    Reduced units and point estimates only; the perlecan factors encode the paper's measured
    lifetime ratios but the absolute cell shapes are not calibrated. Uncertainty-band propagation
    over the inferred-lifetime distribution is a documented follow-up.

findings:
  - id: F1-perlecan-ordering-reproduced
    kind: biological
    status: confirms
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      The model reproduces the paper's perlecan ordering: predicted height is tallest under
      knockdown/loss (0.4508), then control (0.4287), then overexpression/gain (0.3793) -- matching
      Barrientos Fig 7 (knockdown taller, overexpression shorter). This followed correcting an
      inverted assumption: the figure review caught that the model had perlecan stabilizing
      collagen (gain -> taller), and an audit against the paper (perlecan promotes collagen IV bond
      breakage; overexpression lifetime ~1 h vs ~20 h control, knockdown ~500 h) fixed the
      perlecan_factor direction, after which the ordering matches.
    evidence:
      from_run: r6-perlecan-growth-conditions
      from_test: perlecan-intervention-ordering
      observed: "0.4508 (loss) > 0.4287 (control) > 0.3793 (gain); relaxation 125 / 5 / 0.25 (the paper's ~500/20/1 h ratios)"
    expected:
      cites: [barrientos2026cellshape]
      range: "paper: perlecan knockdown -> taller; overexpression -> shorter (Fig 7)"
    explanation: >
      Perlecan overexpression shortens the collagen IV lifetime -> faster BM relaxation -> the R1
      mechanics let the cell spread (shorter); knockdown lengthens the lifetime -> slower relaxation
      -> the cell stays confined (taller). The mechanics (relaxation -> height) were already correct;
      only the perlecan -> lifetime sign needed inverting.
    next_action: "propagate the inferred-lifetime uncertainty bands (Fig 7 bands) to test robustness of the ordering"
    next_action_type: replicate
    provenance:
      run_ids: [r6-perlecan-growth-conditions]
    cites: [barrientos2026cellshape]
  - id: F2-inferred-predicted-distinct
    kind: methodological
    status: confirms
    tier: mechanism
    mechanism_origin: engineered
    statement: >
      The inferred BM relaxation time (turnover) and the predicted cell height (mechanics) are
      distinct pipeline outputs; the inferred relaxation scales linearly with the perlecan factor
      (5.0 x factor: 0.25 / 5.0 / 125 for overexpression / control / knockdown), and perlecan
      reaches the predicted shape only through that relaxation time.
    evidence:
      from_run: r6-perlecan-growth-conditions
      from_test: inferred-relaxation-scales-with-perlecan
      observed: "inferred_relaxation = 5.0 x perlecan_factor, exact; emitted separately from cell_height"
    explanation: "The pipeline reports inferred_relaxation and cell_height as separate outputs, satisfying the plan's inferred-vs-predicted validation distinction."
    provenance:
      run_ids: [r6-perlecan-growth-conditions]
  - id: F3-growth-dominates-perlecan-substantial
    kind: biological
    status: confirms
    tier: interpretation
    mechanism_origin: emergent
    statement: >
      The growth-rate axis dominates cell shape most strongly (fast growth collapses height to
      0.134 vs control 0.429), but with the paper's full perlecan lifetime range the perlecan
      height effect is also substantial -- loss-vs-gain spread ~19% (0.4508 vs 0.3793), not the
      ~2-3% the inverted small-factor version showed.
    evidence:
      from_run: r6-perlecan-growth-conditions
      from_test: faster-growth-spreads
      observed: "fast-growth 0.1343 vs control 0.4287; perlecan loss-vs-gain 0.4508 vs 0.3793 (~19%)"
    next_action: "propagate the inferred-lifetime uncertainty bands (Fig 7)"
    next_action_type: replicate
    provenance:
      run_ids: [r6-perlecan-growth-conditions]

followup_proposals:
  - id: fp-r6-perlecan-direction-audit
    title: "Audit the perlecan -> collagen-turnover direction against the paper"
    motivation: >
      The figure review flagged that our perlecan ordering (gain -> taller) was OPPOSITE the paper.
    hypothesized_mechanism: >
      If perlecan overexpression speeds collagen IV turnover (shorter lifetime), gain should map to
      perlecan_factor < 1.
    status: resolved
    outcome: >
      DONE (2026-10-20). Verified against Barrientos et al. Cell 2026 (PMC13536978): perlecan
      promotes collagen IV bond breakage; overexpression lifetime ~1 h vs ~20 h control, knockdown
      ~500 h. The perlecan_factor -> lifetime mapping was inverted accordingly (overexpression ->
      factor < 1). R6 now reproduces Fig 7 (loss > control > gain).
  - id: fp-r6-uncertainty-bands
    title: "Propagate the inferred-lifetime uncertainty bands through to the predicted shape"
    motivation: >
      Figure 7 carries uncertainty bands from the inferred collagen-lifetime distribution. This
      study records point-estimate ordering; propagate the distribution (sample the inferred
      lifetime per condition) and test whether the perlecan ordering survives the band width given
      the modest ~2-3% effect.
    hypothesized_mechanism: "The perlecan ordering may overlap within the inferred-lifetime uncertainty, which would weaken the reproduction from strict to distributional."
    status: proposed

discovery_implications:
  resolved_uncertainties:
    - "R6 reproduces the paper's Fig 7 perlecan ordering (knockdown taller > control > overexpression shorter) after the perlecan direction was corrected against the paper."
    - "The perlecan -> collagen-turnover direction: perlecan promotes bond breakage, so overexpression SHORTENS the lifetime (verified against Barrientos Cell 2026)."
    - "The turnover->shape pipeline keeps inferred (turnover) and predicted (mechanics) quantities distinct; the growth-rate axis dominates magnitude, correctly."
  remaining_uncertainties:
    - "Whether the perlecan ordering survives uncertainty-band propagation over the inferred-lifetime distribution (Fig 7 bands)."
    - "Absolute cell shape in physical units (the perlecan factors encode the paper's lifetime ratios, not calibrated absolute heights)."
  followup_study_proposals:
    - {id: fp-r6-uncertainty-bands, title: "Inferred-lifetime uncertainty-band propagation"}

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: "The turnover_shape_pipeline composite is registered and the pipeline runs cleanly; the behavior-test contracts pass deterministically in CI."
  biological_validation:
    result: PASS
    basis: >
      Reproduces Fig 7's perlecan ordering (knockdown/loss 0.4508 > control 0.4287 >
      overexpression/gain 0.3793), matching the paper, after correcting the inverted perlecan
      direction against the source (perlecan promotes collagen IV bond breakage -> overexpression
      shortens lifetime). Inferred and predicted quantities stay distinct; the growth-rate axis is
      also correct. Reduced units; uncertainty-band propagation is a documented follow-up.
  explanatory_gain:
    result: POSITIVE
    basis: >
      Shows the growth-rate axis dominates cell shape over the perlecan axis, and provides the
      closed turnover->shape chain the predictive-feedback study (E4) builds on.

expert_review_status: requested
expert_questions:
  - "Perlecan direction: RESOLVED against the paper (perlecan promotes collagen IV bond breakage; overexpression ~1 h / control ~20 h / knockdown ~500 h lifetime). Please sanity-check that the inverted perlecan_factor mapping (overexpression -> factor < 1) is the intended reading before this is called a final reproduction."
  - "Uncertainty: should the canonical R6 run propagate the inferred collagen-lifetime DISTRIBUTION (uncertainty bands) before the reproduction is called complete?"

bibliography:
  sources:
    - key: barrientos2026cellshape
      note: "Barrientos et al. cell-shape paper; Figure 7 perlecan / growth-rate intervention ordering on cell shape is the reproduction target."
