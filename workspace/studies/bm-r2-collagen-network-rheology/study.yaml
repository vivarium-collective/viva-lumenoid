schema_version: 4
name: bm-r2-collagen-network-rheology
title: "Faithful collagen IV network rheology"
created: "2026-10-20"
status: in-progress
phase: Evaluate
simulation_status: ran
implementation_status: complete
evaluation_status: evaluated
gate_status: passed
design_status: drafted
confidence: Investigating

claim: >
  The faithful collagen IV network assembles and carries in-plane stress under staged growth
  loading on real LAMMPS, and its macroscopic stress-relaxation time is resolvable at SLOW
  turnover (long collagen residence) but falls below the noise floor as turnover speeds up --
  a partial reproduction of Barrientos Figure 2E, whose full relaxation-vs-residence
  proportionality needs a denser, larger network.

experiment: >
  Drive the collagen IV network composite (viva_lumenoid.composites.stage2_sweep /
  CollagenNetworkProcess, released NC1/7S angles) through staged growth loading with the
  crosslink chemistry switched on. Two runs back the study. (1) A bounded smoke run (40 rods,
  real angles, 4 growth steps) confirms the composite emits a crosslinked network
  (n_crosslinks > 0) and a finite in-plane stress (sigma_inplane). (2) A moderate turnover
  sweep (120 rods, box 8, slab 4, real angles, bending_k 4) run by the coordinating session
  varies the crosslink off_rate over 0.01 / 0.02 / 0.04 -- collagen residence times 100 / 50 /
  25 LJ -- and fits the stress-relaxation time tau at each, independently of the residence
  time set by the chemistry, so tau-vs-residence is a prediction, not an identity.

result: >
  The network assembles and stresses as required: the bounded smoke run forms 5 crosslinks at
  40 rods and reports a finite in-plane stress (sigma_inplane 0.250 LJ), confirming the
  composite emits the sigma_inplane and n_crosslinks readouts the study depends on. In the
  coordinating session's moderate turnover sweep, all three turnover rates build the same stiff
  network (elastic modulus 0.946 LJ, 126 crosslinks), but the relaxation time is resolvable
  only at the SLOWEST turnover: residence 100 gives tau = 57.7 LJ (resolved, not noise-limited),
  while residence 50 and 25 give tau = NaN (the relaxable stress falls below the run-to-run
  noise floor at this network size). This is a PARTIAL Figure 2E: the direction is right
  (slower turnover -> a resolvable, longer relaxation), but the full tau-proportional-to-
  residence slope across the turnover range cannot be established until the network is denser /
  larger and run with several seeds.

# Canonical DAG edge -- R2 is the molecular-scale rheology reference that gates the supply study.
pipeline_gate:
  prerequisites:
    - {study: bm-v1-stage1-modulus-remodelling, condition: tests-passed}
    - {study: bm-v2-stress-vs-strainrate, condition: tests-passed}
  enables:
    - bm-r3-network-expansion-supply
  proceed_condition: >
    A network that assembles and carries finite stress under growth loading, with a
    relaxation time resolvable at slow turnover, is enough to gate the supply-mode study
    (R3). The full Fig-2E tau-vs-residence slope is NOT a prerequisite -- it is deferred to
    a denser multi-seed follow-up.

question: >
  Is basement-membrane stress relaxation proportional to collagen IV molecular residence
  (turnover) time?

purpose:
  question: >
    Is basement-membrane stress relaxation proportional to collagen IV molecular residence
    (turnover) time?
  mechanism: >
    A crosslinked semiflexible rod network relaxes macroscopic stress as crosslinks turn over.
    Slower turnover (a longer collagen residence time, set by a smaller off_rate) should give a
    longer, more cleanly resolvable stress-relaxation time tau; fast turnover relaxes stress
    faster than the network can hold a measurable signal above noise.
  expected_outcome: >
    A stress-relaxation time tau that rises with collagen residence time (Fig 2E), measured
    independently of the residence time so the proportionality is a genuine prediction.

key_assumptions:
  - "The collagen IV network is the faithful NC1/7S model (released angles, density and turnover controls established in bm-v1/bm-v4); the composite is viva_lumenoid.composites.stage2_sweep."
  - "Molecular residence time is set by the force-independent crosslink off_rate (tau_residence ~= 1/off_rate); the macroscopic relaxation time tau is fit independently from the stress trace."
  - "Reduced (LJ) units throughout; no calibration to pascals or hours is claimed here."
  - "The turnover sweep is a single-seed moderate network (120 rods); run-to-run variance and a denser network are the gating gaps for the full Fig-2E slope."
  - "tau = NaN encodes 'below the noise floor at this network size', not a failed run."

parent_studies:
  - {study: bm-v1-stage1-modulus-remodelling, condition: tests-passed}
  - {study: bm-v2-stress-vs-strainrate, condition: tests-passed}

cites: [barrientos2026cellshape, barrientos2026basement, meadowcroft2025nonequilibrium]

baseline:
  - name: collagen-network-stage2
    composite: viva_lumenoid.composites.stage2_sweep
    params:
      n_rods: 120
      box_xy: 8.0
      slab_thickness: 4.0
      use_real_angles: true
      bending_k: 4.0
      off_rate: 0.02
    note: >
      The faithful collagen IV network (released NC1/7S junction angles) driven through
      staged growth loading with the crosslink chemistry switched on. Stress is the bond-virial
      in-plane stress (sigma_inplane); crosslink count is tracked as the network remodels.

variants:
  - name: residence-100
    description: "Slow turnover: off_rate 0.01 -> collagen residence ~100 LJ (the resolvable-tau corner of Fig 2E)."
    params: {off_rate: 0.01}
  - name: residence-50
    description: "Moderate turnover: off_rate 0.02 -> residence ~50 LJ."
    params: {off_rate: 0.02}
  - name: residence-25
    description: "Fast turnover: off_rate 0.04 -> residence ~25 LJ (tau below the noise floor at this size)."
    params: {off_rate: 0.04}

conditions:
  baseline:
    composite: viva_lumenoid.composites.stage2_sweep
    params:
      n_rods: 120
      box_xy: 8.0
      slab_thickness: 4.0
      use_real_angles: true
      bending_k: 4.0
      off_rate: 0.02
  variants:
    - name: residence-100
      description: "off_rate 0.01 -> residence ~100 LJ."
    - name: residence-50
      description: "off_rate 0.02 -> residence ~50 LJ."
    - name: residence-25
      description: "off_rate 0.04 -> residence ~25 LJ."
  model_settings:
    - name: off_rate
      default: 0.02
      current: 0.02
      range: [0.01, 0.04]
      units: 1/LJ-time
      cites: [barrientos2026basement]
      notes: "Force-independent crosslink off-rate; sets collagen residence time ~= 1/off_rate (100/50/25 LJ across the sweep)."
    - name: n_rods
      default: 120
      current: 120
      range: [40, 250]
      units: count
      cites: [meadowcroft2025nonequilibrium]
      notes: "Network size; the noise floor on tau falls as this (and the slab thickness) grows -- the gating knob for the full Fig-2E slope."
    - name: bending_k
      default: 4.0
      current: 4.0
      range: [0.0, 4.0]
      units: LJ (harmonic angle)
      cites: [meadowcroft2025nonequilibrium]
      notes: "Released NC1 junction-angle stiffness; the faithful network uses 4.0 with use_real_angles."

robustness:
  parameter_sweep: true
  n_replicates: 1
  note: >
    The turnover sweep is a 3-point off_rate sweep (residence 100/50/25) at a SINGLE seed on a
    moderate 120-rod network. One seed is not a robustness claim -- the resolvable-only-at-slow-
    turnover result is honest at this size, but resolving tau across the full range and
    establishing the tau-proportional-to-residence slope needs several seeds on a denser network
    (see followup_proposals / the Mac-mini scale-up candidate).

controls:
  - name: fast-turnover-noise-floor
    kind: negative
    result: PASS
    observed: "residence 50 and 25 -> tau = NaN (below the noise floor), while residence 100 -> tau = 57.7 LJ; the sweep correctly reports non-resolution rather than fitting noise."
    note: "A discriminating control: the network does NOT manufacture a resolvable tau where the signal is below noise -- tau is reported NaN, not a spurious number."

simulation_set:
  - name: r2-growth-smoke
    status: completed
    base_model: viva_lumenoid.composites.stage2_sweep
    provenance: "Run by THIS evidence session to confirm the composite emits the referenced outputs."
    fixed: {n_rods: 40, box_xy: 8.0, slab_thickness: 4.0, use_real_angles: true, bending_k: 4.0, assemble_steps: 300, hold_steps: 200, growth_steps: 4}
    metrics:
      n_crosslinks: 5                 # crosslinked network forms from bare rods
      sigma_inplane_lj: 0.250         # finite in-plane stress under growth loading
    pass_fail_tests:
      - "network-forms-and-stresses: pass"
  - name: r2-turnover-sweep
    status: completed
    base_model: viva_lumenoid.composites.stage2_sweep
    provenance: >
      Run by the COORDINATING session (not this evidence session). Config: 120 rods, box_xy 8,
      slab_thickness 4, use_real_angles, bending_k 4; off_rate sweep 0.01 / 0.02 / 0.04.
    axes:
      off_rate: [0.01, 0.02, 0.04]
    residence_time_lj: {0.01: 100, 0.02: 50, 0.04: 25}
    metrics:
      tau_residence_100_lj: 57.7      # off_rate 0.01: resolved, NOT noise-limited
      tau_residence_50_lj: "NaN"      # off_rate 0.02: below the noise floor
      tau_residence_25_lj: "NaN"      # off_rate 0.04: below the noise floor
      elastic_modulus_lj: 0.946       # same across all three turnover rates
      n_crosslinks: 126               # same stiff network across all three
    pass_fail_tests:
      - "tau-resolved-only-at-slow-turnover: pass"

# Canonical run record -- feeds the dashboard's Ran . Tests . Verdict strip.
runs:
  - name: r2-growth-smoke
    base_model: viva_lumenoid.composites.stage2_sweep
    status: completed
    provenance: "this evidence session (bounded smoke, 40 rods)"
    outcomes:
      network-forms-and-stresses:
        result: PASS
        observed: "n_crosslinks 5 (> 0) and sigma_inplane 0.250 LJ (finite) under growth loading at 40 rods"
  - name: r2-turnover-sweep
    base_model: viva_lumenoid.composites.stage2_sweep
    status: completed
    provenance: "coordinating session (120-rod moderate network, off_rate sweep)"
    outcomes:
      tau-resolved-only-at-slow-turnover:
        result: PASS
        observed: "residence 100 -> tau 57.7 LJ (resolved); residence 50 and 25 -> tau NaN (noise-limited); modulus 0.946 LJ, 126 crosslinks in all three"

readouts:
  - name: n_crosslinks
    description: Number of NC1/7S crosslink bonds (total bonds minus intra-rod); confirms the network assembles.
    store_path: "n_crosslinks"
    units: count
    status: measured
  - name: sigma_inplane
    description: Bond-virial in-plane stress = -0.5*(pxx+pyy) scaled by volume; the rheology readout.
    store_path: "sigma_inplane"
    units: kT/sigma^3 (LJ)
    status: measured
  - name: relaxation_time_lj
    description: Exponential stress-relaxation time tau fit from the stress trace; NaN when below the noise floor.
    store_path: "sigma_inplane"
    units: LJ time
    status: noise-limited
  - name: elastic_modulus_lj
    description: Tangent modulus of the network under growth loading (reduced units).
    store_path: "sigma_inplane"
    units: kT/sigma^3 (LJ)
    status: measured

behavior_tests:
  - name: network-forms-and-stresses
    classification: primary
    description: >
      Under growth rheology the collagen IV composite assembles a crosslinked network
      (n_crosslinks > 0) and reports a finite in-plane stress (sigma_inplane) -- the prerequisite
      that the real outputs this study reads are actually emitted.
    measure: {kind: count_and_finiteness, fields: [n_crosslinks, sigma_inplane]}
    pass_if: {op: gt_and_finite, note: "n_crosslinks > 0 AND sigma_inplane finite"}
    units: count / LJ
    requires_simulation: r2-growth-smoke
    cites: [meadowcroft2025nonequilibrium]
    calibration_anchor:
      observed_value: 5
      literature_target: "a crosslinked, stress-bearing network assembles (not a floppy gas of rods)"
      resolution: concept
      cites: [meadowcroft2025nonequilibrium]
  - name: tau-resolved-only-at-slow-turnover
    classification: primary
    description: >
      The stress-relaxation time tau is resolvable at the slowest turnover (residence 100 ->
      tau ~= 57.7 LJ) but falls below the noise floor at faster turnover (residence 50 and 25 ->
      tau = NaN) at this 120-rod network size -- a partial Fig-2E (right direction, slope not yet
      established).
    measure: {kind: relaxation_time, field: sigma_inplane, versus: residence_time, over: off_rate}
    pass_if: {op: resolvable_only_at_slow, note: "tau finite at residence 100; NaN at residence 50/25"}
    units: LJ time
    requires_simulation: r2-turnover-sweep
    cites: [barrientos2026basement]
    calibration_anchor:
      observed_value: 57.7
      literature_target: "tau increasing with collagen residence time (Fig 2E slope)"
      resolution: thresholds
      cites: [barrientos2026basement]

falsifiability: >
  The claim would be overturned if the faithful network did NOT assemble or carried no finite
  stress under growth loading (n_crosslinks == 0 or non-finite sigma_inplane), or if tau were
  NOT resolvable even at the slowest turnover, or if faster turnover gave a LONGER resolvable
  tau than slow turnover (an inverted Fig-2E direction). Any of these would show the network
  does not reproduce the stress-relaxation-vs-residence behavior. The locking contract in
  tests/test_stage2_and_viz.py (network assembles, finite stress) would fail in that case.

conclusion_logic:
  if_primary_tests_pass:
    implementation_status: "The collagen IV network runs end-to-end under growth loading and emits the crosslink + stress readouts."
    biological_validation: "Partial Fig-2E: tau resolvable at slow turnover; the full tau-vs-residence slope is not yet established at this network size."
    pipeline_unblocks:
      - "R3 supply-mode study -- this is the molecular-scale rheology reference it builds on."
  if_primary_tests_fail:
    diagnose:
      - "Network under-percolated -- raise n_rods / assemble length / bending_k."
      - "Stress noise-dominated -- larger network or a seed ensemble to pull tau above the noise floor."
      - "Relaxation fit unstable -- lengthen the hold window (>= several tau)."
    block_downstream: "Do not treat the Fig-2E slope as reproduced until tau resolves across the full turnover range on a denser multi-seed run."

limitations:
  - "PARTIAL Fig-2E: tau is resolvable only at the slowest turnover (residence 100); residence 50 and 25 are below the noise floor at 120 rods, so the full tau-proportional-to-residence SLOPE is NOT established."
  - "The turnover sweep is a SINGLE seed; run-to-run variance is not characterised -- a robustness claim needs several seeds."
  - "Reduced (LJ) units: tau in LJ time, modulus in kT/sigma^3; no calibration to hours / pascals is claimed."
  - "The bounded smoke run (40 rods, this session) only confirms the outputs are emitted and the network assembles; it does not itself resolve tau."
  - "tau = NaN is a noise-floor non-resolution, not a zero relaxation time."

visualizations:
  - name: r2_rheology
    address: "html:r2_rheology.html"
    config:
      title: "Collagen network assembly + stress (small real run)"
      caption: >
        A small REAL collagen IV run: the NC1/7S network assembles and carries in-plane stress. Full Fig 2D/2E reproduction (relaxation vs turnover rate) is the study target.

report:
  title: "R2 -- collagen IV network rheology (partial Fig-2E)"
  verdict: >
    The faithful collagen IV network assembles and carries finite in-plane stress under growth
    loading on real LAMMPS (confirmed by a bounded smoke run: 5 crosslinks, sigma_inplane 0.250
    LJ at 40 rods). In the coordinating session's moderate turnover sweep (120 rods), the
    stress-relaxation time is resolvable only at the slowest turnover (residence 100 -> tau 57.7
    LJ); residence 50 and 25 fall below the noise floor (tau NaN), with the same stiff network
    (modulus 0.946 LJ, 126 crosslinks) throughout. This is a PARTIAL Figure 2E -- the direction
    is right but the full tau-vs-residence slope needs a denser, larger, multi-seed network.
  confidence: medium
  evidence_quality: preliminary
  main_insight: >
    At this network size the relaxation time tau carries a noise floor: it is resolvable only at
    slow turnover (long collagen residence). The Fig-2E proportionality is directionally present
    but size/noise-limited.
  caveat: >
    Single-seed moderate network; tau resolvable only at residence 100; reduced units only.
    The full slope is a denser multi-seed follow-up (a Mac-mini scale-up candidate).
  key_metrics:
    - {label: "tau @ residence 100", value: "57.7 LJ (resolved)", status: pass}
    - {label: "tau @ residence 50 / 25", value: "NaN (noise-limited)", status: warn}
    - {label: "elastic modulus", value: "0.946 LJ", status: info}
    - {label: "crosslinks (sweep)", value: 126, status: info}
    - {label: "smoke crosslinks @ 40 rods", value: 5, status: pass}

findings:
  - id: F1-partial-fig2e-tau-noise-floor
    kind: biological
    status: partial
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      The collagen IV network reproduces Figure 2E only partially: the stress-relaxation time tau
      is resolvable at slow turnover (residence 100 -> tau 57.7 LJ) but below the noise floor at
      faster turnover (residence 50 and 25 -> NaN) at a 120-rod network size. The direction of
      the Fig-2E relationship is present, but the full tau-proportional-to-residence slope is not
      yet established.
    evidence:
      from_run: r2-turnover-sweep
      from_test: tau-resolved-only-at-slow-turnover
      observed: "tau 57.7 LJ (residence 100) vs NaN (residence 50/25); modulus 0.946 LJ, 126 crosslinks in all three"
    expected:
      cites: [barrientos2026basement]
      range: "tau increasing with collagen residence time (Fig 2E)"
    explanation: >
      The relaxable stress is small relative to the run-to-run noise at this network size, so tau
      only clears the noise floor when turnover is slow enough to leave a long, clean relaxation.
      A denser / larger network (and several seeds) would lower the noise floor and expose the
      full slope.
    next_action: "scale up to a dense multi-seed network to resolve tau across the full turnover range"
    next_action_type: replicate
    provenance:
      run_ids: [r2-turnover-sweep]
      random_seeds: [1]
    cites: [barrientos2026basement]
  - id: F2-network-assembles-and-stresses
    kind: computational
    status: confirms
    tier: observation
    mechanism_origin: engineered
    statement: >
      The collagen IV composite (viva_lumenoid.composites.stage2_sweep / CollagenNetworkProcess)
      emits the real outputs this study reads: under growth loading a bounded smoke run forms a
      crosslinked network (n_crosslinks 5 at 40 rods) and reports a finite in-plane stress
      (sigma_inplane 0.250 LJ). The emitter and mechanism direction are confirmed, not assumed.
    evidence:
      from_run: r2-growth-smoke
      from_test: network-forms-and-stresses
      observed: "n_crosslinks 5 (> 0), sigma_inplane 0.250 LJ (finite); verified in this session"
    explanation: "Confirms the sigma_inplane and n_crosslinks readouts the turnover sweep relies on are genuinely emitted by the composite."
    provenance:
      run_ids: [r2-growth-smoke]
    cites: [meadowcroft2025nonequilibrium]

followup_proposals:
  - id: fp-r2-dense-multiseed
    title: "Dense multi-seed network to resolve tau across the full turnover range"
    motivation: >
      At 120 rods, single seed, tau is resolvable only at the slowest turnover (residence 100);
      residence 50 and 25 sit below the noise floor. Scaling up to the authors' dense
      configuration and running several seeds should lower the noise floor and expose the full
      tau-proportional-to-residence slope -- the quantitative Fig-2E criterion.
    hypothesized_mechanism: >
      A denser, larger network carries a larger relaxable stress and averages out run-to-run
      noise across seeds, pulling tau above the noise floor at every turnover rate.
    status: proposed
  - id: fp-r2-energy-scale-calibration
    title: "Calibrate tau to the ~20 h collagen IV lifetime (LJ time -> hours)"
    motivation: >
      tau is reported in LJ time. Mapping it to the ~20 h collagen IV residence time sets the
      time unit and lets the relaxation time be reported in physical units.
    status: proposed

discovery_implications:
  resolved_uncertainties:
    - "The faithful collagen IV network does assemble and carry finite stress under growth loading (outputs confirmed by a smoke run)."
    - "A relaxation time tau is resolvable at slow turnover (residence 100 -> 57.7 LJ)."
  remaining_uncertainties:
    - "The full tau-proportional-to-residence SLOPE (Fig 2E) -- not established while tau is below noise at residence 50/25."
    - "Run-to-run variance -- single seed only."
    - "Absolute tau in hours / modulus in pascals -- reduced units only."
  followup_study_proposals:
    - {id: fp-r2-dense-multiseed, title: "Dense multi-seed network for the full Fig-2E slope"}

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: "The stage2_sweep composite is registered and runs cleanly; the bounded smoke run and the locking contract in tests/test_stage2_and_viz.py pass (network assembles, finite stress)."
  biological_validation:
    result: MIXED
    basis: >
      Partial Fig-2E: tau resolvable at slow turnover (residence 100 -> 57.7 LJ) and in the
      right direction, but the full tau-vs-residence slope is not established at this network
      size (residence 50/25 below the noise floor, single seed).
  explanatory_gain:
    result: POSITIVE
    basis: >
      Identifies a size/noise floor on the relaxation time: tau is only resolvable at slow
      turnover on a 120-rod network, which tells the follow-up exactly what to scale (density,
      size, seeds) to recover the full Fig-2E slope.

expert_review_status: requested
expert_questions:
  - "Network size: what density / slab thickness / seed count is needed to pull tau above the noise floor at the fast-turnover end (residence 25) so the full Fig-2E slope can be fit?"
  - "Calibration: should tau be reported in LJ time or calibrated to the ~20 h collagen IV residence time (which also sets the off_rate -> residence mapping) before the slope is claimed?"

bibliography:
  sources:
    - key: barrientos2026cellshape
      note: "Barrientos et al. cell-shape paper; Figure 2D-E (stress traces + relaxation-vs-turnover) is the reproduction target."
    - key: barrientos2026basement
      note: "Basement-membrane growth at fixed stress; the collagen residence time (~20 h) calibrates the turnover off_rate."
    - key: meadowcroft2025nonequilibrium
      note: "Nonequilibrium collagen IV network; the two-bead-rod + stochastic-crosslink model the composite is built from."
