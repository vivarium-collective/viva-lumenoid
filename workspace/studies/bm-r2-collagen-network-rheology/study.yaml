      tier: supplement
      caption: >
        A small 40-rod LAMMPS smoke test confirms that bonds form and the simulated network reports finite in-plane stress (network bond-virial, reduced LJ units); it does not establish the lifetime–relaxation law — that is the primary figure above. Methods/verification only.

report:
  title: "R2 -- collagen IV network rheology (Fig-2E direction reproduced)"
  verdict: >
    The faithful collagen IV network assembles and carries finite in-plane stress under growth
    loading on real LAMMPS. On the dense, multi-seed network (300 rods, authors' density 3.0,
    12-sigma slab, 4 seeds) the stress-relaxation time tau is resolved across the full turnover
    range and rises monotonically with collagen residence time -- 37.3 LJ at residence 12.5 up to
    101.6 LJ at residence 200 -- reproducing the DIRECTION of Figure 2E, while the elastic modulus
    stays turnover-independent (3.19 LJ). The earlier 120-rod sweep resolved tau only at residence
    100 (57.7 LJ); the dense multi-seed run lowers the noise floor and exposes the whole trend.
    Scoped honestly: the relationship is an intrinsic relaxation floor (~37 LJ) plus a
    residence-dominated regime above residence ~50, not a single proportional slope; reduced units.
  confidence: medium
  evidence_quality: demonstrated
  main_insight: >
    tau has two regimes: at fast turnover it is pinned to the network's intrinsic viscoelastic
    relaxation (~37 LJ floor); at slow turnover (long residence) it is set by the crosslink
    residence time. The crossover is near residence ~50. This is the Fig-2E direction, resolved
    across the full range on a dense multi-seed network.
  caveat: >
    Direction, not a single proportional slope (floor + residence regimes); residence 200 resolved
    at only 1/4 seeds (relaxation nears the hold window); reduced (LJ) units, no hours/pascals.
  key_metrics:
    - {label: "tau trend (residence 12.5->200)", value: "37.3 -> 101.6 LJ (monotonic)", status: pass}
    - {label: "tau resolved (dense, <= res 100)", value: "4/4 seeds", status: pass}
    - {label: "elastic modulus (turnover-indep)", value: "3.19 LJ", status: info}
    - {label: "tau @ residence 100 (dense)", value: "67.5 LJ", status: pass}
    - {label: "earlier 120-rod @ residence 100", value: "57.7 LJ (only point resolved)", status: info}

findings:
  - id: F1-fig2e-direction-resolved-dense
    kind: biological
    status: confirms
    tier: interpretation
    mechanism_origin: engineered
    statement: >
      On the dense, multi-seed network (300 rods, density 3.0, 12-sigma slab, 4 seeds) the
      stress-relaxation time tau rises monotonically with collagen residence time -- 37.3 LJ at
      residence 12.5, 39.7 at 25, 43.1 at 50, 67.5 at 100, 101.6 at 200 -- reproducing the
      DIRECTION of Figure 2E across the full turnover range, while the elastic modulus stays
      turnover-independent (3.19 LJ). The relationship is an intrinsic relaxation floor (~37 LJ)
      at fast turnover plus a residence-dominated regime above residence ~50, not a single
      proportional slope. This resolves the 120-rod noise floor that had limited the earlier sweep
      to a single point (residence 100 -> 57.7 LJ).
    evidence:
      from_run: r2-dense-multiseed-sweep
      from_test: tau-rises-with-residence-resolved
      observed: "median tau 37.3/39.7/43.1/67.5/101.6 LJ at residence 12.5/25/50/100/200; 4/4 seeds up to residence 100; modulus 3.19 LJ (turnover-independent)"
    expected:
      cites: [barrientos2026cellshape]
      range: "tau increasing with collagen residence time (Fig 2E)"
    explanation: >
      A denser network carries a larger relaxable stress and 4 seeds average out run-to-run noise,
      pulling tau above the noise floor at every turnover rate. The emergent two-regime structure
      (intrinsic floor + residence-dominated) is the honest refinement of a naive proportionality.
    next_action: "calibrate tau to the ~20 h collagen IV lifetime (LJ time -> hours) to report the slope in physical units"
    next_action_type: extend
    provenance:
      run_ids: [r2-dense-multiseed-sweep]
      random_seeds: [11, 22, 33, 44]
    cites: [barrientos2026cellshape, barrientos2026basement]
  - id: F2-network-assembles-and-stresses
    kind: computational
    status: confirms
    tier: observation
    mechanism_origin: engineered
    statement: >
      The collagen IV composite (viva_lumenoid.composites.stage2_sweep / CollagenNetworkProcess)
      emits the real outputs this study reads: under growth loading a bounded smoke run forms a
      crosslinked network (n_crosslinks 5 at 40 rods) and reports a finite in-plane stress
      (sigma_inplane 0.250 LJ). The emitter and mechanism direction are confirmed, not assumed.
    evidence:
      from_run: r2-growth-smoke
      from_test: network-forms-and-stresses
      observed: "n_crosslinks 5 (> 0), sigma_inplane 0.250 LJ (finite); verified in this session"
    explanation: "Confirms the sigma_inplane and n_crosslinks readouts the turnover sweep relies on are genuinely emitted by the composite."
    provenance:
      run_ids: [r2-growth-smoke]
    cites: [meadowcroft2025nonequilibrium]

followup_proposals:
  - id: fp-r2-dense-multiseed
    title: "Dense multi-seed network to resolve tau across the full turnover range"
    motivation: >
      At 120 rods, single seed, tau is resolvable only at the slowest turnover (residence 100);
      residence 50 and 25 sit below the noise floor. Scaling up to the authors' dense
      configuration and running several seeds should lower the noise floor and expose the full
      tau-proportional-to-residence slope -- the quantitative Fig-2E criterion.
    hypothesized_mechanism: >
      A denser, larger network carries a larger relaxable stress and averages out run-to-run
