      title: "Confinement regimes — cell height vs BM stiffness × relaxation (Fig 1G reproduction)"
      caption: >
        Cell height across basement-membrane stiffness and relaxation time (relative to the doubling time), reproducing the paper's Figure 1G. The confinement regimes appear: cells are tall where the membrane is stiff and slow to relax, and flat where it is soft or fast.
