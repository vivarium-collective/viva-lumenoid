cites: [barrientos2026cellshape]

expected_behavior:
  - name: tissue-regimes-match-fig1g
    observable: basal-area / reconstructed-height regime map
    condition: stiffness x relaxation/doubling sweep
    rationale: >
      Recovering Fig 1G's qualitative regime topology and 1H-J trajectories (within documented
      numerical tolerances) is the gating success criterion for P1.

baseline:
  - name: bm-r1-published-tissue-baseline
    composite: viva_lumenoid.composites.tissue_prism_baseline
    composite_status: implemented
    params: {}
    note: >
      A homogeneous tissue model: one representative cell of fixed volume whose
      basal area is set by proliferation pulling against a viscoelastic basement
      membrane, with cell height following from volume over area. The four
      confinement regimes of the paper's Figure 1 fall out of how membrane
      stiffness compares with its relaxation time and the cell doubling time — a
      stiff, slowly-relaxing membrane confines the cell into a tall shape, while a
      soft or fast-relaxing one lets it spread flat. This is the simple reference
      the spatial epithelial models are compared against.
