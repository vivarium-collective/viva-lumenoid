schema_version: 3
name: bm-r1-published-tissue-baseline
status: in-progress
title: "Reduced-order tissue-mechanics baseline"
kind: reproduction
phase: Build
confidence: Investigating
claim: >
  The homogeneous prism model recovers the four confinement regimes: cells grow tall under a stiff, slowly-relaxing membrane and spread under a soft, fast-relaxing one.
question: >
  How do basement-membrane stiffness and relaxation, relative to the proliferation (doubling)
  time, control growth-dependent epithelial confinement?

hypothesis: >
  Reimplementing the paper's fixed-volume prism / surface-tension tissue model with a
  viscoelastic BM reproduces Figure 1G's four stiffness-relaxation regimes and the 1H-J
  confinement trajectories, with the regime boundary set by the ratio of BM relaxation time to
  doubling time.

objective: >
  Reimplement the paper's fixed-volume prism/surface-tension tissue model and viscoelastic BM;
  sweep relative stiffness and the relaxation/doubling-time ratio; compare qualitatively and
  quantitatively to Barrientos et al. Figure 1G-J.

description: |
  Direct reproduction of the paper's homogeneous tissue-mechanics result (Barrientos Fig 1). A
  fixed-volume prism/surface-tension cell model is coupled to a viscoelastic BM; the relative
  BM stiffness and the relaxation/doubling-time ratio are swept to recover the regime topology
  (reconstructed basal area and cell height, reversibility, regime boundaries). This is the P1
  homogeneous reference the spatial Tyssue studies (R4-R5) are later compared against; it uses
  an effective constitutive BM, not the explicit collagen network.

