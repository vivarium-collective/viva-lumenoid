schema_version: 2
name: basement-membrane-v1
title: "From collagen IV turnover to multiscale epithelial morphogenesis (BM v1 → lumenoid)"
created: "2026-09-30"
status: running
lead: eran

question: >
  How does collagen IV molecular turnover set basement-membrane (BM) stress
  relaxation, and how do BM mechanics, epithelial growth and actomyosin mechanics
  jointly determine epithelial cell height and lumenoid morphology? (The original
  v1 sub-question — the effective modulus E(ε̇) and remodelling time τ(ε̇) a growing
  boundary produces, the two numbers the AICS vertex model couples to — is the
  P0/P1 reproduction core this campaign now builds on.)

hypothesis: >
  Molecular collagen IV turnover sets the BM's viscoelastic relaxation time, and
  that relaxation — relative to the epithelial doubling time — controls growth-
  dependent cell confinement (Barrientos et al., Cell 2026). Replacing homogeneous
  tissue mechanics with spatially-resolved 2D/3D Tyssue epithelia, bidirectional
  LAMMPS–Tyssue coupling and explicit actomyosin should connect these quantities
  through forces rather than imposed constitutive assumptions, and predict when
  growth rate, BM supply, contractility and curvature change cell height and
  lumenoid growth beyond the paper.
  ---
  Reproduction core (P0/P1): a standalone collagen IV network, coarse-grained at
  the fiber scale (one protomer = one two-bead rod, stochastic NC1/7S crosslinks,
  no excluded volume), reproduces the Meadowcroft/Barrientos regime — a very soft
  elastic modulus (≈0.03 Pa published) and a crosslink-turnover-limited relaxation
  time calibratable to the ≈20 h collagen IV lifetime — and its E(ε̇)/τ(ε̇) feed the
  vertex model (offline coupling first).

description: |
  This investigation is the clean-room Vivarium build of the AICS-Lumenoids
  "Basement membrane — v1 model specification" (Roam graph, exported 2026-09-30;
  the source spec and diagram are in `workspace/references/`). Every model
  parameter is transcribed from the spec's parameter sheet and labelled as such.
  The authors' LAMMPS input scripts are now public
  (github.com/Billie1717/BasementMembraneTurnoverSims, Zenodo
  10.5281/zenodo.20719515, commit `ab4c004`); this build remains a transcription
  from the spec rather than a port of those scripts, and they are the ground
  truth to cross-check its parameters against (not yet done — decision below).

  **Engines.** The workspace imports two already-wrapped simulators —
  `viva-lammps` (the `LAMMPSProcess` bridge) and `viva-smoldyn` — and builds the
  collagen IV network on top of the real LAMMPS engine. LAMMPS runs stages 1–2
  (rigid rods, junction flexibility); Smoldyn is held for stage 3 (flexible
  fibers + surface binders) per spec decision #2.

  **Staged build.**
    - Stage 1 — reproduce the paper; separate elastic from viscous. Stretch,
      hold, then switch the crosslink chemistry on. Reports an elastic modulus
      and a stress-relaxation time.  ← this investigation's first study.
    - Stage 2 — growing substrate (flat): impose equibiaxial strain rate ε̇,
      read off σ(ε̇); an effective viscosity η = σ/ε̇ and the rate at which the
      response turns elastic.
    - Stage 3 — add the cell–BM linker (surface-attached springs, constant
      off-rate). Smoldyn's surface binders land here.
    - Stage 4 — curvature (only if stages 2–3 depend on R beyond ε̇ = Ṙ/R).

  **Coupling route.** Offline first: tabulate the BM's modulus
  and remodelling time against growth rate and hand them to the vertex model.
  Then direct: vertex-mesh surface velocities drive the BM substrate, BM stress
  feeds back, exchanged every N vertex steps.

  **Visualization (reviewer round 1, 2026-10-07).** Each study's Simularium
  trajectory now embeds its diagnostic plots directly (stress-vs-strain, the
  stress/strain time series, crosslinks) and draws the periodic simulation box
  as a per-frame outline that deforms with the imposed strain. The stretch
  movies are made coherent (each bead at its nearest periodic image of the
  network centroid), so boundary crossings no longer teleport across timepoints.
  See `feedback/` for the imported reviewer file.

  **From membrane reproduction to multiscale morphogenesis.** With Barrientos et al.
  ("Basement membrane turnover controls cell shape", Cell 2026, 189:5611–5624) now
  published, this investigation has grown from producing the two numbers a vertex
  model needs into a staged reproduction-and-extension study. The plan is to first
  reproduce the published tissue and collagen-network results quantitatively, then
  replace homogeneous tissue mechanics with spatial 2D and 3D epithelial models
  coupled both ways to the membrane, and finally add an explicit actomyosin cortex
  and a closed lumenoid geometry. Reproductions, verification, and new predictions
  are reported separately.

  **Coupling hierarchy.** The epithelium is modelled at increasing spatial detail:
  a 2D planar sheet (with a membrane traction/area law and height from a prism
  relation), a height-resolving 2D cross-section, a 3D monolayer with apical, basal
  and lateral surfaces and volume constraints, and a closed 3D lumenoid with lumen
  volume and pressure and a membrane shell. The mechanical contract is the same at
  every level: the epithelial basal geometry drives the membrane, and the membrane
  returns reaction forces to the basal degrees of freedom. An effective constitutive
  membrane and an explicit collagen membrane are interchangeable alternatives, never
  summed.

  **How the work is staged.** The reproduction core is settled first — retire the
  superseded membrane claims, freeze the faithful reference settings, and establish
  reproducible stress tests. Then comes the direct numerical reproduction of the
  paper's tissue and collagen-network figures, then verified 2D and 3D epithelial
  studies that establish the cell-height and area response, then bidirectional
  coupling with convergence and agreement between the explicit and reduced-order
  membranes, and finally the actomyosin cortex, the closed lumenoid, and the new
  predictive perturbations. The original collagen-network studies are that
  reproduction core; one is kept as a central-force counterfactual, and the native
  junction angles of another fold into the faithful reference rather than counting
  as a new ingredient. The earlier idea that the network is soft because junction
  angles are absent is retired by the cross-check against the released code.

  **Engine note.** The downstream epithelial vertex model is `vivarium-tyssue`,
  imported into the workspace as an optional dev sibling engine (R4–R6, E3–E4 build
  on it). The collagen/actin LAMMPS processes run on `viva-lammps`.

  **Driving schema.** The campaign is framed by the Barrientos et al. three-model
  chain — collagen IV turnover (timer) → BM relaxation (network) → cell shape
  (tissue mechanics) — reproduced as `viz/driving_schema.html` and mapped to our
  studies: R6 realizes the timer/turnover model, R2/R3 the collagen network, and
  R1/R4/R5 the tissue mechanics.

meeting_alignment_2026_10_20:
  disposition: revise
  central_pivot: >
    The 2026-10-20 modeling review (Eran/Tasnif/Saurabh) refocuses the first deliverable on
    the simplest TWO-WAY feedback experiment: increase the PREFERRED (target) epithelial
    area/volume — NOT realized area — let cells mechanically deform the BM, let the BM reaction
    feed back on the cells, and MEASURE the realized expansion and cell height. Realized
    geometry emerges from the mechanics and lags the preferred target under BM resistance; that
    lag IS the confinement, and it is never hard-coded to the target. Growth is distinct from
    cell DIVISION — the MVP grows a preferred geometry with proliferation OFF; the paper's
    proliferation is a separate faithful-reproduction extension.
  staging:
  - "2D (planar / cross-section) complete cell<->BM feedback  — R4"
  - "true 3D monolayer                                        — R5"
  - "already-closed 3D lumen (geometry vs model-side elasticity kept separate) — E3/E4"
  prioritized_dependencies:
  - "1. preferred area/volume growth with proliferation OFF (R4 2D, R5 3D, E4 coupling) — DONE this revision"
  - "2. constitutive BM coupling controls (no-BM / soft / stiff / fast-relax / slow-relax)"
  - "3. resolved LAMMPS force transfer (explicit-BM path — the separate verification gate, E4)"
  - "4. 3D monolayer (R5)"
  - "5. closed lumen geometry + separate volume elasticity (E3)"
  - "6. pressure / osmosis / curvature / non-uniform BM thickness (follow-on branches, NOT prerequisites)"
  engine_vs_reproduction: >
    Engine/smoke-test success is marked SEPARATELY from scientific reproduction throughout: a
    mesh that resolves or a geometry that renders is engineered-diagnostic, not a biological
    result. Explicit actin (E1), osmosis, spatial BM thickness and pressure are follow-on
    branches, not milestone dependencies.
  this_revision: >
    Propagated the existing preferred->realized->BM-reaction mechanism (previously only in the
    0-D R1/R6 prism) into the spatial/coupled studies: R4 (2D cross-section coupled growth), R5
    (real-Tyssue 3D monolayer growth), E4 (growth-driven two-way coupling). Added a shared
    growth primitive (PreferredGrowth + ReducedBM), new observed main figures, and per-study
    6-axis model-assumptions declarations (preferred-vs-realized, load-vs-reaction, dimension,
    explicit-vs-reduced material, growth-vs-division, calibration limits).

# Investigation-level driving figure (the three-model framework).
visualizations:
- name: driving_schema
  address: "html:viz/driving_schema.html"
  config:
    title: "Driving schema — collagen IV turnover → BM relaxation → cell shape"
    caption: >
      The three-model framework from Barrientos et al. (Cell 2026), mapped to
      this campaign's studies. The collagen timer sets how fast collagen turns
      over; the collagen network makes membrane relaxation track that turnover;
      and the tissue-mechanics model makes cell shape follow membrane relaxation.

- name: coupling_contract
  address: html:viz/coupling_contract.html
  config:
    title: The coupling contract — BM↔epithelium as wiring, and where R4/R5/E4 stand
    caption: >
      The reviewer's central ask made into one picture. (1) The contract: express the BM↔epithelium interface as process-bigraph wiring — the BM as an energy on each basal face inside the vertex force balance, exchanging a slow rest-area/stiffness state rather than a stiff force, reducing to R1's prism law in the homogeneous limit. (2) The four controls (no-BM / one-way / two-way / uncoupled) are wiring edges, not parameters. (3) Where R4/R5/E4 actually are today: engine-and-wiring checks, because none expresses that edge yet (R4 = 12 independent per-cell Maxwell ODEs; R5 = one scalar Maxwell on the mean basal area; E4 = both engines inside one Process).
- name: reference_bm_state
  address: html:viz/reference_bm_state.html
  config:
    title: One reference BM state — the reported moduli are one model at different states
    caption: >
      Answers the exec-summary critique that the modulus appears as six inconsistent values. They are the SAME model at different crosslink/density states, not a six-way disagreement: pin the dense angle-stabilized reference (E ≈ 6 Pa, τ ≈ 40–60 reduced, with seed CIs from R2) and propagate it. The absolute pascal scale (≈2.2 Pa per kT/σ³) sets the BM:cell stiffness ratio that decides the regime, so it must be pinned before any confinement claim.
- name: regime_placement
  address: html:viz/regime_placement.html
  config:
    title: Which regime does the lumenoid sit in? Undetermined until the scale is pinned
    caption: >
      Places the reference BM on R1's confinement regime map under its scale uncertainty. The BM:cell stiffness ratio is one of R1's two axes, but the absolute scale is unpinned: Y = E·h is ≈1e-5 N/m at 6 Pa and ≈1e-4 N/m at 80 Pa, against a cortical tension of ≈1e-4–1e-3 N/m — so the reference lands in a band that spans the confinement boundary. Until the LJ↔tissue unit map pins E and τ, the regime is undetermined.
- name: validation_scorecard
  address: html:viz/validation_scorecard.html
  config:
    title: Make the acceptance tests mechanistic — several primary tests cannot fail
    caption: >
      The reviewer's validation section as a scorecard. Several primary tests cannot fail (R4 passes if height > 0; R5 passes on a 0.4% one-run difference; E4 checks ≠ 0 / = 0, not sign). Each is paired with the mechanistic test that would actually gate the claim: sign tests, effect size against seed/mesh/dt noise, a quasi-static free control, and the homogeneous limit reproducing R1 — plus recording run parameters for every simulation.
studies:
- bm-v2-stress-vs-strainrate
- bm-r1-published-tissue-baseline
- bm-r2-collagen-network-rheology
- bm-r3-network-expansion-supply
- bm-r4-coupled-2d-epithelium
- bm-r5-explicit-3d-confinement
- bm-r6-perlecan-growth-perturbations
- bm-e1-actomyosin-cortex
- bm-e2-actin-adhesion-collagen
- bm-e3-closed-3d-lumenoid
- bm-e4-feedback-predictions
at_a_glance:
- study: bm-v2-stress-vs-strainrate
  role: >
    Stage 2 growth-rate sweep (bounded-preliminary). At MATCHED strain the apparent
    stress σ(ε̇) is flat/overlapping across rates while crosslink density falls with
    rate — so the apparent rate-resistance is confounded by rate-dependent assembly
    time, NOT clean rate-stiffening. The earlier single-seed "≈7→11 Pa stiffening"
    claim is RETRACTED. A density-matched dense-multiseed run (resolving τ(ε̇) for a
    Deborah number) is the open mini candidate.
- study: bm-r1-published-tissue-baseline
  role: >
    Reimplements the paper's homogeneous tissue model — a fixed-volume cell
    against a viscoelastic membrane — and recovers the four confinement regimes by
    varying membrane stiffness and its relaxation time. The simple reference the
    spatial models are compared against.
- study: bm-r2-collagen-network-rheology
  role: >
    Drives the collagen network through the loading protocol at several turnover
    rates, fitting the stress-relaxation time τ independently of residence time. On
    a dense multi-seed network τ is resolved across the full range and rises with
    collagen residence time — the Figure-2E DIRECTION (a floor-plus-residence
    relationship, reduced units), with a turnover-independent modulus. Observed.
- study: bm-r3-network-expansion-supply
  role: >
    Compares no remodelling, remodelling without new collagen, and remodelling with
    material insertion from one starting state. Only combined turnover + supply
    grows a connected load-bearing network (crosslink-per-area and rod-count
    ordering with-insertion > without > none, 3/3 seeds) — the Figure-2B/C ordering.
- study: bm-r4-coupled-2d-epithelium
  role: >
    2D coupled growth (the meeting's #1 upgrade). A ramped PREFERRED basal area
    (division OFF) drives a REALIZED area that emerges and lags the target under a
    viscoelastic BM — a stiff/slow BM lags by a 0.317 gap (vs 0.116 free) and raises
    reconstructed height (0.70→0.91); zero growth gives no BM strain; a BM-stiffness
    gradient makes a spatial height gradient (0.76→0.91). Reduced-order 2D
    cross-section with fixed-volume height; qualitatively consistent with the paper's
    confinement direction, not calibrated. The resolved vertex-model sheet stays a
    static substrate at the engine level (named limitation).
- study: bm-r5-explicit-3d-confinement
  role: >
    3D monolayer growth (the geometric upgrade after R4). Preferred cell volume +
    basal area are ramped (division OFF) on the real 206-cell Tyssue monolayer; a
    stiff/slow BM reaction confines basal spreading (1.11 vs 1.20 free) while the
    realized volume lags the target (gap 0.27), and under the near-incompressible
    volume elasticity confinement drives volume into cell height (1.138 vs 1.133 free
    — directional). The full no-BM/elastic-BM/relaxing-BM control matrix + a
    relaxation sweep remain the calibration gap.
- study: bm-r6-perlecan-growth-perturbations
  role: >
    Carries an inferred collagen lifetime for control, perlecan gain/loss and
    growth-rate conditions through BM relaxation to cell shape, keeping inferred
    and predicted quantities separate. Reproduces Fig 7 — perlecan knockdown
    taller > control > overexpression shorter — after a review-caught correction of
    an inverted perlecan direction (overexpression shortens the collagen lifetime,
    per the paper). The growth-rate axis (faster growth → flatter) is also correct.
- study: bm-e1-actomyosin-cortex
  role: >
    Extension, engineering verification (not in the paper). A coarse LJ bead cortex
    shows effective tension rising monotonically with the attraction (well-depth)
    PROXY — relabelled honestly as a proxy, not biological myosin activity, with
    seed/size sensitivity. Gap: no explicit filaments/motors, and the LAMMPS model
    exposes no strain input, so force-strain curves are not producible yet.
- study: bm-e2-actin-adhesion-collagen
  role: >
    Extension, coupling unit-test. Occupancy-gated force transfer (traction =
    occupancy × tension; BM strain-rate = gain × traction) holds BY CONSTRUCTION —
    shown with a real zero-linker control (occupancy/traction → 0) and a bounded
    cortex→adhesion→BM smoke. Gap: force-conserving multiscale coupling and
    integrin mechanics are not established; it is a deterministic mapping, not
    emergent.
- study: bm-e3-closed-3d-lumenoid
  role: >
    Extension, geometry verification. A closed 78-cell Tyssue shell with a labelled
    basal BM-coupling surface and a single enclosed lumen (section cut + scale).
    Gap: no lumen-filling drive is wired (pressure 0 at rest), so lumen growth and
    BM-regulated morphogenesis are shown as flat/honest, untested.
- study: bm-e4-feedback-predictions
  role: >
    Growth-driven two-way feedback (the meeting's most-important follow-up). An
    epithelial PREFERRED growth trajectory is now wired (preferred cell volume + basal
    area ramped; division OFF), so basal displacement is growth-driven: the realized
    basal-area fold emerges and differs by coupling mode (two-way 1.006 vs
    one-way/uncoupled 0.767) while lagging the preferred target (1.150) — verified NOT
    hard-coded — and two-way returns a nonzero basal reaction tension absent in the
    controls. Reduced BM is the primary path; the explicit-LAMMPS BM stays a separate,
    numerically-delicate verification gate. Reduced units; magnitudes uncalibrated.

acceptance_criteria:
- study: bm-v2-stress-vs-strainrate
  behavior: >
    The ε̇ sweep runs and returns σ(ε̇) and an effective viscosity η per rate,
    with the viscous and elastic regimes identified at v1 parameters.
executive:
  what_is_this: >
    A coarse-grained model of the collagen IV basement membrane, built in Vivarium from the AICS lumenoid specification, grown into a reproduction and extension of Barrientos et al. (Cell 2026). The reproduction studies target the paper's Figures 1 (tissue-mechanics regimes), 2 (collagen rheology + supply) and 7 (perlecan/growth perturbations); the extension studies add spatial 2D/3D Tyssue epithelia, bidirectional LAMMPS–Tyssue coupling, an actomyosin cortex and a closed lumenoid. All studies now RUN end-to-end against their real composites and carry recorded evidence — but each is scoped honestly by evidence status (observed / reproduced / engineered-diagnostic / hypothesis / contradicted, per docs/figure-conventions.md), not scored as paper reproduction on a smoke test or a geometry screenshot. The membrane-build (the collagen-network studies, incl. V2) and the paper reproductions (R1 Fig 1 regime topology, R2 Fig 2E direction, R3 Fig 2B/C supply ordering, R6 Fig 7 perlecan ordering) are the strongest results; the spatial and extension studies are preliminary. R6 reproduces Fig 7 only after a review-caught fix: its perlecan direction had been inverted and was corrected against the paper. FOLLOWING the 2026-10-20 modeling review, the spatial/coupled studies were refocused on the agreed PREFERRED-vs-REALIZED two-way feedback: R4 (2D cross-section), R5 (3D monolayer) and E4 (coupling) now DRIVE a growing preferred geometry (division OFF) and MEASURE the emergent, lagging realized geometry + cell height under BM confinement — the realized geometry is verified not hard-coded to the target. These are demonstrated in reduced order / reduced units (qualitatively consistent with the paper's confinement direction), not calibrated reproductions; explicit-LAMMPS coupling remains a separate verification gate. See meeting_alignment_2026_10_20 for the full spine + staging.
  verdict: >-
    The membrane build reproduces the published collagen-IV model and, at one reference state, separates a finite elastic modulus from a stress-relaxation (remodelling) time. It does NOT yet give E and tau as functions of growth rate: the earlier rate-stiffening claim was retracted and tau(strain_rate) is unresolved (the V2 stress-vs-strain-rate study is retained to settle that constitutive law, not yet closed). The single reference BM state the downstream (R1/R4/R5/E4/R6) studies should consume is the NC1/7S angle-stabilized network at the authors' dense geometry (3.0 rods/sigma^2, 12-sigma slab): E ~ 3 reduced units ~ 6 Pa and tau ~ 40-60 reduced time units, with seed CIs from R2. The report's other modulus figures (~0.03 Pa at the sparse/percolation state, up to ~8 Pa saturated, and the earlier V-series values) are different crosslink/density states, not disagreements; but the absolute pascal scale, and the BM:cell stiffness ratio it sets, must be pinned to this one reference and propagated before any confinement claim, because that ratio is one of R1's two regime axes and decides which regime the lumenoid sits in. (The pascal-scale convention is acceptable for a standalone material, but not once the BM is coupled to the epithelium.) --- The build was checked against the authors' published code and parameters corrected to match (two-bead rods, one NC1 and three 7S crosslinks per protomer, no excluded volume, kT = 1, dt = 0.01, break-to-make ratio 0.66, formation probability 0.12, rod stiffness 200; junctions stabilized by bending, NC1 angle stiffness 4.0 at 180 deg plus 7S angles at 155 and 60 deg). Creating those angles as crosslinks form removes the ill-conditioning: with angles active the modulus is finite, reproducible across seeds, and density-dependent (the earlier central-force below-rigidity-threshold explanation no longer holds); it climbs through the published ~0.03 Pa near percolation (~0.8 crosslinks/rod) and saturates near ~8 Pa, so the published softness is a sparse-crosslink state, not a gap in the model. --- Reproduction campaign (R1-R6). R1 recovers the four-regime confinement topology across the two dimensionless axes (BM stiffness; relaxation/doubling time). R2, on a dense multi-seed network, resolves the stress-relaxation time and reproduces the Figure-2E DIRECTION (tau rises with collagen residence time, ~37->102 reduced units over residence 12.5->200, at a turnover-independent modulus) as a floor-plus-residence relationship, not a single proportional slope. R3 reproduces the Figure-2B/C supply ordering (only combined crosslink turnover AND material insertion grows a connected load-bearing network, 3/3 seeds). R6 reproduces Figure 7 after a review-caught perlecan sign correction (perlecan promotes collagen-IV bond breakage, so overexpression shortens lifetime): knockdown taller > control > overexpression shorter, ~19% effect. These are the campaign's solid reproductions (direction/ordering, reduced units). --- The spatial (R4/R5) and extension (E1-E4) studies RUN but are engine-and-wiring checks, not confinement results or paper reproductions: the BM<->epithelium interface is not yet expressed as process-bigraph wiring, no tissue run consumes R2's E/tau (BM parameters are hand-set with no LJ<->tissue unit map), and the explicit path (E4) is numerically delicate. The coupling contract (see the synthesis-gaps review action and the coupling-contract decision) is the first dependency to settle before R4->R5->E4 are rebuilt and re-reported as confinement results.
  verdict_status: in-progress
  decisions_needed:
  - "Growth as preferred-vs-realized (2026-10-20): RESOLVED in direction — the first deliverable is now the two-way experiment where a PREFERRED geometry grows (division OFF) and the realized geometry emerges/lags under BM reaction (R4/R5/E4). Open: calibrate the stiffness/relaxation vs preferred-growth-timescale mapping and run the full BM control matrix."
  - "Growth vs division (2026-10-20): RESOLVED for the MVP — growth is a preferred-geometry ramp with proliferation OFF; the paper's proliferation stays a separate faithful-reproduction extension. Confirm with the expert that no-division growth is the right MVP scope."
  - "Explicit-LAMMPS coupling as a separate gate (2026-10-20): RESOLVED as policy — the explicit-BM path is a separate verification gate (numerically delicate, E4 F5), marked apart from the reduced-order primary results; stabilizing its subcycling is the open engineering item."
  - "Perlecan direction (R6): RESOLVED — verified against the paper (perlecan promotes collagen IV bond breakage; overexpression ~1 h, control ~20 h, knockdown ~500 h lifetime) and the perlecan_factor mapping was inverted so R6 reproduces Fig 7. Left here as a sanity-check item for the expert to confirm the reading."
  - "Lumen geometry vs model-side elasticity (2026-10-20): keep the new lumen geometry/volume (a geometry class computing enclosed volume) SEPARATE from model-side lumen elasticity/pressure; start E3/E4 from an already-closed lumen (no nucleation). Osmotic water-pumping is a later branch."
  - "Reproduction conventions: the article alone does not fix every convention needed to reproduce it. Acquire the supplemental tissue-model equations and the precise Figure 1 parameter values."
  - "Released turnover kinetics: pin down the grand-canonical monomer exchange, the distance-gated breaking, the 7S-specific mechanics, and the original stress-to-energy conversion before freezing the collagen reference."
  - "Collagen supply law: a fixed concentration (for reproducing the paper) or a secretion flux (for the lumenoid hypothesis). Decide per study."
  - "3D calibration data: obtain lumenoid geometry over time, cell height and volume, membrane thickness, and collagen-versus-laminin staining before calibrating the 3D models."
  - "Actin fidelity: use a validated reduced cortical model unless a molecularly-resolved actin cortex changes a measurable prediction. An explicit go/no-go call."
  - "Composite modularity: keep the collagen-network composites as thin selections over one general, parameterized network builder (chemistry, bending stiffness, density, and strain protocol as configuration), rather than near-duplicate generators."
  - "Absolute modulus in pascals: the angle-stabilized model reproduces the published ≈0.03 Pa and gives a reproducible modulus in reduced units (E ≈ 3 LJ). An exact value in pascals additionally needs the released monomer exchange, the distance-gated 7S break (0.95), and the dense starting configuration — or accept the reduced-unit value and settle the energy-scale choice below."
  - "Engine for the early stages: LAMMPS now, with Smoldyn revisited when surface binders are added."
  - "Energy scale: report the modulus in pascals (fit to a measured modulus) or keep kT units and report a ratio."
  - "Coupling contract: which vertex-model term receives the membrane — a basal tension, a mobility, or an elastic spring."
  - "Linker values: density, spring constant, and off-rate; sweep the off-rate as a multiple of the crosslink break rate."
  - "Growth rate: extract ε̇ from the lumenoid radius over time (still needed)."
  - "Slab thickness and layer count (one z-stack away)."
  - "Which readout calibrates and which validates: the remodelling time calibrates the formation probability and the time unit, so it cannot also validate."

  - >-
    Coupling contract FIRST (reviewer, 2026-11-09): before rebuilding R4->R5->E4, settle the BM<->epithelium contract. Proposal: model the BM as an energy on each basal face inside the vertex force balance (E_f = (K_BM/2)(A_f - A_f_rest)^2 / A_f_rest; tension T_f = K_BM (A_f - A_f_rest)/A_f_rest clipped >= 0 since a fibrous sheet buckles rather than holding compression; rest area relaxes on turnover, dA_f_rest/dt = (A_f - A_f_rest)/tau, optional supply term for R3). This reduces to R1's prism law in the homogeneous limit (so "R5/E4 reduce to R1" becomes a passable test) and gives force continuity via shared vertices (per-cell Maxwell elements, R4, cannot). Split by timescale: the fast elastic part lives as a tyssue effector in the vertex solver; the BM process evolves only the slow state (A_rest / K / tau), with analytic-Maxwell and LAMMPS-RVE realizations sharing one port schema. Express controls as wiring (no-BM = drop the bm process; one-way = drop bm->vertex; uncoupled = drop vertex->bm). Engine ask: vivarium-tyssue EulerSolver needs per-face parameter inputs and basal-surface outputs (fix CrossSectionGeometry not responding to prefered_area rather than replacing it with a 0D surrogate). Status: open design, gates R4/R5/E4.
glossary:
- term: protomer
  definition: One collagen IV triple-helical molecule (~376 nm end-to-end); modelled as one two-bead rod.
- term: NC1 / 7S
  definition: The two crosslinking ends of a protomer. NC1 binds one partner, 7S binds three.
- term: remodelling time
  definition: The viscous stress-relaxation time set by crosslink make/break kinetics; calibrated to the ≈20 h collagen IV lifetime.
- term: ε̇ (epsilon-dot)
  definition: Equibiaxial in-plane strain rate. A sphere of radius R growing at Ṙ stretches its shell at ε̇ = Ṙ/R.

