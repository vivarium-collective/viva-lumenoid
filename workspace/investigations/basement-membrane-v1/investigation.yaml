schema_version: 2
name: basement-membrane-v1
title: "From collagen IV turnover to multiscale epithelial morphogenesis (BM v1 → lumenoid)"
created: "2026-09-30"
status: running
lead: eran

question: >
  How does collagen IV molecular turnover set basement-membrane (BM) stress
  relaxation, and how do BM mechanics, epithelial growth and actomyosin mechanics
  jointly determine epithelial cell height and lumenoid morphology? (The original
  v1 sub-question — the effective modulus E(ε̇) and remodelling time τ(ε̇) a growing
  boundary produces, the two numbers the AICS vertex model couples to — is the
  P0/P1 reproduction core this campaign now builds on.)

hypothesis: >
  Molecular collagen IV turnover sets the BM's viscoelastic relaxation time, and
  that relaxation — relative to the epithelial doubling time — controls growth-
  dependent cell confinement (Barrientos et al., Cell 2026). Replacing homogeneous
  tissue mechanics with spatially-resolved 2D/3D Tyssue epithelia, bidirectional
  LAMMPS–Tyssue coupling and explicit actomyosin should connect these quantities
  through forces rather than imposed constitutive assumptions, and predict when
  growth rate, BM supply, contractility and curvature change cell height and
  lumenoid growth beyond the paper.
  ---
  Reproduction core (P0/P1): a standalone collagen IV network, coarse-grained at
  the fiber scale (one protomer = one two-bead rod, stochastic NC1/7S crosslinks,
  no excluded volume), reproduces the Meadowcroft/Barrientos regime — a very soft
  elastic modulus (≈0.03 Pa published) and a crosslink-turnover-limited relaxation
  time calibratable to the ≈20 h collagen IV lifetime — and its E(ε̇)/τ(ε̇) feed the
  vertex model (offline coupling first).

description: |
  This investigation is the clean-room Vivarium build of the AICS-Lumenoids
  "Basement membrane — v1 model specification" (Roam graph, exported 2026-09-30;
  the source spec and diagram are in `workspace/references/`). Every model
  parameter is transcribed from the spec's parameter sheet and labelled as such.
  The authors' LAMMPS input scripts are now public
  (github.com/Billie1717/BasementMembraneTurnoverSims, Zenodo
  10.5281/zenodo.20719515, commit `ab4c004`); this build remains a transcription
  from the spec rather than a port of those scripts, and they are the ground
  truth to cross-check its parameters against (not yet done — decision below).

  **Engines.** The workspace imports two already-wrapped simulators —
  `viva-lammps` (the `LAMMPSProcess` bridge) and `viva-smoldyn` — and builds the
  collagen IV network on top of the real LAMMPS engine. LAMMPS runs stages 1–2
  (rigid rods, junction flexibility); Smoldyn is held for stage 3 (flexible
  fibers + surface binders) per spec decision #2.

  **Staged build.**
    - Stage 1 — reproduce the paper; separate elastic from viscous. Stretch,
      hold, then switch the crosslink chemistry on. Reports an elastic modulus
      and a stress-relaxation time.  ← this investigation's first study.
    - Stage 2 — growing substrate (flat): impose equibiaxial strain rate ε̇,
      read off σ(ε̇); an effective viscosity η = σ/ε̇ and the rate at which the
      response turns elastic.
    - Stage 3 — add the cell–BM linker (surface-attached springs, constant
      off-rate). Smoldyn's surface binders land here.
    - Stage 4 — curvature (only if stages 2–3 depend on R beyond ε̇ = Ṙ/R).

  **Coupling route.** Offline first: tabulate the BM's modulus
  and remodelling time against growth rate and hand them to the vertex model.
  Then direct: vertex-mesh surface velocities drive the BM substrate, BM stress
  feeds back, exchanged every N vertex steps.

  **Visualization (reviewer round 1, 2026-10-07).** Each study's Simularium
  trajectory now embeds its diagnostic plots directly (stress-vs-strain, the
  stress/strain time series, crosslinks) and draws the periodic simulation box
  as a per-frame outline that deforms with the imposed strain. The stretch
  movies are made coherent (each bead at its nearest periodic image of the
  network centroid), so boundary crossings no longer teleport across timepoints.
  See `feedback/` for the imported reviewer file.

  **From membrane reproduction to multiscale morphogenesis.** With Barrientos et al.
  ("Basement membrane turnover controls cell shape", Cell 2026, 189:5611–5624) now
  published, this investigation has grown from producing the two numbers a vertex
  model needs into a staged reproduction-and-extension study. The plan is to first
  reproduce the published tissue and collagen-network results quantitatively, then
  replace homogeneous tissue mechanics with spatial 2D and 3D epithelial models
  coupled both ways to the membrane, and finally add an explicit actomyosin cortex
  and a closed lumenoid geometry. Reproductions, verification, and new predictions
  are reported separately.

  **Coupling hierarchy.** The epithelium is modelled at increasing spatial detail:
  a 2D planar sheet (with a membrane traction/area law and height from a prism
  relation), a height-resolving 2D cross-section, a 3D monolayer with apical, basal
  and lateral surfaces and volume constraints, and a closed 3D lumenoid with lumen
  volume and pressure and a membrane shell. The mechanical contract is the same at
  every level: the epithelial basal geometry drives the membrane, and the membrane
  returns reaction forces to the basal degrees of freedom. An effective constitutive
  membrane and an explicit collagen membrane are interchangeable alternatives, never
  summed.

  **How the work is staged.** The reproduction core is settled first — retire the
  superseded membrane claims, freeze the faithful reference settings, and establish
  reproducible stress tests. Then comes the direct numerical reproduction of the
  paper's tissue and collagen-network figures, then verified 2D and 3D epithelial
  studies that establish the cell-height and area response, then bidirectional
  coupling with convergence and agreement between the explicit and reduced-order
  membranes, and finally the actomyosin cortex, the closed lumenoid, and the new
  predictive perturbations. The original collagen-network studies are that
  reproduction core; one is kept as a central-force counterfactual, and the native
  junction angles of another fold into the faithful reference rather than counting
  as a new ingredient. The earlier idea that the network is soft because junction
  angles are absent is retired by the cross-check against the released code.

  **Engine note.** The downstream epithelial vertex model is `vivarium-tyssue`,
  imported into the workspace as an optional dev sibling engine (R4–R6, E3–E4 build
  on it). The collagen/actin LAMMPS processes run on `viva-lammps`.

  **Driving schema.** The campaign is framed by the Barrientos et al. three-model
  chain — collagen IV turnover (timer) → BM relaxation (network) → cell shape
  (tissue mechanics) — reproduced as `viz/driving_schema.html` and mapped to our
  studies: R6 realizes the timer/turnover model, R2/R3 the collagen network, and
  R1/R4/R5 the tissue mechanics.

# Investigation-level driving figure (the three-model framework).
visualizations:
  - name: driving_schema
    address: "html:viz/driving_schema.html"
    config:
      title: "Driving schema — collagen IV turnover → BM relaxation → cell shape"
      caption: >
        The three-model framework from Barrientos et al. (Cell 2026), mapped to
        this campaign's studies. The collagen timer sets how fast collagen turns
        over; the collagen network makes membrane relaxation track that turnover;
        and the tissue-mechanics model makes cell shape follow membrane relaxation.

studies:
  - bm-v1-stage1-modulus-remodelling
  - bm-v2-stress-vs-strainrate
  - bm-v3-junction-bending-rigidity
  - bm-v4-junction-bending
  - bm-v5-porosity-bundling
  # --- Reproduction campaign (Barrientos et al., Cell 2026) — gates P0→P2 ---
  - bm-r1-published-tissue-baseline
  - bm-r2-collagen-network-rheology
  - bm-r3-network-expansion-supply
  - bm-r4-coupled-2d-epithelium
  - bm-r5-explicit-3d-confinement
  - bm-r6-perlecan-growth-perturbations
  # --- Mechanistic extension campaign (new predictions) — gates P3→P4 ---
  - bm-e1-actomyosin-cortex
  - bm-e2-actin-adhesion-collagen
  - bm-e3-closed-3d-lumenoid
  - bm-e4-feedback-predictions

at_a_glance:
  - study: bm-v1-stage1-modulus-remodelling
    role: >
      Stage 1 membrane build. The staged protocol runs on real LAMMPS and the
      NC1-angle-stabilized network reports a finite elastic modulus (E ≈ 4.98 ± 2.15
      LJ, ≈11 ± 5 Pa, 3 seeds; energy-scale caveat). Scoped honestly as
      NC1-angle-stabilized, not a full reproduction — only the NC1 junction angle is
      implemented; the released 7S angles (155°/60°) and the 7S break cutoff are not.
      τ is unresolved at this bounded scale (dense-multiseed mini candidate).
      Diagnostics / modulus-ladder / movies demoted to supplement.
  - study: bm-v2-stress-vs-strainrate
    role: >
      Stage 2 growth-rate sweep (bounded-preliminary). At MATCHED strain the apparent
      stress σ(ε̇) is flat/overlapping across rates while crosslink density falls with
      rate — so the apparent rate-resistance is confounded by rate-dependent assembly
      time, NOT clean rate-stiffening. The earlier single-seed "≈7→11 Pa stiffening"
      claim is RETRACTED. A density-matched dense-multiseed run (resolving τ(ε̇) for a
      Deborah number) is the open mini candidate.
  - study: bm-v3-junction-bending-rigidity
    role: >
      Central-force negative control (engineered-diagnostic). With junction angles
      OFF, the athermal modulus vs measured connectivity z (1.17→1.61, never near 4)
      scatters about zero with CIs spanning 0 — not reproducibly positive, by design.
      This control shows central-force counting does NOT reproduce the released
      (angle-stabilized) network; the z=4 Maxwell line is an idealized 2D heuristic,
      not a threshold for this finite-thickness network.
  - study: bm-v4-junction-bending
    role: >
      The faithful-angles headline. Forming NC1 junction angles DURING assembly gives
      a positive, reproducible modulus (per-seed ≈36.7/27.6/37.5 kT/σ³, ≈61–83 Pa) —
      in contrast to the central-force control (≈0) and the ill-conditioned post-hoc
      restraint (sign-flipping). So bending-during-assembly is what stabilizes the
      released model's mechanics; connectivity remains a covariate. (Only the NC1
      angle is implemented; 7S angles are the stated gap. Reduced LJ modulus; Pa
      depends on the energy scale.)
  - study: bm-v5-porosity-bundling
    role: >
      Geometric readouts, two story-driven figures. Pore size (CDF + median vs areal
      coverage: 88→62→54 nm) reaches the corneal-EM band (72 ± 40 nm) at the densest
      condition — shown as a CROSS-SYSTEM reference, not validation for lumenoids. The
      NC1/7S-only topology under-bundles (mean 1.38 protomers/strand, 76% singletons,
      below the measured 5–7) because the released model has no explicit
      lateral-association bond — stated as a known shortfall. Evidence-map demoted.
  - study: bm-r1-published-tissue-baseline
    role: >
      Reimplements the paper's homogeneous tissue model — a fixed-volume cell
      against a viscoelastic membrane — and recovers the four confinement regimes by
      varying membrane stiffness and its relaxation time. The simple reference the
      spatial models are compared against.
  - study: bm-r2-collagen-network-rheology
    role: >
      Drives the collagen network through the loading protocol at several turnover
      rates, fitting the stress-relaxation time τ independently of residence time. On
      a dense multi-seed network τ is resolved across the full range and rises with
      collagen residence time — the Figure-2E DIRECTION (a floor-plus-residence
      relationship, reduced units), with a turnover-independent modulus. Observed.
  - study: bm-r3-network-expansion-supply
    role: >
      Compares no remodelling, remodelling without new collagen, and remodelling with
      material insertion from one starting state. Only combined turnover + supply
      grows a connected load-bearing network (crosslink-per-area and rod-count
      ordering with-insertion > without > none, 3/3 seeds) — the Figure-2B/C ordering.
  - study: bm-r4-coupled-2d-epithelium
    role: >
      Spatial 2D epithelium (preliminary). A 12-cell Tyssue sheet relaxes to a finite
      uniform geometry — a real mesh readout vs the R1 benchmark. Honest gap: the
      current tyssue_2d_sheet carries only line-tension / preferred-area, no BM
      stiffness / relaxation / traction, so the BM-dependent confinement test cannot
      run yet (shown as a hypothesis panel); the bare mesh snapshot is an architecture
      thumbnail, not confinement, and the planar z=0 geometry is not a real 3D height.
  - study: bm-r5-explicit-3d-confinement
    role: >
      Explicit 3D monolayer (preliminary). A 206-cell closed mesh with finite,
      conserved per-cell volumes (<0.01% drift) and a per-cell area distribution —
      a geometry verification. Honest gap: tyssue_3d_monolayer has only
      contractility / volume-elasticity, no BM-shell coupling, so the no-BM /
      elastic-BM / relaxing-BM confinement cases are not wired yet (hypothesis panel);
      height is uniform within a run.
  - study: bm-r6-perlecan-growth-perturbations
    role: >
      Carries an inferred collagen lifetime for control, perlecan gain/loss and
      growth-rate conditions through BM relaxation to cell shape, keeping inferred
      and predicted quantities separate. Reproduces Fig 7 — perlecan knockdown
      taller > control > overexpression shorter — after a review-caught correction of
      an inverted perlecan direction (overexpression shortens the collagen lifetime,
      per the paper). The growth-rate axis (faster growth → flatter) is also correct.
  - study: bm-e1-actomyosin-cortex
    role: >
      Extension, engineering verification (not in the paper). A coarse LJ bead cortex
      shows effective tension rising monotonically with the attraction (well-depth)
      PROXY — relabelled honestly as a proxy, not biological myosin activity, with
      seed/size sensitivity. Gap: no explicit filaments/motors, and the LAMMPS model
      exposes no strain input, so force-strain curves are not producible yet.
  - study: bm-e2-actin-adhesion-collagen
    role: >
      Extension, coupling unit-test. Occupancy-gated force transfer (traction =
      occupancy × tension; BM strain-rate = gain × traction) holds BY CONSTRUCTION —
      shown with a real zero-linker control (occupancy/traction → 0) and a bounded
      cortex→adhesion→BM smoke. Gap: force-conserving multiscale coupling and
      integrin mechanics are not established; it is a deterministic mapping, not
      emergent.
  - study: bm-e3-closed-3d-lumenoid
    role: >
      Extension, geometry verification. A closed 78-cell Tyssue shell with a labelled
      basal BM-coupling surface and a single enclosed lumen (section cut + scale).
      Gap: no lumen-filling drive is wired (pressure 0 at rest), so lumen growth and
      BM-regulated morphogenesis are shown as flat/honest, untested.
  - study: bm-e4-feedback-predictions
    role: >
      Extension, coupling control (not a novel prediction yet). Real 3-mode
      reduced-order time courses: two-way returns a nonzero BM reaction (basal_tension
      −0.30, damping contraction) while one-way/uncoupled disable it as designed, and
      BM subcycling converges (|Δσ| 0.066→0.033→0.017). Gaps: explicit LAMMPS BM is
      not in the loop, there is no growth trajectory, and exchange-cadence convergence
      is not wired — correct software wiring, not a mechanistic prediction.

acceptance_criteria:
  - study: bm-v1-stage1-modulus-remodelling
    behavior: >
      The staged protocol runs end-to-end on real LAMMPS, a crosslinked network
      assembles from two-bead rods, the stress-strain ramp yields a finite
      (very soft) elastic modulus, and the chemistry-on hold shows a measurable
      stress relaxation, or a noise-limited null at v1 network size.
  - study: bm-v2-stress-vs-strainrate
    behavior: >
      The ε̇ sweep runs and returns σ(ε̇) and an effective viscosity η per rate,
      with the viscous and elastic regimes identified at v1 parameters.
  - study: bm-v3-junction-bending-rigidity
    behavior: >
      The connectivity sweep shows z stays below 4 and the modulus stays consistent
      with zero, establishing that rigidity requires junction bending / bundling.
  - study: bm-v4-junction-bending
    behavior: >
      Junction bending is implemented and dominates the mechanics (floppy baseline
      ~0 → large |E|); a reproducible modulus is blocked on network size and a
      pre-stress-free measurement.

executive:
  what_is_this: >
    A coarse-grained model of the collagen IV basement membrane, built in Vivarium
    from the AICS lumenoid specification, grown into a reproduction and extension of
    Barrientos et al. (Cell 2026). The reproduction studies target the paper's
    Figures 1 (tissue-mechanics regimes), 2 (collagen rheology + supply) and 7
    (perlecan/growth perturbations); the extension studies add spatial 2D/3D Tyssue
    epithelia, bidirectional LAMMPS–Tyssue coupling, an actomyosin cortex and a
    closed lumenoid. All studies now RUN end-to-end against their real composites
    and carry recorded evidence — but each is scoped honestly by evidence status
    (observed / reproduced / engineered-diagnostic / hypothesis / contradicted, per
    docs/figure-conventions.md), not scored as paper reproduction on a smoke test or
    a geometry screenshot. The membrane-build (v1–v5) and the paper reproductions
    (R1 Fig 1 regime topology, R2 Fig 2E direction, R3 Fig 2B/C supply ordering, R6
    Fig 7 perlecan ordering) are the strongest results; the spatial and extension
    studies are preliminary. R6 reproduces Fig 7 only after a review-caught fix: its
    perlecan direction had been inverted and was corrected against the paper.
  verdict: >
    The membrane model is complete: it reproduces the published elastic modulus and
    separates a reproducible elastic modulus from a reproducible remodelling time,
    giving both as functions of growth rate for an epithelial model to use. Two
    choices remain open, and neither is a flaw in the model — how to fix the
    absolute pascal scale (an energy-scale convention left to the authors), and the
    exact equilibrium crosslink fraction that the authors' monomer exchange and
    distance-gated breaking settle at.
    ---
    The build was checked against the authors' published code and its parameters
    corrected to match. The structure and central-force parameters agree (two-bead
    rods, one NC1 and three 7S crosslinks per protomer, no excluded volume, kT = 1,
    dt = 0.01, break-to-make ratio 0.66, formation probability 0.12, rod stiffness
    200), and the authors additionally stabilize junctions with bending — an NC1
    angle of stiffness 4.0 at 180°, plus 7S angles at 155° and 60°.
    ---
    With the corrected parameters the network is very soft: its elastic modulus is
    small and consistent with zero at this size (about ±1 Pa across seeds), in line
    with the paper's own ≈0.03 Pa. The remodelling mechanism is correct, but the
    relaxation time is below what this network size can resolve.
    ---
    The earlier idea that the network is soft because it is a central-force network
    below the rigidity threshold no longer holds: the published model has junction
    angles, so connectivity alone does not explain its mechanics. Creating those
    angles as the crosslinks form removes the ill-conditioning — the modulus
    becomes positive, reproducible across seeds, and well-behaved. With the angles
    active the network is not floppy; its modulus is finite and depends strongly on
    density.
    ---
    With the angle-stabilized network and the authors' dense starting geometry
    (3.0 rods per σ², a 12σ-thick slab), the model cleanly separates a reproducible
    elastic modulus (about 3 in reduced units, ≈6 Pa) from a reproducible
    remodelling time (about 40–60 in reduced time units); forming-and-breaking and
    forming-only crosslinking agree at about 2.6 crosslinks per rod, so the value is
    well defined where both were previously noise-limited. As the crosslink fraction
    rises, the modulus climbs through the published ≈0.03 Pa near the percolation
    point (around 0.8 crosslinks per rod) and reaches about 8 Pa when saturated — so
    the published softness is a sparse-crosslink state, not a gap in the model, and
    the apparent large discrepancy with the paper disappears.
    ---
    Reproduction campaign (R1–R6). R1 reimplements the paper's reduced-order tissue
    model and recovers the four-regime confinement topology across the two
    dimensionless axes (BM stiffness; relaxation/doubling time). R2, on a dense
    multi-seed network, resolves the stress-relaxation time across the full turnover
    range and reproduces the Figure-2E DIRECTION — τ rises with collagen residence
    time (≈37→102 reduced units over residence 12.5→200), with a turnover-independent
    modulus — scoped as a floor-plus-residence relationship, not a single
    proportional slope. R3 reproduces the Figure-2B/C supply ordering: only combined
    crosslink turnover AND material insertion grows a connected load-bearing network
    (with-insertion > without-insertion > no-remodeling, 3/3 seeds). These are the
    campaign's solid reproductions (direction/ordering, reduced units).
    ---
    R6 reproduces Figure 7 — after a review-caught correction. The figure review
    flagged that the model's perlecan ordering was inverted (it had perlecan
    stabilizing collagen → gain taller). An audit against the paper (Barrientos et
    al. Cell 2026: perlecan promotes collagen IV bond breakage, so overexpression
    SHORTENS the lifetime, measured ~1 h vs ~20 h control, knockdown ~500 h) fixed
    the perlecan_factor direction; the mechanics (relaxation → height) were already
    correct. R6 now reproduces the paper's ordering — perlecan knockdown taller >
    control > overexpression shorter — with a substantial effect (~19% loss-vs-gain).
    This is the figure review doing its job: a decisive sign error found and fixed
    against the source. The spatial (R4/R5) and extension (E1–E4) studies run and are
    preliminary engineering/verification results, not paper reproductions.
  verdict_status: in-progress
  decisions_needed:
    - "Perlecan direction (R6): RESOLVED — verified against the paper (perlecan promotes collagen IV bond breakage; overexpression ~1 h, control ~20 h, knockdown ~500 h lifetime) and the perlecan_factor mapping was inverted so R6 reproduces Fig 7. Left here as a sanity-check item for the expert to confirm the reading."
    - "Reproduction conventions: the article alone does not fix every convention needed to reproduce it. Acquire the supplemental tissue-model equations and the precise Figure 1 parameter values."
    - "Released turnover kinetics: pin down the grand-canonical monomer exchange, the distance-gated breaking, the 7S-specific mechanics, and the original stress-to-energy conversion before freezing the collagen reference."
    - "Collagen supply law: a fixed concentration (for reproducing the paper) or a secretion flux (for the lumenoid hypothesis). Decide per study."
    - "3D calibration data: obtain lumenoid geometry over time, cell height and volume, membrane thickness, and collagen-versus-laminin staining before calibrating the 3D models."
    - "Actin fidelity: use a validated reduced cortical model unless a molecularly-resolved actin cortex changes a measurable prediction. An explicit go/no-go call."
    - "Composite modularity: keep the collagen-network composites as thin selections over one general, parameterized network builder (chemistry, bending stiffness, density, and strain protocol as configuration), rather than near-duplicate generators."
    - "Absolute modulus in pascals: the angle-stabilized model reproduces the published ≈0.03 Pa and gives a reproducible modulus in reduced units (E ≈ 3 LJ). An exact value in pascals additionally needs the released monomer exchange, the distance-gated 7S break (0.95), and the dense starting configuration — or accept the reduced-unit value and settle the energy-scale choice below."
    - "Engine for the early stages: LAMMPS now, with Smoldyn revisited when surface binders are added."
    - "Energy scale: report the modulus in pascals (fit to a measured modulus) or keep kT units and report a ratio."
    - "Coupling contract: which vertex-model term receives the membrane — a basal tension, a mobility, or an elastic spring."
    - "Linker values: density, spring constant, and off-rate; sweep the off-rate as a multiple of the crosslink break rate."
    - "Growth rate: extract ε̇ from the lumenoid radius over time (still needed)."
    - "Slab thickness and layer count (one z-stack away)."
    - "Which readout calibrates and which validates: the remodelling time calibrates the formation probability and the time unit, so it cannot also validate."

glossary:
  - term: protomer
    definition: One collagen IV triple-helical molecule (~376 nm end-to-end); modelled as one two-bead rod.
  - term: NC1 / 7S
    definition: The two crosslinking ends of a protomer. NC1 binds one partner, 7S binds three.
  - term: remodelling time
    definition: The viscous stress-relaxation time set by crosslink make/break kinetics; calibrated to the ≈20 h collagen IV lifetime.
  - term: ε̇ (epsilon-dot)
    definition: Equibiaxial in-plane strain rate. A sphere of radius R growing at Ṙ stretches its shell at ε̇ = Ṙ/R.

expert_docs:
  - basement-membrane-v1-spec

# Investigation-provided inputs (expert-sanctioned). The Barrientos Cell paper and
# the collagen-network sources back the reproduction campaign; joined against
# references/papers.bib.
inputs:
  references:
    - barrientos2026cellshape       # Basement membrane turnover controls cell shape (Cell 2026)
    - barrientos2026basement        # BM growth under fixed stress (stage-2 framing)
    - barrientos2026code            # released LAMMPS input scripts (Zenodo)
    - meadowcroft2025nonequilibrium # coarse-grained collagen IV network the build is based on
  datasets: []
  expert_docs:
    - basement-membrane-v1-spec

# Comparative framing (rigor): name the alternative interpretive lenses.
competing_frameworks:
  - name: "Effective constitutive BM (reduced-order viscoelastic law)"
    relation: "interchangeable reduced-order alternative to the explicit LAMMPS collagen BM; used where resolved mechanics are unnecessary (R1, R4, E3 first pass)"
  - name: "Imposed one-way / uniform-material tissue mechanics (the paper's homogeneous model)"
    relation: "baseline that the spatial + bidirectionally-coupled models (R4–R6, E4) must beat or recover as a limit"
  - name: "Molecularly-resolved actomyosin (explicit filaments/motors)"
    relation: "fidelity alternative to the effective Tyssue cortical-energy term; adopted (E1) only if it changes a measurable prediction"

# Controls / validation / reporting contract (plan §7). Investigation-wide rules.
guidelines:
  controls:
    - "Mechanistic controls: no BM, purely elastic BM, remodeling BM, no supply, no crosslink turnover, inactive actin, fixed basal linkers, one-way vs two-way coupling."
    - "Numerical verification: unit tests, angle/topology checks, network connectivity, force + energy balance, coupling convergence, timestep sensitivity, ≥ several random seeds."
  validation_distinction:
    - "Reproduce source panels with the original parameter conventions; treat unrelated BM material measurements as analog comparators, not direct biological validation."
    - "Keep inferred quantities (from the fluorescent-timer observation model) distinct from independently predicted quantities (from the mechanical model). Do not claim to simulate the timer experiment biologically unless its observation model is included."
  readouts:
    - "height/basal-area distributions, area expansion, cell division, force maps, BM connectivity, mass/area, molecule ages, stress relaxation, lumen radius."
  evidence_format:
    - "Every study records: question, model version, parameters, protocols, controls, outcome figures, uncertainty, and a conclusion tagged reproduction | verification | prediction."
  modularity:
    - "Reuse a small set of general, configurable processes across composites. A composite selects and parameterises processes rather than duplicating logic, and new engine pieces follow the same discipline."

