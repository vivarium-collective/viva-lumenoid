schema_version: 2
name: basement-membrane-v1
title: "From collagen IV turnover to multiscale epithelial morphogenesis (BM v1 → lumenoid)"
created: "2026-09-30"
status: running
lead: eran

question: >
  How does collagen IV molecular turnover set basement-membrane (BM) stress
  relaxation, and how do BM mechanics, epithelial growth and actomyosin mechanics
  jointly determine epithelial cell height and lumenoid morphology? (The original
  v1 sub-question — the effective modulus E(ε̇) and remodelling time τ(ε̇) a growing
  boundary produces, the two numbers the AICS vertex model couples to — is the
  P0/P1 reproduction core this campaign now builds on.)

hypothesis: >
  Molecular collagen IV turnover sets the BM's viscoelastic relaxation time, and
  that relaxation — relative to the epithelial doubling time — controls growth-
  dependent cell confinement (Barrientos et al., Cell 2026). Replacing homogeneous
  tissue mechanics with spatially-resolved 2D/3D Tyssue epithelia, bidirectional
  LAMMPS–Tyssue coupling and explicit actomyosin should connect these quantities
  through forces rather than imposed constitutive assumptions, and predict when
  growth rate, BM supply, contractility and curvature change cell height and
  lumenoid growth beyond the paper.
  ---
  Reproduction core (P0/P1): a standalone collagen IV network, coarse-grained at
  the fiber scale (one protomer = one two-bead rod, stochastic NC1/7S crosslinks,
  no excluded volume), reproduces the Meadowcroft/Barrientos regime — a very soft
  elastic modulus (≈0.03 Pa published) and a crosslink-turnover-limited relaxation
  time calibratable to the ≈20 h collagen IV lifetime — and its E(ε̇)/τ(ε̇) feed the
  vertex model (offline coupling first).

description: |
  This investigation is the clean-room Vivarium build of the AICS-Lumenoids
  "Basement membrane — v1 model specification" (Roam graph, exported 2026-09-30;
  the source spec and diagram are in `workspace/references/`). Every model
  parameter is transcribed from the spec's parameter sheet and labelled as such.
  The authors' LAMMPS input scripts are now public
  (github.com/Billie1717/BasementMembraneTurnoverSims, Zenodo
  10.5281/zenodo.20719515, commit `ab4c004`); this build remains a transcription
  from the spec rather than a port of those scripts, and they are the ground
  truth to cross-check its parameters against (not yet done — decision below).

  **Engines.** The workspace imports two already-wrapped simulators —
  `viva-lammps` (the `LAMMPSProcess` bridge) and `viva-smoldyn` — and builds the
  collagen IV network on top of the real LAMMPS engine. LAMMPS runs stages 1–2
  (rigid rods, junction flexibility); Smoldyn is held for stage 3 (flexible
  fibers + surface binders) per spec decision #2.

  **Staged build (spec "v1 build").**
    - Stage 1 — reproduce the paper; separate elastic from viscous. Stretch,
      hold, then switch the crosslink chemistry on. Reports an elastic modulus
      and a stress-relaxation time.  ← this investigation's first study.
    - Stage 2 — growing substrate (flat): impose equibiaxial strain rate ε̇,
      read off σ(ε̇); an effective viscosity η = σ/ε̇ and the rate at which the
      response turns elastic.
    - Stage 3 — add the cell–BM linker (surface-attached springs, constant
      off-rate). Smoldyn's surface binders land here.
    - Stage 4 — curvature (only if stages 2–3 depend on R beyond ε̇ = Ṙ/R).

  **Coupling route (spec decision).** Offline first: tabulate the BM's modulus
  and remodelling time against growth rate and hand them to the vertex model.
  Then direct: vertex-mesh surface velocities drive the BM substrate, BM stress
  feeds back, exchanged every N vertex steps.

  **Visualization (reviewer round 1, 2026-10-07).** Each study's Simularium
  trajectory now embeds its diagnostic plots directly (stress-vs-strain, the
  stress/strain time series, crosslinks) and draws the periodic simulation box
  as a per-frame outline that deforms with the imposed strain. The stretch
  movies are made coherent (each bead at its nearest periodic image of the
  network centroid), so boundary crossings no longer teleport across timepoints.
  See `feedback/` for the imported reviewer file.

  **Upgrade campaign (2026-10-19) — from BM reproduction to multiscale
  morphogenesis.** With Barrientos et al. ("Basement membrane turnover controls
  cell shape", Cell 2026, 189:5611–5624) now published, this investigation is
  reframed from "the two numbers the vertex model needs" into a staged
  reproduction+extension campaign. Strategy: first reproduce the published tissue
  and collagen-network results quantitatively (R1–R3), then replace homogeneous
  tissue mechanics with spatial 2D/3D Tyssue models and bidirectional LAMMPS–Tyssue
  coupling (R4–R6), then add explicitly-modelled actomyosin and a closed lumenoid
  geometry (E1–E4). Reproduction, verification and new predictions are reported
  separately.

  **Coupling hierarchy (interchangeable, not additive).** 2D planar Tyssue sheet
  (+ BM traction/area law, height via a prism relation) → 2D cross-section → 3D
  monolayer (apical/basal/lateral surfaces + volume constraints) → closed 3D
  lumenoid (lumen volume/pressure + BM shell). Mechanical contract: epithelial
  basal geometry/displacements pass to the BM; the BM returns reaction
  forces/traction to the basal DOFs. Effective constitutive BM and explicit LAMMPS
  BM are interchangeable alternatives, never additive parallel forces.

  **Execution gates.** P0 — retire superseded BM claims; frozen faithful reference
  settings + reproducible R2 stress tests. P1 — direct numerical reproduction of
  Figures 1–2 (R1–R3). P2 — verified 2D/3D Tyssue studies (R4–R5); cell-height and
  area response. P3 — bidirectional basal-force coupling with convergence and
  reduced-order agreement. P4 — actin (E1–E2), closed lumenoid (E3), new predictive
  perturbations (E4). The existing bm-v1…v5 studies are the P0 reproduction core:
  bm-v3 is retained as a counterfactual (central-force) control, and bm-v4's native
  junction angles fold into the faithful reference rather than being a novel
  ingredient. The superseded "floppy because junction angles are absent" narrative
  is retired by the released-code cross-check (see executive findings 3–6).

  **Engine note.** The downstream epithelial vertex model is `vivarium-tyssue`,
  imported into the workspace as an optional dev sibling engine (R4–R6, E3–E4 build
  on it). The collagen/actin LAMMPS processes run on `viva-lammps`.

  **Driving schema.** The campaign is framed by the Barrientos et al. three-model
  chain — collagen IV turnover (timer) → BM relaxation (network) → cell shape
  (tissue mechanics) — reproduced as `viz/driving_schema.html` and mapped to our
  studies: R6 realizes the timer/turnover model, R2/R3 the collagen network, and
  R1/R4/R5 the tissue mechanics.

# Investigation-level driving figure (the three-model framework).
visualizations:
  - name: driving_schema
    address: "html:viz/driving_schema.html"
    config:
      title: "Driving schema — collagen IV turnover → BM relaxation → cell shape"
      caption: >
        The three-model framework from Barrientos et al. (Cell 2026), mapped to
        this campaign's studies. The collagen timer sets how fast collagen turns
        over; the collagen network makes membrane relaxation track that turnover;
        and the tissue-mechanics model makes cell shape follow membrane relaxation.

studies:
  - bm-v1-stage1-modulus-remodelling
  - bm-v2-stress-vs-strainrate
  - bm-v3-junction-bending-rigidity
  - bm-v4-junction-bending
  - bm-v5-porosity-bundling
  # --- Reproduction campaign (Barrientos et al., Cell 2026) — gates P0→P2 ---
  - bm-r1-published-tissue-baseline
  - bm-r2-collagen-network-rheology
  - bm-r3-network-expansion-supply
  - bm-r4-coupled-2d-epithelium
  - bm-r5-explicit-3d-confinement
  - bm-r6-perlecan-growth-perturbations
  # --- Mechanistic extension campaign (new predictions) — gates P3→P4 ---
  - bm-e1-actomyosin-cortex
  - bm-e2-actin-adhesion-collagen
  - bm-e3-closed-3d-lumenoid
  - bm-e4-feedback-predictions

at_a_glance:
  - study: bm-v1-stage1-modulus-remodelling
    role: >
      Stage 1 + the cross-check headline. Runs the staged protocol with the
      parameters corrected to the released code. Modulus is very soft, consistent
      with zero at v1 size (~±1 Pa) and with the published ≈0.03 Pa; the remodelling
      mechanism is correct but τ is below detection at v1 scale. Carries the
      cross-check and modulus-ladder figures.
  - study: bm-v2-stress-vs-strainrate
    role: >
      Stage 2 + the coupling deliverable. Sweeps the equibiaxial growth rate ε̇ and,
      from the faithful density-calibrated model, tabulates the effective modulus
      E(ε̇) (≈7→11 Pa, stiffening with rate) and remodelling time τ(ε̇) (≈36–51 τ,
      ≈constant) — the two numbers the AICS vertex model takes (offline coupling).
  - study: bm-v3-junction-bending-rigidity
    role: >
      Follow-up (explanation superseded). The rigidity-percolation story is retired
      by the cross-check: the released model has junction angles, so it is not a
      central-force network and z<4 does not explain its softness. The sweep now
      documents only that our angles-off transcription is sub-isostatic and soft.
  - study: bm-v4-junction-bending
    role: >
      Follow-up (reframed). Bending is a released feature (NC1 k=4.0), not an add-on.
      Swept around k=4.0: our as-formed-restraint realization is ill-conditioned and
      bending does not make the network stiff — the released model has the angles and
      is still soft. A faithful run needs angles active during assembly.
  - study: bm-v5-porosity-bundling
    role: >
      Geometric readouts (spec "has: geometrical structure"). Reads porosity +
      bundling off the real network against measured BM. Pore diameter reaches the
      corneal-EM band (72 ± 40 nm) at realistic density; the NC1/7S-only topology
      under-bundles (mean ~1 protomer/strand, below the measured 5–7), because the
      released model has no lateral-association bond. Carries the evidence map.
  - study: bm-r1-published-tissue-baseline
    role: >
      Reimplements the paper's homogeneous tissue model — a fixed-volume cell
      against a viscoelastic membrane — and recovers the four confinement regimes by
      varying membrane stiffness and its relaxation time. The simple reference the
      spatial models are compared against.
  - study: bm-r2-collagen-network-rheology
    role: >
      Drives the collagen network through the paper's loading protocol at several
      turnover rates, tracking molecular residence time and stress relaxation
      separately, to reproduce the stress traces and the relaxation-versus-turnover
      slope.
  - study: bm-r3-network-expansion-supply
    role: >
      Compares no remodelling, remodelling without new collagen, and remodelling
      with supply from one starting state, reproducing the paper's ordering of
      network area, concentration, and connectivity.
  - study: bm-r4-coupled-2d-epithelium
    role: >
      A 2D epithelial sheet with a membrane area law set from the network rheology.
      Its homogeneous limit must match the tissue baseline; it then tests whether the
      regimes survive explicit cell shapes and uneven growth.
  - study: bm-r5-explicit-3d-confinement
    role: >
      A 3D monolayer where cell height and basal area emerge directly. Cases with no
      membrane, an elastic membrane, and a relaxing membrane isolate what membrane
      relaxation contributes to cell height, and set up the lumenoid.
  - study: bm-r6-perlecan-growth-perturbations
    role: >
      Carries inferred collagen-lifetime distributions for the control, perlecan
      gain and loss, and growth-rate conditions through relaxation to shape, and
      reproduces the paper's intervention ordering while keeping inferred and
      predicted quantities separate.
  - study: bm-e1-actomyosin-cortex
    role: >
      A new study, not in the paper: a coarse actomyosin cortex whose tension and
      relaxation are measured so they can stand in for the epithelial model's
      cortical energy.
  - study: bm-e2-actin-adhesion-collagen
    role: >
      A new study: an active cortex coupled through reversible basal adhesions to a
      collagen patch in one cell, measuring the transmitted traction, the fraction of
      bound adhesions, and the membrane's deformation, before scaling to many cells.
  - study: bm-e3-closed-3d-lumenoid
    role: >
      A new study: a closed curved epithelium with a lumen pressure and a membrane
      shell, using an effective membrane first and a resolved collagen patch later,
      to predict how curvature shapes lumen growth and cells.
  - study: bm-e4-feedback-predictions
    role: >
      A new study: tests growth-driven turnover, uneven membranes,
      contractility-dependent confinement, and partial adhesion or network failure
      against matched controls — the predictions that go beyond the paper.

acceptance_criteria:
  - study: bm-v1-stage1-modulus-remodelling
    behavior: >
      The staged protocol runs end-to-end on real LAMMPS, a crosslinked network
      assembles from two-bead rods, the stress-strain ramp yields a finite
      (very soft) elastic modulus, and the chemistry-on hold shows a measurable
      stress relaxation, or a noise-limited null at v1 network size.
  - study: bm-v2-stress-vs-strainrate
    behavior: >
      The ε̇ sweep runs and returns σ(ε̇) and an effective viscosity η per rate,
      with the viscous and elastic regimes identified at v1 parameters.
  - study: bm-v3-junction-bending-rigidity
    behavior: >
      The connectivity sweep shows z stays below 4 and the modulus stays consistent
      with zero, establishing that rigidity requires junction bending / bundling.
  - study: bm-v4-junction-bending
    behavior: >
      Junction bending is implemented and dominates the mechanics (floppy baseline
      ~0 → large |E|); a reproducible modulus is blocked on network size and a
      pre-stress-free measurement.

executive:
  what_is_this: >
    A coarse-grained model of the collagen IV basement membrane, built in Vivarium
    from the AICS lumenoid specification. The network runs on a slowly growing
    boundary until it reports an elastic modulus and a remodelling time — the two
    numbers an epithelial vertex model needs to couple to a membrane. The project
    has since grown into a reproduction and extension of Barrientos et al. (Cell
    2026): the reproduction studies recover the paper's Figures 1 and 2 and extend
    to spatial 2D and 3D epithelia with two-way coupling, and the extension studies
    add an actomyosin cortex, a closed lumenoid, and new predictions. The membrane
    reproduction is complete; the spatial and extension studies are at the design
    stage.
  verdict: >
    The membrane model is complete: it reproduces the published elastic modulus and
    separates a reproducible elastic modulus from a reproducible remodelling time,
    giving both as functions of growth rate for an epithelial model to use. Two
    choices remain open, and neither is a flaw in the model — how to fix the
    absolute pascal scale (an energy-scale convention left to the authors), and the
    exact equilibrium crosslink fraction that the authors' monomer exchange and
    distance-gated breaking settle at.
    ---
    The build was checked against the authors' published code and its parameters
    corrected to match. The structure and central-force parameters agree (two-bead
    rods, one NC1 and three 7S crosslinks per protomer, no excluded volume, kT = 1,
    dt = 0.01, break-to-make ratio 0.66, formation probability 0.12, rod stiffness
    200), and the authors additionally stabilize junctions with bending — an NC1
    angle of stiffness 4.0 at 180°, plus 7S angles at 155° and 60°.
    ---
    With the corrected parameters the network is very soft: its elastic modulus is
    small and consistent with zero at this size (about ±1 Pa across seeds), in line
    with the paper's own ≈0.03 Pa. The remodelling mechanism is correct, but the
    relaxation time is below what this network size can resolve.
    ---
    The earlier idea that the network is soft because it is a central-force network
    below the rigidity threshold no longer holds: the published model has junction
    angles, so connectivity alone does not explain its mechanics. Creating those
    angles as the crosslinks form removes the ill-conditioning — the modulus
    becomes positive, reproducible across seeds, and well-behaved. With the angles
    active the network is not floppy; its modulus is finite and depends strongly on
    density.
    ---
    With the angle-stabilized network and the authors' dense starting geometry
    (3.0 rods per σ², a 12σ-thick slab), the model cleanly separates a reproducible
    elastic modulus (about 3 in reduced units, ≈6 Pa) from a reproducible
    remodelling time (about 40–60 in reduced time units); forming-and-breaking and
    forming-only crosslinking agree at about 2.6 crosslinks per rod, so the value is
    well defined where both were previously noise-limited. As the crosslink fraction
    rises, the modulus climbs through the published ≈0.03 Pa near the percolation
    point (around 0.8 crosslinks per rod) and reaches about 8 Pa when saturated — so
    the published softness is a sparse-crosslink state, not a gap in the model, and
    the apparent large discrepancy with the paper disappears.
  verdict_status: in-progress
  decisions_needed:
    - "Reproduction conventions: acquire the supplemental tissue-model equations and precise Figure 1 parameter values — the article alone does not fix every reproduction convention (gates R1)."
    - "Released turnover kinetics: resolve the full GCE-style monomer-exchange / distance-gated-break implementation, the 7S-specific mechanics, and the original stress/energy conversion before freezing the R2 reference (P0)."
    - "Collagen supply law: fixed-concentration (reference reproduction, R3) vs secretion-flux-driven (new lumenoid hypothesis, E3/E4) — decide per study."
    - "3D calibration data: obtain lumenoid geometry timecourses, cell height/volume, BM thickness and collagen-vs-laminin staining before calibrating R5/E3."
    - "Actin fidelity: use a validated reduced cortical model (Tyssue cortical energy) unless molecularly-resolved actin (E1) changes a measurable prediction — explicit go/no-go decision."
    - "Process/composite modularity: converge the collagen-network composites on ONE general, parameterized network builder reused across stage1/stage2/R2/R3 (chemistry, bending_k, density, strain protocol as config) rather than near-duplicate generators."
    - "Absolute (Pa) modulus path: the faithful angle-stabilized model now reproduces the published ≈0.03 Pa and gives a reproducible reduced-unit modulus (bm-v4, E≈3 LJ). An EXACT absolute value additionally needs the released GCE + distance-gated 7S break (0.95) + dense initial config — implement these, or accept the reduced-unit value and resolve via the energy-scale decision (#4)? (Cross-check + param correction already DONE 2026-10-01; see references/cross-check-vs-released-code.md.)"
    - "Engine for stages 1–2: LAMMPS now; revisit Smoldyn at stage 3 (spec #2)."
    - "Secretion: fixed concentration vs fixed flux (spec #3)."
    - "Energy scale: report modulus in Pa (fit to a measured modulus) or keep kT and report a ratio (spec #4)."
    - "Coupling contract: which vertex-model term receives the BM — basal tension, mobility, or elastic spring (spec #5)."
    - "Linker values: density, spring constant, off-rate; sweep off-rate as a multiple of the crosslink break rate (spec #6)."
    - "Growth rate ε̇ from the lumenoid radius time course — still requested (spec #7)."
    - "Slab thickness / layer count — one z-stack away (spec #9)."
    - "Which readout calibrates vs validates — remodelling time calibrates MP and the time unit, so it cannot also validate (spec #10)."

glossary:
  - term: protomer
    definition: One collagen IV triple-helical molecule (~376 nm end-to-end); modelled as one two-bead rod.
  - term: NC1 / 7S
    definition: The two crosslinking ends of a protomer. NC1 binds 1 partner (hexamer), 7S binds 3 (tetramer/spider).
  - term: remodelling time
    definition: The viscous stress-relaxation time set by crosslink make/break kinetics; calibrated to the ≈20 h collagen IV lifetime.
  - term: ε̇ (epsilon-dot)
    definition: Equibiaxial in-plane strain rate. A sphere of radius R growing at Ṙ stretches its shell at ε̇ = Ṙ/R.

expert_docs:
  - basement-membrane-v1-spec

# Investigation-provided inputs (expert-sanctioned). The Barrientos Cell paper and
# the collagen-network sources back the reproduction campaign; joined against
# references/papers.bib.
inputs:
  references:
    - barrientos2026cellshape       # Basement membrane turnover controls cell shape (Cell 2026)
    - barrientos2026basement        # BM growth under fixed stress (stage-2 framing)
    - barrientos2026code            # released LAMMPS input scripts (Zenodo)
    - meadowcroft2025nonequilibrium # coarse-grained collagen IV network the build is based on
  datasets: []
  expert_docs:
    - basement-membrane-v1-spec

# Comparative framing (rigor): name the alternative interpretive lenses.
competing_frameworks:
  - name: "Effective constitutive BM (reduced-order viscoelastic law)"
    relation: "interchangeable reduced-order alternative to the explicit LAMMPS collagen BM; used where resolved mechanics are unnecessary (R1, R4, E3 first pass)"
  - name: "Imposed one-way / uniform-material tissue mechanics (the paper's homogeneous model)"
    relation: "baseline that the spatial + bidirectionally-coupled models (R4–R6, E4) must beat or recover as a limit"
  - name: "Molecularly-resolved actomyosin (explicit filaments/motors)"
    relation: "fidelity alternative to the effective Tyssue cortical-energy term; adopted (E1) only if it changes a measurable prediction"

# Controls / validation / reporting contract (plan §7). Investigation-wide rules.
guidelines:
  controls:
    - "Mechanistic controls: no BM, purely elastic BM, remodeling BM, no supply, no crosslink turnover, inactive actin, fixed basal linkers, one-way vs two-way coupling."
    - "Numerical verification: unit tests, angle/topology checks, network connectivity, force + energy balance, coupling convergence, timestep sensitivity, ≥ several random seeds."
  validation_distinction:
    - "Reproduce source panels with the ORIGINAL parameter conventions; treat unrelated BM material measurements as analog comparators, not direct biological validation."
    - "Keep INFERRED quantities (from the fluorescent-timer observation model) distinct from INDEPENDENTLY PREDICTED quantities (from the mechanical model). Do not claim to simulate the timer experiment biologically unless its observation model is included."
  readouts:
    - "height/basal-area distributions, area expansion, cell division, force maps, BM connectivity, mass/area, molecule ages, stress relaxation, lumen radius."
  evidence_format:
    - "Every study records: question, model version, parameters, protocols, controls, outcome figures, uncertainty, and a conclusion tagged reproduction | verification | prediction."
  modularity:
    - "Reuse existing processes across composites (one general CollagenNetworkProcess + StagedStretchController, config-driven); composites are thin wirings that select processes + params, never duplicated logic. Tyssue/actin processes are new modular units with the same discipline."

