        diagnostic, Coupling and redundant movies to supporting views. Annotate negative/unstable regimes and
        unresolved rate dependence rather than asserting stiffening.
    - section: tests
      disposition: revise
      note: Compare rates at matched total strain, include >=3 independent seeds and confidence intervals;
        vary hold durations; compare force-control and displacement-control where possible; report inability
        to infer an effective viscosity if no steady viscous regime exists.
