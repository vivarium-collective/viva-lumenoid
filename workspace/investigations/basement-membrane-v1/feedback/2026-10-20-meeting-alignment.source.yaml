feedback_report:
  investigation: basement-membrane-v1
  title: From collagen IV turnover to multiscale epithelial morphogenesis (BM v1 -> lumenoid)
  reviewer: Scientific modeling review based on Eran/Tasnif/Saurabh meeting transcript
  date: '2026-10-20'
  overall:
    disposition: revise
    note: 'Refocus first deliverable on the simplest two-way feedback experiment: increase preferred epithelial
      area/volume (not realized area), let cells mechanically deform BM, return BM reaction to cells, measure
      realized expansion and cell height. Distinguish growth from cell division. Stage planar/sectional 2D
      -> true 3D monolayer -> pre-formed closed 3D lumen. Keep new lumen geometry/volume separate from model-side
      lumen elasticity. Explicit actin, osmosis, spatial BM thickness and pressure are follow-on branches,
      not prerequisites. Mark engine/smoke-test passed separately from scientific reproduction.'
  sections:
  - section: exec-summary
    disposition: revise
    note: Recenter summary on preferred versus realized growth and the causal cell->BM strain->BM reaction->cell-height
      mechanism; add what is demonstrated vs not yet shown. Ensure central focus is first 2D complete feedback
      then 3D monolayer, then already-closed lumenoid.
  - section: synthesis-gaps
    disposition: revise
    note: 'Add prioritized dependencies: (1) preferred area/volume growth with proliferation off, (2) constitutive
      BM coupling controls, (3) resolved LAMMPS force transfer, (4) 3D monolayer, (5) closed lumen geometry
      + separate volume elasticity, (6) pressure/osmosis, curvature and nonuniform BM thickness. Add team-requested
      focused plan/visualization requirements and cite references pending from Tasnif.'
  - section: validation
    disposition: revise
    note: 'Define mechanistic acceptance: zero preferred growth -> no growth-driven BM strain; BM-off -> preferred
      growth largely realized; stiff BM -> gap between target and actual; relaxation reduces reaction; 2D->3D
      comparison; geometry volume derivative/elastic pressure checks. Explicitly distinguish model implementation
      success from paper finding reproduction.'
